* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(1100px 520px at 12% -10%, rgba(217, 178, 107, 0.10), transparent 60%),
    radial-gradient(900px 480px at 110% 10%, rgba(59, 88, 160, 0.18), transparent 55%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

.app-shell {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 20px 64px;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 22px;
  margin-bottom: 26px;
  border-bottom: 1px solid var(--border-soft);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid rgba(217, 178, 107, 0.35);
  flex: none;
}
.brand-name { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em; }
.brand-tag { font-size: 0.8rem; color: var(--ink-dim); margin-top: 2px; }
.header-count {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  padding: 6px 12px;
  border-radius: 999px;
}

.app-main {
  display: grid;
  grid-template-columns: minmax(0, 460px) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
@media (max-width: 900px) {
  .app-main { grid-template-columns: 1fr; }
}

.tweet-col { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 20px; }
@media (max-width: 900px) { .tweet-col { position: static; } }

.tweet-card {
  background: linear-gradient(180deg, var(--surface-raised), var(--surface));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px 22px 16px;
  box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.7), 0 1px 0 rgba(255,255,255,0.02) inset;
}
.tweet-head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
.tweet-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 30% 25%, #2a3868, #10162a);
  border: 1.5px solid var(--gold);
  color: var(--gold-bright);
  flex: none;
}
.tweet-identity { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.tweet-name { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
.tweet-badge { color: var(--gold); font-size: 0.8rem; }
.tweet-handle { font-size: 0.82rem; color: var(--ink-faint); }

.tweet-body { display: flex; flex-direction: column; gap: 12px; }
.tweet-body p {
  margin: 0;
  font-size: 0.94rem;
  line-height: 1.55;
  white-space: pre-wrap;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.tweet-body .tweet-title {
  font-family: var(--font-display);
  font-size: 1.12rem;
  font-weight: 600;
  line-height: 1.35;
  color: var(--gold-bright);
}

.tweet-footer {
  display: flex;
  gap: 22px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
  color: var(--ink-faint);
  font-size: 0.82rem;
}
.tweet-icon { display: inline-flex; align-items: center; gap: 5px; }
.tweet-icon b { color: var(--ink-dim); font-weight: 600; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

.tweet-actions { display: flex; }
.clipboard-fallback { position: absolute; left: -9999px; display: none; }

.btn {
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 12px 18px;
  font-size: 0.92rem;
  font-weight: 600;
  transition: transform 0.12s ease, filter 0.12s ease, background 0.12s ease;
}
.btn:active { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }

.btn-secondary {
  background: var(--surface-hover);
  color: var(--ink);
  border: 1px solid var(--border);
  width: 100%;
}
.btn-secondary:hover { filter: brightness(1.12); }

.btn-primary {
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: #241a06;
  width: 100%;
  box-shadow: 0 10px 26px -12px rgba(217, 178, 107, 0.55);
  font-size: 0.98rem;
}
.btn-primary:hover { filter: brightness(1.06); }

.control-col { display: flex; flex-direction: column; gap: 16px; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  padding: 18px 20px;
}
.panel-muted { background: transparent; border-style: dashed; }
.panel-title {
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
}

.tier-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tier-chip {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: var(--ink-dim);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: filter 0.12s ease, background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.tier-chip:hover { filter: brightness(1.15); }
.tier-chip.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold-bright);
}
.tier-hint { margin: 12px 0 0; font-size: 0.78rem; color: var(--ink-faint); line-height: 1.5; }

.riskgauge-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 10px; }
.riskgauge-label { font-size: 0.85rem; color: var(--ink-dim); }
.riskgauge-value { font-family: var(--font-mono); font-size: 0.85rem; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
.riskgauge-track {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(90deg, #2a8f66, #c9a23a, #d9603f);
  opacity: 0.9;
}
.riskgauge-fill { display: none; }
.riskgauge-marker {
  position: absolute;
  top: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ink);
  border: 3px solid var(--bg);
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1px var(--gold);
}
.riskgauge-detail {
  margin: 12px 0 0;
  font-size: 0.82rem;
  color: var(--ink-dim);
  line-height: 1.5;
}
.riskgauge-detail b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.riskgauge-detail b.pos { color: var(--positive); }
.riskgauge-detail b.neg { color: var(--negative); }
.riskgauge-bound { color: var(--ink-faint); }

.alloc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.alloc-row {
  display: grid;
  grid-template-columns: 10px 1fr auto auto;
  align-items: center;
  column-gap: 10px;
  row-gap: 6px;
}
.alloc-swatch { width: 10px; height: 10px; border-radius: 50%; }
.alloc-name { font-size: 0.87rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alloc-cat { font-size: 0.72rem; color: var(--ink-faint); grid-column: 2; margin-top: -4px; }
.alloc-pct {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--gold-bright);
  font-variant-numeric: tabular-nums;
  justify-self: end;
}
.alloc-bar-track {
  grid-column: 1 / -1;
  height: 5px;
  border-radius: 999px;
  background: var(--border-soft);
  overflow: hidden;
}
.alloc-bar-fill { height: 100%; border-radius: 999px; }

.chart-title-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chart-title { font-family: var(--font-display); font-size: 0.95rem; font-weight: 600; color: var(--ink); }
.chart-legend { font-size: 0.74rem; color: var(--ink-faint); display: inline-flex; align-items: center; gap: 6px; }
.chart-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 8px; }
.chart-legend .dot:first-child { margin-left: 0; }

.chart-area { position: relative; height: 168px; display: flex; align-items: stretch; padding: 0 4px; }
.chart-baseline { position: absolute; left: 0; right: 0; height: 1px; background: var(--border); }
.bar-col {
  position: relative;
  flex: 1;
  min-width: 0;
  cursor: default;
  border-radius: 6px;
}
.bar-col:hover, .bar-col:focus-visible { background: var(--gold-dim); }
.bar-fill {
  position: absolute;
  left: 22%;
  right: 22%;
  border-radius: 3px;
  min-height: 2px;
}
.bar-fill.pos { background: var(--positive); }
.bar-fill.neg { background: var(--negative); }
.bar-value {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.bar-value.pos { color: var(--positive); }
.bar-value.neg { color: var(--negative); }
.bar-year {
  position: absolute;
  bottom: -22px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-faint);
}

.fine-print { font-size: 0.78rem; line-height: 1.55; color: var(--ink-faint); margin: 0; }

@media (max-width: 460px) {
  .app-shell { padding: 18px 14px 48px; }
  .tweet-card { padding: 18px 16px 14px; }
}
</style>

tefeuille \u2014 et pas n'importe laquelle : la sant\xE9 est l'un des secteurs les plus r\xE9sistants en cas de crise.","Si le portefeuille doit avoir une jambe actions, autant que ce soit la plus solide historiquement."]},{id:"or",pct:20,pourquoi:["Le filet de s\xE9curit\xE9 final, celui qui ne d\xE9pend ni des taux d'int\xE9r\xEAt ni de la sant\xE9 des entreprises.","Compl\xE8te la logique d\xE9fensive avec une protection d'un tout autre type que les obligations."]}]},{assets:[{id:"fonds_euros",pct:45,pourquoi:["La moiti\xE9 du portefeuille reste sur la valeur la plus s\xFBre \u2014 le reste peut respirer un peu.","Le socle qui permet aux trois autres lignes d'exister sans mettre en danger l'ensemble."]},{id:"foncieres_etf",pct:15,pourquoi:["Une petite dose d'immobilier cot\xE9 pour aller chercher un peu plus de rendement \u2014 en quantit\xE9 limit\xE9e, volontairement.","15% seulement : de quoi profiter du rendement immobilier sans subir sa pleine volatilit\xE9."]},{id:"strat_dividendes",pct:25,pourquoi:["Des entreprises qui paient (et augmentent) leur dividende depuis des ann\xE9es \u2014 le profil actions le plus proche de l'esprit d\xE9fensif.","La brique \xAB revenu r\xE9gulier \xBB du portefeuille, coh\xE9rente avec la logique de stabilit\xE9."]},{id:"or",pct:15,pourquoi:["La protection qui ne d\xE9pend d'aucune des trois autres lignes \u2014 utile si les taux ou l'immobilier tournent mal en m\xEAme temps.","Vient couvrir un sc\xE9nario qu'aucun des trois autres actifs ne couvre seul."]}]}]},{id:"anti_inflation",tierKey:"defensif",label:"L'Anti-Inflation",accroches:["Ce portefeuille n'existe pas pour battre le march\xE9. Il existe pour que ton argent garde sa valeur.","Ici, aucune ligne n'est \xE9mise par une banque centrale.","La th\xE8se est simple : prot\xE9ger le pouvoir d'achat du capital, pas le faire exploser."],sousTitres:["Voici comment cette logique se traduit en pourcentages \u{1F447}","Le d\xE9tail, actif par actif \u{1F447}","Ce que \xE7a donne une fois pos\xE9 noir sur blanc \u{1F447}"],ctas:["Tu prot\xE8ges ton patrimoine de l'inflation comment, toi ? \u{1F447}","Or, mati\xE8res premi\xE8res, immobilier... tu ferais confiance \xE0 quoi en premier ? \u{1F447}","Ce genre de portefeuille, tu le vois comme une assurance ou une vraie strat\xE9gie de fond ? \u{1F447}"],warnings:["Ce portefeuille sous-performe en march\xE9 actions haussier. Il est fait pour prot\xE9ger, pas pour faire cro\xEEtre rapidement le capital.","Aucune de ces lignes ne verse de dividende ni d'int\xE9r\xEAt classique. La logique ici est la pr\xE9servation de la valeur, pas le revenu."],contextFallback:"Ce portefeuille n'a connu aucune ann\xE9e r\xE9ellement n\xE9gative sur la p\xE9riode observ\xE9e.",combos:[{assets:[{id:"or",pct:35,pourquoi:["Le pilier de la th\xE8se : aucune banque centrale ne peut en imprimer davantage.","35%, la ligne la plus lourde du portefeuille \u2014 c'est elle qui porte la logique anti-inflation."]},{id:"argent",pct:20,pourquoi:["Le m\xEAme raisonnement que l'or, en plus volatil : un m\xE9tal qu'on ne peut pas cr\xE9er \xE0 volont\xE9.","Vient renforcer la protection de l'or, avec une composante industrielle en plus."]},{id:"mp_large",pct:25,pourquoi:["Quand l'inflation grimpe, les prix des mati\xE8res premi\xE8res grimpent souvent avec elle \u2014 c'est m\xE9canique.","Compl\xE8te l'or et l'argent avec une exposition plus large : \xE9nergie, m\xE9taux, agriculture."]},{id:"scpi",pct:20,pourquoi:["Un actif r\xE9el, dont les loyers ont vocation \xE0 suivre l'inflation dans la dur\xE9e \u2014 contrairement \xE0 un billet de banque.","La brique \xAB immobilier physique \xBB de la th\xE8se : un actif tangible, pas une promesse de remboursement."]}]},{assets:[{id:"or",pct:40,pourquoi:["40% : le c\u0153ur de la th\xE8se. Tout le reste du portefeuille vient en compl\xE9ment de cette ligne.","La ligne qui donne son sens \xE0 toute la th\xE8se \u2014 tout le reste vient en soutien."]},{id:"mp_large",pct:30,pourquoi:["Un panier large de mati\xE8res premi\xE8res, pour ne pas d\xE9pendre d'un seul m\xE9tal.","La deuxi\xE8me jambe de la protection : des actifs physiques, pas du papier."]},{id:"foncieres_etf",pct:30,pourquoi:["De l'immobilier cot\xE9, plus liquide que la pierre-papier, mais qui garde la m\xEAme logique d'actif r\xE9el.","Vient ajouter un troisi\xE8me type de protection \xE0 la th\xE8se, d\xE9corr\xE9l\xE9 de l'or et des mati\xE8res premi\xE8res."]}]}]},{id:"rentier",tierKey:"equilibre",label:"Le Rentier",accroches:["L'objectif n'est pas de faire grossir le capital vite. C'est qu'il verse un revenu, chaque ann\xE9e.","Chaque ligne de ce portefeuille a le m\xEAme m\xE9tier : distribuer.","Ici, la performance se mesure en revenus per\xE7us, pas en plus-value latente."],sousTitres:["Voici la composition qui porte cette logique \u{1F447}","Le d\xE9tail, ligne par ligne \u{1F447}","Ce que \xE7a donne concr\xE8tement \u{1F447}"],ctas:["Tu vises plut\xF4t le revenu r\xE9gulier ou la plus-value \xE0 la revente ? \u{1F447}","SCPI, fonci\xE8res, dividendes... tu ferais confiance \xE0 laquelle de ces sources de revenu ? \u{1F447}","Vivre (en partie) de son portefeuille, tu y penses d\xE9j\xE0 ou c'est trop t\xF4t pour toi ? \u{1F447}"],warnings:["Ce portefeuille g\xE9n\xE8re des revenus \u2014 pas une performance maximale. C'est un choix assum\xE9, pas une contrainte.","La plupart de ces revenus sont fiscalis\xE9s chaque ann\xE9e, m\xEAme sans rien vendre. \xC0 anticiper selon ton enveloppe."],contextFallback:"M\xEAme dans sa pire ann\xE9e, les revenus distribu\xE9s par ces lignes ont continu\xE9 \xE0 tomber.",combos:[{assets:[{id:"scpi",pct:20,pourquoi:["Des loyers vers\xE9s r\xE9guli\xE8rement, portefeuille mutualis\xE9 de bureaux et commerces \u2014 le revenu \xAB \xE0 l'ancienne \xBB.","La brique la plus classique du rentier fran\xE7ais : le revenu locatif, sans la gestion."]},{id:"foncieres_etf",pct:35,pourquoi:["La version cot\xE9e et liquide de l'immobilier de revenu : m\xEAmes loyers, beaucoup plus de souplesse.","35% : la ligne la plus lourde, car c'est elle qui distribue le plus r\xE9guli\xE8rement."]},{id:"strat_dividendes",pct:30,pourquoi:["Des entreprises qui existent pour verser (et augmenter) un dividende depuis des d\xE9cennies.","Compl\xE8te les deux lignes immobili\xE8res avec une troisi\xE8me source de revenu, d\xE9corr\xE9l\xE9e du secteur."]},{id:"oblig_hy",pct:15,pourquoi:["Un coupon nettement sup\xE9rieur aux obligations classiques \u2014 le prix \xE0 payer pour plus de revenu.","La touche de rendement obligataire qui vient compl\xE9ter les trois sources de revenu d\xE9j\xE0 pr\xE9sentes."]}]}]},{id:"equilibre",tierKey:"equilibre",label:"L'\xC9quilibr\xE9",accroches:["Ni le plus rassurant, ni le plus risqu\xE9 : le compromis assum\xE9.","Un peu de tout, pour ne d\xE9pendre d'aucun sc\xE9nario unique.","La croissance reste la priorit\xE9, mais jamais sans filet."],sousTitres:["Voici comment \xE7a se traduit concr\xE8tement \u{1F447}","Le d\xE9tail, actif par actif \u{1F447}","Ce que \xE7a donne une fois assembl\xE9 \u{1F447}"],ctas:["L'\xE9quilibre parfait pour toi, ou tu pr\xE9f\xE8res trancher plus franchement ? \u{1F447}","Tu es plut\xF4t team \xE9quilibre ou team choix tranch\xE9s ? \u{1F447}","Ce dosage actions / stabilisateurs, tu le trouves juste ? \u{1F447}"],warnings:["Ce profil suppose de tenir la ligne plusieurs ann\xE9es sans paniquer au premier trimestre rouge.","L'\xE9quilibre ne veut pas dire absence de risque : une baisse de 15 \xE0 20% reste possible sur une mauvaise ann\xE9e."],contextFallback:"Le stabilisateur a jou\xE9 son r\xF4le : sans lui, la baisse aurait \xE9t\xE9 nettement plus marqu\xE9e.",combos:[{assets:[{id:"msci_world",pct:40,pourquoi:["Le moteur de croissance du portefeuille : plusieurs milliers d'entreprises mondiales en une ligne.","40% : la part qui doit faire le gros du travail sur le long terme."]},{id:"oblig_corp_ig",pct:20,pourquoi:["Le stabilisateur. M\xEAme en pleine crise, cett
