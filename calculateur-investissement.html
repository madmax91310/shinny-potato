  body{

    color: var(--ink-100);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection{ background: var(--gold-400); color: var(--navy-950); }
  button, select, input{ font-family: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible{
    outline: 2px solid var(--gold-300);
    outline-offset: 2px;
  }

  .page{
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(20px,3vw,40px) clamp(16px,3vw,32px) 32px;
    display: flex;
    flex-direction: column;
    gap: clamp(18px,2.4vw,28px);
  }

  /* ---------- Masthead ---------- */

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background: linear-gradient(155deg, var(--navy-700), var(--navy-850));
    border:1px solid var(--hairline-strong);
    color: var(--gold-300);
    font-family: var(--font-display);
    font-weight:700;
    font-size:15px;
  }
  .brand-text h1{
    margin:0;
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(17px,2vw,20px);
    letter-spacing: .01em;
    color: var(--ink-100);
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:11.5px;
    letter-spacing:.08em;
    text-transform: uppercase;
    color: var(--ink-500);
  }
  .masthead-tag{
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: .07em;
    color: var(--gold-400);
    border: 1px solid var(--hairline-strong);
    padding: 5px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 320px minmax(0,1fr);
    gap: clamp(16px,2vw,22px);
    align-items: start;
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---------- Controls panel ---------- */
  .panel{
    background: linear-gradient(175deg, var(--navy-850), var(--navy-900));
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 20px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .eyebrow{
    font-family: var(--font-display);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold-400);
    margin: 0 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--hairline);
  }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{
    font-size: 12px;
    color: var(--ink-300);
    font-weight: 600;
  }
  .select-wrap{ position:relative; }
  select.control, input.control{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background: var(--navy-800);
    border: 1px solid var(--navy-600);
    color: var(--ink-100);
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 14px;
    transition: border-color .15s ease;
  }
  select.control{ padding-right: 30px; cursor:pointer; }
  select.control:hover, input.control:hover{ border-color: var(--gold-600); }
  select.control:focus, input.control:focus{ border-color: var(--gold-400); outline:none; }
  .select-wrap::after{
    content:"";
    position:absolute;
    right:11px; top:50%;
    width:8px;height:8px;
    border-right:1.5px solid var(--ink-500);
    border-bottom:1.5px solid var(--ink-500);
    transform: translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .amount-wrap{ position:relative; }
  .amount-wrap input.control{ padding-right: 34px; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
  .amount-suffix{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color: var(--ink-500); font-size:13px; pointer-events:none;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .chip{
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 100px;
    border: 1px solid var(--navy-600);
    background: var(--navy-800);
    color: var(--ink-300);
    cursor: pointer;
    font-family: var(--font-display);
    transition: all .12s ease;
  }
  .chip:hover{ border-color: var(--gold-400); color: var(--gold-300); }
  .chip.active{ background: var(--gold-400); border-color: var(--gold-400); color: var(--navy-950); font-weight:700; }

  .segmented{
    display:grid;
    grid-template-columns: 1fr 1fr;
    background: var(--navy-800);
    border: 1px solid var(--navy-600);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  .segmented button{
    border:none;
    background:transparent;
    color: var(--ink-400);
    padding: 9px 6px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor:pointer;
    transition: all .15s ease;
    line-height:1.25;
  }
  .segmented button.active{
    background: linear-gradient(175deg, var(--gold-300), var(--gold-600));
    color: var(--navy-950);

  .asset-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; flex:none;
  }

    color: var(--gold-300);

/* =====================================================================
   UTILITAIRES DATE / CALCUL
===================================================================== */
function ymIndex(ym){ var p = ym.split("-"); return parseInt(p[0],10)*12 + (parseInt(p[1],10)-1); }
function indexToYm(idx){ var y = Math.floor(idx/12); var m = idx%12+1; return y+"-"+(m<10?"0"+m:m); }
function monthsBetween(startYm, endYm){
  var a = ymIndex(startYm), b = ymIndex(endYm);
  var out = [];
  for (var i=a;i<=b;i++) out.push(indexToYm(i));
  return out;
}
function clampYm(ym, maxYm){ return ymIndex(ym) > ymIndex(maxYm) ? maxYm : ym; }

function interpolatePrice(points, ym){
  var idx = ymIndex(ym);
  var first = points[0], last = points[points.length-1];
  if (idx <= ymIndex(first.date)) return first.price;
  if (idx >= ymIndex(last.date)) return last.price;
  for (var i=0;i<points.length-1;i++){
    var i0 = ymIndex(points[i].date), i1 = ymIndex(points[i+1].date);
    if (idx >= i0 && idx <= i1){
      if (i1 === i0) return points[i].price;
      var t = (idx-i0)/(i1-i0);
      return points[i].price + (points[i+1].price - points[i].price)*t;
    }
  }
  return last.price;
}

function computeAssetSeries(points, startYm, endYm, amount, mode){
  var months = monthsBetween(startYm, endYm);
  var series = [], invested = [];
  if (mode === "dca"){
    var units = 0, totalInvested = 0;
    for (var i=0;i<months.length;i++){
      var price = interpolatePrice(points, months[i]);
      units += amount / price;
      totalInvested += amount;
      series.push(units * price);
      invested.push(totalInvested);
    }
  } else {
    var p0 = interpolatePrice(points, startYm);
    var u = amount / p0;
    for (var j=0;j<months.length;j++){
      series.push(u * interpolatePrice(points, months[j]));
      invested.push(amount);
    }
  }
  return { months: months, series: series, invested: invested,
    finalValue: series[series.length-1], totalInvested: invested[invested.length-1] };
}

function computeBenchmarkSeries(rateTable, startYm, endYm, amount, mode){
  var months = monthsBetween(startYm, endYm);
  var series = [], invested = [];
  var value = 0, totalInvested = 0;
  for (var i=0;i<months.length;i++){
    if (i>0){
      var year = parseInt(months[i].split("-")[0],10);
      var annual = rateTable[year] !== undefined ? rateTable[year] : 0;
      var factor = Math.pow(1 + annual/100, 1/12);
      value *= factor;
    }
    if (mode === "dca"){
      value += amount; totalInvested += amount;
    } else if (i === 0){
      value = amount; totalInvested = amount;
    }
    series.push(value);
    invested.push(totalInvested);
  }
  return { months: months, series: series, invested: invested,
    finalValue: series[series.length-1], totalInvested: invested[invested.length-1] };
}

function computeCustomSeries(startYm, endYm, amount, customStart, customEnd){
  var p0 = parseFloat(customStart);
  var p1 = parseFloat(customEnd);
  var ratio = (isFinite(p0) && p0 > 0 && isFinite(p1)) ? (p1 / p0) : 1;
  var months = monthsBetween(startYm, endYm);
  var series = months.map(function(_,i){
    var t = months.length>1 ? i/(months.length-1) : 1;
    return amount * (1 + (ratio - 1)*t);
  });
  var invested = months.map(function(){ return amount; });
  return { months: months, series: series, invested: invested, finalValue: amount*ratio, totalInvested: amount };
}

function fmtEUR(n, currency){
  currency = currency || "EUR";
  try {
    return n.toLocaleString("fr-FR", { style: "currency", currency: currency, maximumFractionDigits: 0 });
  } catch(e){
    return Math.round(n).toLocaleString("fr-FR") + " €";
  }
}
function fmtPct(n){
  var s = n.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return (n >= 0 ? "+" : "") + s + " %";
}
function pct(final, invested){ return invested > 0 ? ((final - invested) / invested) * 100 : 0; }

function el(tag, props, children){
  var node = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v === undefined || v === null) return;
    if (k === "className") node.className = v;
    else if (k === "style") Object.keys(v).forEach(function(sk){ node.style[sk] = v[sk]; });
    else if (k in node){ try { node[k] = v; } catch(e){ node.setAttribute(k, v); } }
    else node.setAttribute(k, v);
  });
  (children || []).forEach(function(c){
    if (c === null || c === undefined) return;
    if (typeof c === "string" || typeof c === "number") node.appendChild(document.createTextNode(String(c)));
    else node.appendChild(c);
  });
  return node;
}
var SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, children){
  var node = document.createElementNS(SVG_NS, tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){ node.setAttribute(k, attrs[k]); });
  (children || []).forEach(function(c){ if (c) node.appendChild(c); });
  return node;
}

function sparklineNode(series, invested){

  svg.appendChild(defs);
  gridLines.forEach(function(y){
    svg.appendChild(svgEl("line", { x1:pad, x2:w-pad, y1:y, y2:y, stroke:"var(--hairline)", "stroke-width":"1", "stroke-dasharray":"3,4" }));
  });
  svg.appendChild(svgEl("path", { d: areaPath, fill:"url(#areaFill)", stroke:"none" }));
  svg.appendChild(svgEl("path", { d: investedPath, fill:"none", stroke:"#5b6688", "stroke-width":"1.5", "stroke-dasharray":"4,4" }));
  svg.appendChild(svgEl("path", { d: linePath, fill:"none", stroke:"#eec565", "stroke-width":"2.5", "stroke-linecap":"round", "stroke-linejoin":"round" }));
  svg.appendChild(svgEl("circle", { cx:last[0], cy:last[1], r:"9", fill:"#eec565", opacity:"0.25", filter:"url(#glow)" }));
  svg.appendChild(svgEl("circle", { cx:last[0], cy:last[1], r:"4", fill:"#f7d685", stroke:"#0a1122", "stroke-width":"1.5" }));
  return svg;
}

/* =====================================================================
   ETAT
===================================================================== */
var state = {
  assetId: "bitcoin",
  startYear: 2020,
  startMonth: 1,
  amountRaw: "1000",
  mode: "lump",
  customLabel: "",
  customStart: "",
  customEnd: "",
  copied: false
};

var AMOUNT_PRESETS = [100, 500, 1000, 5000];
var DATE_PRESETS = [
  { label:"janv. 2015", y:2015, m:1 },
  { label:"janv. 2018", y:2018, m:1 },
  { label:"janv. 2020", y:2020, m:1 },
  { label:"janv. 2023", y:2023, m:1 }
];
var YEARS = [];
for (var y=2015; y<=2026; y++) YEARS.push(y);

function derive(){
  var amount = parseFloat(state.amountRaw) || 0;
  var isCustom = state.assetId === "custom";
  var effectiveMode = isCustom ? "lump" : state.mode;
  var startYm = clampYm(state.startYear + "-" + (state.startMonth<10?"0"+state.startMonth:state.startMonth), LATEST_YM);
  var endYm = LATEST_YM;

  var result;
  if (isCustom){
    result = computeCustomSeries(startYm, endYm, amount, state.customStart, state.customEnd);
  } else {
    result = computeAssetSeries(ASSETS[state.assetId].points, startYm, endYm, amount, effectiveMode);
  }
  var livretA = computeBenchmarkSeries(LIVRET_A, startYm, endYm, amount, effectiveMode);
  var inflation = computeBenchmarkSeries(INFLATION, startYm, endYm, amount, effectiveMode);

  return {
    amount: amount, isCustom: isCustom, effectiveMode: effectiveMode,
    startYm: startYm, endYm: endYm, result: result, livretA: livretA, inflation: inflation
  };
}

function buildTweetText(d){
  var asset = d.isCustom ? null : ASSETS[state.assetId];
  var tweetPhrase = d.isCustom ? (state.customLabel ? ("« " + state.customLabel + " »") : "cet actif") : asset.tweetPhrase;
  var monthLabel = MONTHS_FULL[parseInt(d.startYm.split("-")[1],10)-1];
  var yearLabel = d.startYm.split("-")[0];
  var gainPct = pct(d.result.finalValue, d.result.totalInvested);
  var finalFmt = fmtEUR(d.result.finalValue);
  var pctFmt = fmtPct(gainPct);
  if (d.effectiveMode === "dca"){
    return "Si tu avais mis " + fmtEUR(d.amount) + "/mois dans " + tweetPhrase + " depuis " + monthLabel + " " + yearLabel +
           " (versement programmé), tu aurais aujourd'hui " + finalFmt + " (" + pctFmt + ") pour " + fmtEUR(d.result.totalInvested) + " investis. 🧵";
  }
  return "Si tu avais investi " + fmtEUR(d.amount) + " dans " + tweetPhrase + " en " + monthLabel + " " + yearLabel +
         ", tu aurais aujourd'hui " + finalFmt + " (" + pctFmt + "). 🧵";
}

/* =====================================================================
   RENDU — carte resultat (construite via createElement, pas de HTML string)
===================================================================== */
function compareItem(label, value, deltaVal, highlight){
  return el("div", { className: "compare-item" + (highlight ? " highlight" : "") }, [
    el("p", { className:"compare-label" }, [label]),
    el("p", { className:"compare-value" }, [fmtEUR(value)]),
    el("p", { className:"compare-delta " + (deltaVal>=0?"pos":"neg") }, [fmtPct(deltaVal)])
  ]);
}

function buildResultFragment(d){
  var asset = d.isCustom ? null : ASSETS[state.assetId];
  var assetLabel = d.isCustom ? (state.customLabel || "cet actif") : asset.label;
  var gainAbs = d.result.finalValue - d.result.totalInvested;
  var gainPct = pct(d.result.finalValue, d.result.totalInvested);
  var livretPct = pct(d.livretA.finalValue, d.livretA.totalInvested);
  var inflPct = pct(d.inflation.finalValue, d.inflation.totalInvested);
  var monthShort = MONTHS_SHORT[parseInt(d.startYm.split("-")[1],10)-1];
  var yearLabel = d.startYm.split("-")[0];

  var frag = document.createDocumentFragment();

  var badge = el("div", { className:"asset-badge" }, [ d.isCustom ? "✎" : asset.icon ]);
  var headText = el("div", {}, [
    el("h2", {}, [assetLabel]),
    el("p", { className:"period" }, [monthShort + " " + yearLabel + "  →  aujourd'hui"])
  ]);
  var headLeft = el("div", { className:"card-head-left" }, [badge, headText]);
  var modePill = el("span", { className:"mode-pill" }, [ d.effectiveMode === "dca" ? "DCA mensuel" : "Versement unique" ]);
  frag.appendChild(el("div", { className:"card-head" }, [headLeft, modePill]));

  var heroLabelP = el("p", { className:"hero-label" });
  if (d.effectiveMode === "dca"){
    heroLabelP.appendChild(document.createTextNode("Avec "));
    heroLabelP.appendChild(el("b", {}, [fmtEUR(d.amount) + "/mois"]));
    heroLabelP.appendChild(document.createTextNode(" placés, ton capital serait devenu :"));
  } else {
    heroLabelP.appendChild(document.createTextNode("Ton "));
    heroLabelP.appendChild(el("b", {}, [fmtEUR(d.amount)]));
    heroLabelP.appendChild(document.createTextNode(" serait devenu :"));
  }
  var heroNumber = el("p", { className:"hero-number" }, [fmtEUR(d.result.finalValue)]);
  var deltaPill = el("span", { className:"delta-pill " + (gainPct>=0?"pos":"neg") }, [fmtPct(gainPct)]);
  var gainAbsSpan = el("span", { className:"gain-abs" }, [
    (gainAbs>=0?"+":"") + fmtEUR(gainAbs) + " de plus-value · " + fmtEUR(d.result.totalInvested) + " investis"
  ]);
  var heroSub = el("div", { className:"hero-sub" }, [deltaPill, gainAbsSpan]);
  frag.appendChild(el("div", { className:"hero" }, [heroLabelP, heroNumber, heroSub]));

  var legendAsset = el("span", { className:"legend-item" }, [
    el("span", { className:"legend-swatch", style:{ background:"#eec565" } }), assetLabel
  ]);
  var legendInvested = el("span", { className:"legend-item" }, [
    el("span", { className:"legend-swatch", style:{ background:"#5b6688", opacity:"0.8" } }), "Capital investi"
  ]);
  var legend = el("div", { className:"chart-legend" }, [legendAsset, legendInvested]);
  frag.appendChild(el("div", { className:"chart-wrap" }, [legend, sparklineNode(d.result.series, d.result.invested)]));

  frag.appendChild(el("div", { className:"compare" }, [
    compareItem(assetLabel, d.result.finalValue, gainPct, true),
    compareItem("Livret A", d.livretA.finalValue, livretPct, false),
    compareItem("Inflation", d.inflation.finalValue, inflPct, false)
  ]));

  var disclaimer = el("p", { className:"disclaimer" }, [
    "Éducation financière, pas un conseil en investissement. Données historiques approximatives, performances passées ≠ garanties futures."
  ]);
  var tweetBtn = el("button", { type:"button", id:"tweetBtn", className: "tweet-btn" + (state.copied ? " copied" : "") }, [
    state.copied ? "✓ Copié" : "𝕏 Copier le texte du post"
  ]);
  frag.appendChild(el("div", { className:"card-footer" }, [disclaimer, tweetBtn]));

  return frag;
}

function renderResult(){
  var d = derive();
  var resultCard = document.getElementById("resultCard");
  resultCard.replaceChildren(buildResultFragment(d));
  document.getElementById("tweetBtn").addEventListener("click", function(){
    var text = buildTweetText(derive());
    function done(){
      state.copied = true;
      renderResult();
      setTimeout(function(){ state.copied = false; renderResult(); }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });
}

function fallbackCopy(text, done){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  done();
}

function updateControlsUI(){
  var isCustom = state.assetId === "custom";
  var amount = parseFloat(state.amountRaw) || 0;
  var effectiveMode = isCustom ? "lump" : state.mode;

  document.getElementById("assetSelect").value = state.assetId;
  document.getElementById("customFields").style.display = isCustom ? "flex" : "none";
  document.getElementById("monthSelect").value = String(state.startMonth);
  document.getElementById("yearSelect").value = String(state.startYear);

  Array.prototype.forEach.call(document.querySelectorAll(".date-chip"), function(btn){
    var y = parseInt(btn.getAttribute("data-y"),10), m = parseInt(btn.getAttribute("data-m"),10);
    btn.classList.toggle("active", y === state.startYear && m === state.startMonth);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".amount-chip"), function(btn){
    var v = parseFloat(btn.getAttribute("data-v"));
    btn.classList.toggle("active", v === amount);
  });

  var lumpBtn = document.getElementById("modeLump"), dcaBtn = document.getElementById("modeDca");
  lumpBtn.classList.toggle("active", effectiveMode === "lump");
  dcaBtn.classList.toggle("active", effectiveMode === "dca");
  lumpBtn.disabled = isCustom; dcaBtn.disabled = isCustom;

  document.getElementById("modeHint").textContent = isCustom
    ? "Le mode DCA nécessite un historique de prix : indisponible en saisie manuelle."
    : (effectiveMode === "dca"
        ? "Un versement de " + amount.toLocaleString("fr-FR") + " € chaque mois depuis la date de départ."
        : "Un seul versement à la date de départ, laissé investi jusqu'à aujourd'hui.");
}

function renderAll(){
  updateControlsUI();
  renderResult();
}

/* =====================================================================
   CONSTRUCTION DES CONTROLES (une seule fois, via createElement)
===================================================================== */
function buildControlsFragment(){
  var frag = document.createDocumentFragment();

  var assetOptions = ASSET_ORDER.map(function(id){
    return el("option", { value:id }, [ ASSETS[id].icon + "  " + ASSETS[id].label ]);
  });
  assetOptions.push(el("option", { value:"custom" }, ["✎  Autre (saisie manuelle)"]));
  var assetSelect = el("select", { className:"control", id:"assetSelect" }, assetOptions);
  var selectWrap1 = el("div", { className:"select-wrap" }, [assetSelect]);

  var customFields = el("div", {
    id:"customFields",
    style:{ display:"none", flexDirection:"column", gap:"8px", marginTop:"4px" }
  }, [
    el("input", { className:"control", type:"text", id:"customLabel", placeholder:"Nom de l'actif" }),
    el("div", { className:"row2" }, [
      el("input", { className:"control", type:"number", id:"customStart", placeholder:"Prix de départ" }),
      el("input", { className:"control", type:"number", id:"customEnd", placeholder:"Prix actuel" })
    ])
  ]);
  var assetField = el("div", { className:"field" }, [selectWrap1, customFields]);
  frag.appendChild(el("div", {}, [ el("p", { className:"eyebrow" }, ["Actif"]), assetField ]));

  var monthSelect = el("select", { className:"control", id:"monthSelect" },
    MONTHS_FULL.map(function(mn,i){ return el("option", { value:String(i+1) }, [mn]); })
  );
  var yearSelect = el("select", { className:"control", id:"yearSelect" },
    YEARS.map(function(yr){ return el("option", { value:String(yr) }, [String(yr)]); })
  );
  var dateRow = el("div", { className:"row2" }, [
    el("div", { className:"select-wrap" }, [monthSelect]),
    el("div", { className:"select-wrap" }, [yearSelect])
  ]);
  var dateChips = el("div", { className:"chips" }, DATE_PRESETS.map(function(dp){
    return el("button", { type:"button", className:"chip date-chip", "data-y":String(dp.y), "data-m":String(dp.m) }, [dp.label]);
  }));
  frag.appendChild(el("div", {}, [ el("p", { className:"eyebrow" }, ["Date de départ"]), dateRow, dateChips ]));

  var amountInput = el("input", { className:"control", type:"number", min:"1", id:"amountInput", value: state.amountRaw });
  var amountWrap = el("div", { className:"amount-wrap" }, [ amountInput, el("span", { className:"amount-suffix" }, ["€"]) ]);
  var amountChips = el("div", { className:"chips" }, AMOUNT_PRESETS.map(function(v){
    return el("button", { type:"button", className:"chip amount-chip", "data-v":String(v) }, [ v.toLocaleString("fr-FR") + " €" ]);
  }));
  var amountField = el("div", { className:"field" }, [amountWrap, amountChips]);
  frag.appendChild(el("div", {}, [ el("p", { className:"eyebrow" }, ["Montant"]), amountField ]));

  var segmented = el("div", { className:"segmented" }, [
    el("button", { type:"button", id:"modeLump" }, ["Versement unique"]),
    el("button", { type:"button", id:"modeDca" }, ["Mensuel (DCA)"])
  ]);
  var modeHint = el("p", { className:"hint", id:"modeHint" });
  frag.appendChild(el("div", {}, [ el("p", { className:"eyebrow" }, ["Mode"]), segmented, modeHint ]));

  return frag;
}

function wireControls(){
  document.getElementById("assetSelect").addEventListener("change", function(e){
    state.assetId = e.target.value; renderAll();
  });
  document.getElementById("customLabel").addEventListener("input", function(e){
    state.customLabel = e.target.value; renderResult();
  });
  document.getElementById("customStart").addEventListener("input", function(e){
    state.customStart = e.target.value; renderResult();
  });
  document.getElementById("customEnd").addEventListener("input", function(e){
    state.customEnd = e.target.value; renderResult();
  });
  document.getElementById("monthSelect").addEventListener("change", function(e){
    state.startMonth = parseInt(e.target.value,10); renderAll();
  });
  document.getElementById("yearSelect").addEventListener("change", function(e){
    state.startYear = parseInt(e.target.value,10); renderAll();
  });
  Array.prototype.forEach.call(document.querySelectorAll(".date-chip"), function(btn){
    btn.addEventListener("click", function(){
      state.startYear = parseInt(btn.getAttribute("data-y"),10);
      state.startMonth = parseInt(btn.getAttribute("data-m"),10);
      renderAll();
    });
  });
  document.getElementById("amountInput").addEventListener("input", function(e){
    state.amountRaw = e.target.value; renderResult();
    Array.prototype.forEach.call(document.querySelectorAll(".amount-chip"), function(btn){
      btn.classList.toggle("active", parseFloat(btn.getAttribute("data-v")) === (parseFloat(state.amountRaw)||0));
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".amount-chip"), function(btn){
    btn.addEventListener("click", function(){
      state.amountRaw = btn.getAttribute("data-v");
      document.getElementById("amountInput").value = state.amountRaw;
      renderAll();
    });
  });
  document.getElementById("modeLump").addEventListener("click", function(){
    if (state.assetId === "custom") return;
    state.mode = "lump"; renderAll();
  });
  document.getElementById("modeDca").addEventListener("click", function(){
    if (state.assetId === "custom") return;
    state.mode = "dca"; renderAll();
  });
}

function boot(){
  document.getElementById("controlsPanel").replaceChildren(buildControlsFragment());
  wireControls();
  renderAll();
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
})();
</script>
