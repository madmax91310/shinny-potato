<h1>Amundi launches new Global Equity ETF</h1>
<p>
Amundi today announced the launch of the Amundi Global Equity Multi-Factor UCITS ETF,
ticker: AGEQ, ISIN FR0013456789, listed on Euronext Paris. The fund has a total expense
ratio (TER) of 0.20% and was launched on 15 July 2026, tracking the MSCI World index.
</p>
