<html><body><vue-media-releases-details-page :model="{&quot;date&quot;: &quot;04/08/2026&quot;, &quot;headline&quot;: &quot;DWS expands Xtrackers Fixed Income ETF offering with first Global Credit ETFs&quot;, &quot;htmlContent&quot;: &quot;&lt;p&gt;DWS announced the launch of three new Xtrackers fixed income ETFs, expanding its bond offering through a collaboration with &lt;strong&gt;Intercontinental Exchange&lt;/strong&gt; (ICE), a leading provider of fixed income indices. The funds were launched on 8 July and are listed on their respective exchanges between 9 and 14 July.&lt;/p&gt;\n&lt;p&gt;Building on a fixed income ETF platform with more than EUR 80 billion in assets, the launch includes Xtrackers\u2019 first &lt;strong&gt;Global Corporate Bond ETF&lt;/strong&gt; and G&lt;strong&gt;lobal High Yield Bond ETF&lt;/strong&gt;. The new funds are designed to provide investors with simple, transparent and cost-efficient access to global credit markets through widely recognised ICE BofA indices.\u00a0&lt;br&gt;Alongside the global credit launches, DWS is also introducing the &lt;strong&gt;Xtrackers Eurozone Government Bond 1\u201310 UCITS ETF&lt;/strong&gt;, which provides targeted exposure to Eurozone sovereign bonds.&lt;/p&gt;\n&lt;p&gt;The new ETFs combine DWS&#x27; expertise in ETF portfolio construction with ICE&#x27;s established fixed income indexing capabilities, providing investors with additional tools for portfolio construction across key bond market segments.&lt;/p&gt;\n&lt;p&gt;\&quot;Investor demand for fixed income ETFs continues to grow as bonds regain their role as a core portfolio allocation,\&quot; said &lt;strong&gt;Sam Manchanda, Head of Private Wealth Coverage, EMEA ex. Germany, Austria &amp;amp; CEE, DWS&lt;/strong&gt;. \&quot;These new ETFs provide investors with efficient access to global credit markets through diversified exposures that can serve as core building blocks within long-term portfolios.\&quot;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Michael Mohr, Global Head of Xtrackers Products at DWS&lt;/strong&gt;, said: \&quot;This launch represents an important milestone for our fixed income ETF offering, bringing global investment grade and high yield credit exposures to the Xtrackers range for the first time. We are expanding the toolkit available to investors and are delivering innovative building blocks that support increasingly sophisticated portfolio construction needs.\&quot;&lt;/p&gt;\n&lt;p&gt;These ETFs are coming in both hedged and unhedged variants, with TER\u2019s starting at 8bps.\u00a0&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;New ETFs&lt;/strong&gt;&lt;/p&gt;\n&lt;ul class=\&quot;d-unordered-list\&quot;&gt;\n&lt;li&gt;Xtrackers Global Corporate Bond UCITS ETF&lt;/li&gt;\n&lt;li&gt;Xtrackers Global High Yield Bond UCITS ETF&lt;/li&gt;\n&lt;li&gt;Xtrackers Eurozone Government Bond 1\u201310 UCITS ETF&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 class=\&quot;d-base-heading--h3\&quot;&gt;Product information&lt;/h3&gt;\n&lt;div class=\&quot;d-table-container\&quot;&gt;&lt;table class=\&quot;d-table\&quot; style=\&quot;border-collapse: collapse;\&quot;&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ETF Name&lt;/th&gt;\n&lt;th&gt;ISIN&lt;/th&gt;\n&lt;th&gt;Ticker&lt;/th&gt;\n&lt;th&gt;Share Class&lt;/th&gt;\n&lt;th&gt;TER&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 1C\&quot; href=\&quot;/en-gb/IE000LRDPD24-global-corporate-bond-ucits-etf-1c/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 1C\&quot;&gt;Xtrackers Global Corporate Bond UCITS ETF 1C&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE000LRDPD24&lt;/td&gt;\n&lt;td&gt;G0BC&lt;/td&gt;\n&lt;td&gt;1C&lt;/td&gt;\n&lt;td&gt;0.08%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 2C - EUR Hedged\&quot; href=\&quot;/en-gb/IE000EUY91Y9-global-corporate-bond-ucits-etf-2c-eur-hedged/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 2C - EUR Hedged\&quot;&gt;Xtrackers Global Corporate Bond UCITS ETF 2C - EUR Hedged&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE000EUY91Y9&lt;/td&gt;\n&lt;td&gt;XGCE&lt;/td&gt;\n&lt;td&gt;2C&lt;/td&gt;\n&lt;td&gt;0.10%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 3C - USD Hedged\&quot; href=\&quot;/en-gb/IE000VZ7IV68-global-corporate-bond-ucits-etf-3c-usd-hedged/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 3C - USD Hedged\&quot;&gt;Xtrackers Global Corporate Bond UCITS ETF 3C - USD Hedged&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE000VZ7IV68&lt;/td&gt;\n&lt;td&gt;XGCU&lt;/td&gt;\n&lt;td&gt;3C&lt;/td&gt;\n&lt;td&gt;0.10%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 4C - GBP Hedged\&quot; href=\&quot;/en-gb/IE0008Z87N38-global-corporate-bond-ucits-etf-4c-gbp-hedged/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global Corporate Bond UCITS ETF 4C - GBP Hedged\&quot;&gt;Xtrackers Global Corporate Bond UCITS ETF 4C - GBP Hedged&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE0008Z87N38&lt;/td&gt;\n&lt;td&gt;XGCG&lt;/td&gt;\n&lt;td&gt;4C&lt;/td&gt;\n&lt;td&gt;0.10%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global High Yield Corporate Bond UCITS ETF 1C\&quot; href=\&quot;/en-gb/IE000DT6MI20-global-high-yield-corporate-bond-ucits-etf-1c/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global High Yield Corporate Bond UCITS ETF 1C\&quot;&gt;Xtrackers Global High Yield Corporate Bond UCITS ETF 1C&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE000DT6MI20&lt;/td&gt;\n&lt;td&gt;XHW0&lt;/td&gt;\n&lt;td&gt;1C&lt;/td&gt;\n&lt;td&gt;0.18%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global High Yield Corporate Bond UCITS ETF 2C - EUR Hedged\&quot; href=\&quot;/en-gb/IE000AGH5ZI1-global-high-yield-corporate-bond-ucits-etf-2c-eur-hedged/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global High Yield Corporate Bond UCITS ETF 2C - EUR Hedged\&quot;&gt;Xtrackers Global High Yield Corporate Bond UCITS ETF 2C - EUR Hedged&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE000AGH5ZI1&lt;/td&gt;\n&lt;td&gt;XHWE&lt;/td&gt;\n&lt;td&gt;2C&lt;/td&gt;\n&lt;td&gt;0.20%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Global High Yield Corporate Bond UCITS ETF 4C - GBP Hedged\&quot; href=\&quot;/en-gb/IE000YHV2XO4-global-high-yield-corporate-bond-ucits-etf-4c-gbp-hedged/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Global High Yield Corporate Bond UCITS ETF 4C - GBP Hedged\&quot;&gt;Xtrackers Global High Yield Corporate Bond UCITS ETF 4C - GBP Hedged&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE000YHV2XO4&lt;/td&gt;\n&lt;td&gt;XHWG&lt;/td&gt;\n&lt;td&gt;4C&lt;/td&gt;\n&lt;td&gt;0.20%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;text-align: left;\&quot;&gt;&lt;a data-event_source=\&quot;DWS|passive|gb|en|/en-gb/about-us/press-releases/dws-expands-xtrackers-fixed-income-etf-offering-with-first-global-credit-etfs/\&quot; data-event_title=\&quot;Xtrackers Eurozone Government Bond 1-10 UCITS ETF 1C\&quot; href=\&quot;/en-gb/IE00064N5UY4-eurozone-government-bond-1-10-ucits-etf-1c/\&quot; target=\&quot;_self\&quot; title=\&quot;Xtrackers Eurozone Government Bond 1-10 UCITS ETF 1C\&quot;&gt;Xtrackers Eurozone Government Bond 1-10 UCITS ETF 1C&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;IE00064N5UY4&lt;/td&gt;\n&lt;td&gt;XEZG&lt;/td&gt;\n&lt;td&gt;1C&lt;/td&gt;\n&lt;td&gt;0.09%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;&lt;/div&gt;\n&lt;h3 class=\&quot;d-base-heading d-base-heading--h3\&quot;&gt;About Xtrackers&lt;/h3&gt;\n&lt;p&gt;Xtrackers is DWS&#x27;s global platform for exchange-traded funds (ETFs) and exchange-traded commodities (ETCs). With more than GBP 286 billion in assets under management (as of 29 June 2026), Xtrackers offers one of the largest and most established ETF ranges in Europe, providing investors with access to equity, fixed income and commodity markets through a broad range of index and actively managed strategies.&lt;/p&gt;\n&lt;h3 class=\&quot;d-base-heading d-base-heading--h3\&quot;&gt;About DWS Group:&lt;/h3&gt;\n&lt;p&gt;DWS Group (DWS), with EUR 1,093bn of total assets under management (as of 31 March 2026), is a leading European asset manager with global reach. With approximately 5,000 employees in offices around the world, DWS offers individuals, institutions and large corporations access to comprehensive investment solutions and bespoke portfolios across the full spectrum of investment disciplines. Its diverse expertise in Active, Passive and Alternative asset management enables DWS to deliver targeted solutions for clients across all major liquid and illiquid asset classes.&lt;/p&gt;\n&lt;p&gt;www.dws.com/de&lt;/p&gt;\n&lt;p&gt;This document is a promotional communication. Investors should read the prospectus and the Key Information Document before making an investment decision.&lt;/p&gt;\n&lt;h3 class=\&quot;d-base-heading d-base-heading--h3\&quot;&gt;&lt;br&gt;Key Risk Factors\u00a0&lt;/h3&gt;\n&lt;ul class=\&quot;d-unordered-list\&quot;&gt;\n&lt;li&gt;An investment in an Xtrackers ETF may not be suitable for all investors. Xtrackers UCITS ETFs are not capital protected, therefore investors should be prepared and able to sustain losses up to the total loss of the capital invested.&lt;/li&gt;\n&lt;li&gt;Investors should be aware that DWS Investments UK Limited, any of its parents or any of its or its parents subsidiaries or affiliates may from time to time own interests in the funds which may represent a significant amount or proportion of the overall investor holdings in the Fund. Investors should consider what possible impact such holdings, or any disposal thereof, may have on them.&lt;/li&gt;\n&lt;li&gt;Substantial fluctuations of the value of the investment are possible even over short periods of time.&lt;/li&gt;\n&lt;li&gt;Investments in Xtrackers UCITS ETFs involve numerous risks including but not limited to general market risks relating to the relevant underlying index, credit risks on the provider of index swaps utilised in the Xtrackers UCITS ETFs, possible delays in repayment, market fluctuations, counterparty risk, foreign exchange rate risks, interest rate risks, inflationary risks, liquidity risks, loss of income and principal invested and legal and regulatory risks.&lt;/li&gt;\n&lt;li&gt;Movements in exchange rates can impact the value of your investment. If the currency of your country of residence is different from the currency in which the underlying investments of the fund are made, the value of your investment may increase or decrease subject to movements in exchange rates.&lt;/li&gt;\n&lt;li&gt;Shares in Xtrackers UCITS ETFs which are purchased on the secondary market cannot usually be sold directly back to the fund. Investors must purchase and redeem such shares on the secondary market with the assistance of an intermediary (e.g. a market maker or a stock broker) and may incur fees for doing so (as further described in the prospectus). In addition, investors may pay more than the current net asset value of a share in a Xtrackers UCITS ETF when buying shares on the secondary market, and may receive less than the current net asset value when selling such shares on the secondary market.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The value of your investment may go down as well as up and past performance does not predict future returns. Investor capital may be at risk up to a total loss. \u00a0&lt;/p&gt;\n&lt;p&gt;For further information regarding risk factors, please refer to the risk factors section of the relevant prospectus and the Key Investor Information Document.&lt;/p&gt;\n&lt;h3 class=\&quot;d-base-heading d-base-heading--h3\&quot;&gt;Disclaimer&lt;/h3&gt;\n&lt;p&gt;Issued in the UK by DWS Investments UK Limited. DWS Investments UK Limited is authorised and regulated by the Financial Conduct Authority.&lt;/p&gt;\n&lt;p&gt;Any reference to \u201cDWS\u201d shall, unless otherwise required by the context, be understood as a reference to DWS Investments UK Limited including any of its parent companies, affiliates or subsidiaries and, as the case may be, any investment companies promoted or managed by any of those entities.&lt;/p&gt;\n&lt;p&gt;Xtrackers, Xtrackers II and Xtrackers (IE) plc are undertakings for collective investment in transferable securities (UCITS) in accordance with the applicable laws and regulations and set up as open-ended investment companies with variable capital and segregated liability between their respective compartments.\u00a0&lt;/p&gt;\n&lt;p&gt;Xtrackers and Xtrackers II are incorporated in the Grand Duchy of Luxembourg, are registered with the Luxembourg Trade and Companies\u2019 Register under number B-119.899 (Xtrackers) and B-124.284 (Xtrackers II) respectively and have their registered office at 49, avenue J.F. Kennedy, L-1855 Luxembourg. Xtrackers (IE) plc is incorporated in Ireland with registered number 393802 and has its registered office at 78 Sir John Rogerson\u2019s Quay, Dublin 2, Ireland.\u00a0&lt;/p&gt;\n&lt;p&gt;DWS Investment S.A. acts as the management company of Xtrackers, Xtrackers II and Xtrackers (IE) plc.&lt;/p&gt;\n&lt;p&gt;This document is intended as marketing communication. The information contained in this document is provided for information purposes only. Any investment decision in relation to an Xtrackers ETF should be based solely on the latest version of the prospectus, the audited annual and, if more recent, un-audited semi-annual reports and the Key Investor Information Document (KIID), all of which are available in English upon request or on www.etf.dws.com.In the case of any inconsistency with the prospectus, the latest version of the prospectus shall prevail.\u00a0&lt;/p&gt;\n&lt;p&gt;These marketing materials have been prepared solely for information purposes and do not constitute an offer or a recommendation to enter into any transaction.\u00a0&lt;/p&gt;\n&lt;p&gt;This document has been prepared without consideration of the investment needs, objectives or financial circumstances of any investor. Before making an investment decision, investors need to consider, with or without the assistance of an investment adviser, whether the investments and strategies described or provided by DWS, are appropriate, in light of their particular investment needs, objectives and financial circumstances. Furthermore, this document is for information/discussion purposes only and does not constitute an offer, recommendation or solicitation to conclude a transaction and should not be treated as giving investment advice.&lt;/p&gt;\n&lt;p&gt;DWS does not give tax or legal advice. Investors should seek advice from their own tax experts and lawyers, in considering investments and strategies suggested by DWS. Investments with DWS are not guaranteed, unless specified.\u00a0&lt;/p&gt;\n&lt;p&gt;A summary of investor rights is available at www.etf.dws.com under \u201cAbout Us \u2013 How to Complain?\u201d.&lt;/p&gt;\n&lt;p&gt;PAST PERFORMANCE DOES NOT PREDICT FUTURE RETURNS.\u00a0&lt;/p&gt;\n&lt;p&gt;\u00a9 DWS Investments UK Limited 2026.&lt;/p&gt;&quot;}"></vue-media-releases-details-page></body></html>
