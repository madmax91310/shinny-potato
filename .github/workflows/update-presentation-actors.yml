name: Update actor presentations
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/update-presentation-actors.yml', 'scripts/*presentation_actors*', 'scripts/fixtures/presentation-actors/**', 'src/data/*presentation-actors*', 'src/pages/presentations/**']
  push:
    branches: [master]
    paths: ['.github/workflows/update-presentation-actors.yml', 'scripts/collect_presentation_actors.py']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: actor-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install beautifulsoup4==4.15.0
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_presentation_actors.py'
      - id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_presentation_actors.py --apply --output "$RUNNER_TEMP/actor-observation.json"
      - run: node scripts/test-presentations.mjs
      - run: npm run audit:data-catalog
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: actor-observations
          path: ${{ runner.temp }}/actor-observation.json
          retention-days: 35
      - id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/automated-presentation-actors.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated public actor offer terms'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte des acteurs partielle : les dernières fiches validées sont conservées. Voir actor-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
