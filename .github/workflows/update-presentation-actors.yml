name: Update actor presentations
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/update-presentation-actors.yml', 'scripts/*presentation_actors*', 'scripts/observation_rebase_guard.py', 'scripts/test_observation_rebase.py', 'scripts/validate-producer-publication.sh', 'scripts/fixtures/presentation-actors/**', 'src/data/*presentation-actors*', 'src/pages/presentations/**']
  push:
    branches: [master]
    paths: ['.github/workflows/update-presentation-actors.yml', 'scripts/collect_presentation_actors.py', 'scripts/observation_rebase_guard.py', 'scripts/validate-producer-publication.sh']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: actor-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install beautifulsoup4==4.15.0
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_observation_rebase.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_actors.py'
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_presentation_actors.py --apply --output "$RUNNER_TEMP/actor-observation.json"
      - name: "Validate observations: node scripts test-presentations.mjs"
        run: node scripts/test-presentations.mjs
      - name: "Validate observations: npm run audit:data-catalog"
        run: npm run audit:data-catalog
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: actor-observations
          path: |
            ${{ runner.temp }}/actor-observation.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        env:
          VALIDATED_DATA_CHECK: bash scripts/validate-producer-publication.sh actors
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh validated public actor offer terms' src/data/automated-presentation-actors.json
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-presentation-actors.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte des acteurs partielle : les dernières fiches validées sont conservées. Voir actor-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
