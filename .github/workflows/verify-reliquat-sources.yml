name: Verify exact WisdomTree native source candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Collect one exact native book through the ordinary producer
        id: holdings
        continue-on-error: true
        env:
          WISDOMTREE_BROWSER_CAPTURE: '1'
          WISDOMTREE_ACCESS_PROOF_DIR: ${{ runner.temp }}/access-proofs
        run: python scripts/collect_dca_complete_holdings.py --apply --only IE00BJGWQN72 --output "$RUNNER_TEMP/holdings.json"
      - name: Preserve the actual source and financial qualification separately
        if: always()
        run: |
          python - <<'PYTHON'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);p=root/'holdings.json'
          assert p.exists(),'Ordinary producer emitted no report'
          report=json.loads(p.read_text());record=json.loads(pathlib.Path('src/data/dca-complete-holdings.json').read_text()).get('IE00BJGWQN72',{})
          (root/'qualified-native-book.json').write_text(json.dumps(record,indent=2))
          print(json.dumps({'updated':report.get('updated'),'errors':report.get('errors'),'source':record.get('sourceUrl'),'scope':record.get('scope'),'captureMethod':record.get('captureMethod'),'weightBasis':record.get('weightBasis'),'asOf':record.get('asOf'),'unknownIdentities':record.get('unidentifiedSecurityCount')},ensure_ascii=False))
          assert report.get('updated')==['IE00BJGWQN72'],'Native book not validated'
          assert record.get('scope')=='complete-equity-sleeve-with-published-cash','Ranking is not a native NAV book'
          assert record.get('sourceUrl')=='https://www.wisdomtree.com/api/fund-holdings/3104137'
          PYTHON
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: wisdomtree-native-candidate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/holdings.json
            ${{ runner.temp }}/holdings.contract-plan.json
            ${{ runner.temp }}/qualified-native-book.json
            ${{ runner.temp }}/access-proofs/
          retention-days: 14
