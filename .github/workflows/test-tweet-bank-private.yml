name: Validate private tweet bank
on:
  pull_request:
    paths:
      - 'services/tweet-bank-private/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/tweet-discovery.js'
      - 'src/pages/tweet-bank/**'
      - 'scripts/build-tweet-bank-catalog.mjs'
      - 'scripts/test-tweet-discovery.mjs'
      - '.github/workflows/test-tweet-bank-private.yml'
  push:
    branches: [master]
    paths:
      - 'services/tweet-bank-private/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/tweet-discovery.js'
      - 'src/pages/tweet-bank/**'
      - 'scripts/build-tweet-bank-catalog.mjs'
      - 'scripts/test-tweet-discovery.mjs'
      - '.github/workflows/test-tweet-bank-private.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: services/tweet-bank-private
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: node scripts/build-tweet-bank-catalog.mjs --snapshot
        working-directory: .
      - run: npm test
      - run: npm run build
      - run: node scripts/test-tweet-discovery.mjs
        working-directory: .
      - run: npm ci
        working-directory: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # WebKit binaries depend on the Ubuntu release, not just runner.os=Linux.
          key: private-browsers-trio-ubuntu26-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: .
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: private-backup-diagnostics
          path: services/tweet-bank-private/test-artifacts/private-backups
          if-no-files-found: ignore
          retention-days: 7
