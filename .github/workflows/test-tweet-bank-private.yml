name: Validate private tweet bank
on:
  pull_request:
    paths:
      - 'services/tweet-bank-private/**'
      - 'src/lib/tweet-discovery.js'
      - 'src/pages/tweet-bank/**'
      - 'scripts/build-tweet-bank-catalog.mjs'
      - 'scripts/test-tweet-discovery.mjs'
      - '.github/workflows/test-tweet-bank-private.yml'
  push:
    branches: [master]
    paths:
      - 'services/tweet-bank-private/**'
      - 'src/lib/tweet-discovery.js'
      - 'src/pages/tweet-bank/**'
      - 'scripts/build-tweet-bank-catalog.mjs'
      - 'scripts/test-tweet-discovery.mjs'
      - '.github/workflows/test-tweet-bank-private.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tweet-bank-private
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: node scripts/build-tweet-bank-catalog.mjs --snapshot
        working-directory: .
      - run: npm test
      - run: npm run build
      - run: node scripts/test-tweet-discovery.mjs
        working-directory: .
