name: Verify commodity ETF details (temporary branch)
on:
  push:
    branches: [fix/check-commodity-etf-details-20261124]
    paths: [.github/workflows/temporary-test-commodity-etf-details.yml]
permissions:
  contents: read
jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/test-commodity-allocation-ui.mjs
