name: Inspect PEA sources and data inventory
on:
  push:
    branches: [fix/pea-audit-completion]
    paths: ['.github/workflows/inspect-pea-audit.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read public source samples
        shell: python
        run: |
          import urllib.request,json,hashlib,datetime
          from pathlib import Path
          out=Path('/tmp/pea-samples');out.mkdir()
          urls=[
            'https://www.zonebourse.com/cours/etf/INVESCO-FTSE-ALL-WORLD-UC-172321486/',
            'https://etf.agefi.fr/etf/VUAA',
            'https://www.blackrock.com/fr/particuliers/products/251787/ishares-euro-dividend-ucits-etf']
          rows=[]
          for i,url in enumerate(urls):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ShinnyPotatoDataAudit/1.0 (lepargnantlibre@gmail.com)'})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read();(out/f'{i}.html').write_bytes(body)
                rows.append({'url':r.url,'status':r.status,'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body),'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()})
            except Exception as e:rows.append({'url':url,'error':str(e)})
          (out/'manifest.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows))
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pea-source-samples
          path: /tmp/pea-samples
          retention-days: 7
