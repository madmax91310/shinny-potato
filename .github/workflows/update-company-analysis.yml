name: Update company analysis
on:
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-company-analysis.yml'
      - 'scripts/*company*'
      - 'scripts/sec_transport.py'
      - 'scripts/test_sec_transport.py'
      - 'scripts/commit-validated-data.sh'
      - 'scripts/test_validated_data_commit.py'
      - 'src/data/company-*.json'
      - 'src/pages/company-analysis/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-company-analysis.yml'
      - 'scripts/*company*'
      - 'scripts/sec_transport.py'
      - 'scripts/test_sec_transport.py'
      - 'scripts/commit-validated-data.sh'
      - 'scripts/test_validated_data_commit.py'
      - 'src/data/company-profiles.json'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    concurrency:
      group: company-data-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      validation_failed: ${{ steps.coverage.outcome == 'failure' }}
      collection_failed: ${{ steps.collect.outcome == 'failure' || steps.universe.outcome == 'failure' || steps.depth.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -r scripts/company-requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_company*.py'
      - run: python -m unittest discover -s scripts -p 'test_sec_transport.py'
      - run: python -m unittest discover -s scripts -p 'test_validated_data_commit.py'
      - id: universe
        name: Renew the SEC universe and retain original dates on failure
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/refresh_company_universe.py --apply --output "$RUNNER_TEMP/company-universe-observation.json"
      - name: Qualify candidates against the complete product contract
        run: node scripts/qualify-company-universe.mjs --promote --output="$RUNNER_TEMP/company-universe-coverage.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: company-universe-qualified-data
          path: |
            src/data/company-analysis.json
            src/data/company-profiles.json
            ${{ runner.temp }}/company-universe-observation.json
            ${{ runner.temp }}/company-universe-coverage.json
          if-no-files-found: error
          retention-days: 35
      - name: Probe official balance sources on runner
        if: github.event_name == 'pull_request'
        run: python scripts/probe_company_sources.py "$RUNNER_TEMP/company-source-probe.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          name: company-source-probe
          path: ${{ runner.temp }}/company-source-probe.json
          if-no-files-found: ignore
          retention-days: 35
      - name: Qualify expanded publication components from issuer documents
        if: github.event_name == 'pull_request'
        run: python scripts/refresh_company_analysis.py --apply --publications-only --only costco disney nike servicenow walmart netflix booking --output "$RUNNER_TEMP/company-expanded-qualification.json"
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/refresh_company_analysis.py --apply --output "$RUNNER_TEMP/company-observation.json"
      - id: depth
        name: Renew independently reconciled annual risk information
        continue-on-error: true
        run: python scripts/refresh_company_depth.py --apply --output "$RUNNER_TEMP/company-depth-observation.json"
      - name: "Validate observations: node scripts test-company-independent.mjs"
        run: node scripts/test-company-independent.mjs
      - name: "Validate observations: node scripts test-company-professional.mjs"
        run: node scripts/test-company-professional.mjs
      - name: "Validate observations: node scripts test-company-context.mjs"
        run: node scripts/test-company-context.mjs
      - name: Qualify every method and field
        if: always()
        run: node scripts/report-company-qualification.mjs "$RUNNER_TEMP/company-qualification.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: company-method-and-field-qualification
          path: |
            ${{ runner.temp }}/company-qualification.json
            ${{ runner.temp }}/company-depth-observation.json
          if-no-files-found: ignore
          retention-days: 35
      - name: "Validate observations: node scripts test-company-expanded-coverage.mjs"
        run: node scripts/test-company-expanded-coverage.mjs
      - name: "Validate observations: node scripts test-company-analysis.mjs"
        run: node scripts/test-company-analysis.mjs
      - name: "Validate observations: node scripts test-company-decision.mjs"
        run: node scripts/test-company-decision.mjs
      - name: "Validate observations: node scripts test-company-valuation.mjs"
        run: node scripts/test-company-valuation.mjs
      - name: "Validate observations: node scripts test-company-explorer.mjs"
        run: node scripts/test-company-explorer.mjs
      - id: coverage
        name: Require 150 usable companies and preserve the complete-data floor
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: node scripts/qualify-company-universe.mjs --minimum=140 --minimum-usable=150 --output="$RUNNER_TEMP/company-universe-coverage-final.json"
      - name: Report affected companies and missing inputs
        if: always()
        run: node scripts/report-company-acceptance.mjs "$RUNNER_TEMP/company-universe-observation.json" "$RUNNER_TEMP/company-observation.json" "$RUNNER_TEMP/company-depth-observation.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: company-final-acceptance
          path: ${{ runner.temp }}/company-universe-coverage-final.json
          if-no-files-found: ignore
      - name: "Validate observations: node scripts test-company-release.mjs"
        run: node scripts/test-company-release.mjs
      - name: "Validate observations: node scripts test-company-forecast-ledger.mjs"
        run: node scripts/test-company-forecast-ledger.mjs
      - name: Exercise forecast archive without publishing on PR
        if: github.event_name == 'pull_request'
        run: node scripts/company-forecast-ledger.mjs "$RUNNER_TEMP/company-archive" "$RUNNER_TEMP/company-forecast-evaluation.json" "$(git rev-parse HEAD)"
      - name: Archive original forecasts and evaluate matured records
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: bash scripts/company-forecast-archive.sh
      - name: Audit automatic valuation coverage
        run: node scripts/audit-company-valuation.mjs "$RUNNER_TEMP/company-valuation-coverage.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: company-valuation-coverage
          path: ${{ runner.temp }}/company-valuation-coverage.json
      - name: "Validate observations: npm run build"
        run: npm run build
      - name: Verify company UI in Chromium
        if: github.event_name == 'pull_request'
        env:
          COMPANY_QA_DIR: ${{ runner.temp }}/company-valuation-qa
          COMPANY_REQUIRE_PRICE_HISTORY: "1"
        run: |
          mkdir -p "$COMPANY_QA_DIR"
          npx playwright install --with-deps chromium
          node scripts/test-company-analysis-ui.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: company-analysis-observation
          path: |
            ${{ runner.temp }}/company-observation.json
            ${{ runner.temp }}/company-universe-observation.json
            ${{ runner.temp }}/company-depth-observation.json
          if-no-files-found: ignore
          retention-days: 35
      - uses: actions/upload-artifact@v7.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          name: company-valuation-visuals
          path: ${{ runner.temp }}/company-valuation-qa
          if-no-files-found: ignore
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh company accounts and valuation observations' src/data/company-analysis.json src/data/company-forecast-evaluation.json src/data/company-profiles.json
      - name: Report optional valuation access
        if: github.event_name != 'pull_request'
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$ALPHAVANTAGE_API_KEY" ]; then
            echo 'Issuer publications and completed-session prices are collected without a key. Trailing PER uses four published quarterly EPS; eligible IFRS annual PER is separately labeled with its fiscal year. Finviz next-fiscal-year EPS and five-year annual EPS growth estimates are collected without a key; forward PER and PEG are recalculated at the same completed-session close. Three to five years of GAAP/IFRS consolidated history are collected from SEC or official publications. Euro listings have no forecast/PEG without verified estimates.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Some sources failed. Previous observations were retained independently; stale ratios are omitted by the publication engine.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

  report-validation-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.validation_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Le contrat de couverture entreprises a échoué ; consulter company-final-acceptance.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

