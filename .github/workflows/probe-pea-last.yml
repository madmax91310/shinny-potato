name: Verify corrected download check against validated automation site
on:
  push:
    branches: [probe/pea-final-public-sources]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 27855acdf7884eb978fd1f19c16aa6b579ebf02c
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          run-id: 39378770726
          github-token: ${{ github.token }}
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-publication-continuity.mjs
