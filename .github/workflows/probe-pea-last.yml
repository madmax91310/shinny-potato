name: Verify public data automation release
on:
  push:
    branches: [probe/pea-final-public-sources]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify the public version and published data
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {writeFileSync} from 'node:fs'
          const base='https://madmax91310.github.io/shinny-potato/'
          const cache='?verify='+Date.now()
          async function read(path,json=true){const response=await fetch(base+path+cache,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000)});assert(response.ok,path+': HTTP '+response.status);return json?response.json():response.text()}
          const before=await read('build-info.json')
          const [report,csv]=await Promise.all([read('data/data-automation-summary.json'),read('data/pea-automation.csv',false)])
          const after=await read('build-info.json')
          assert.equal(before.sha,after.sha,'stable published code version')
          assert.equal(before.dataSha,after.dataSha,'stable published data version')
          assert.match(after.sha,/^[a-f0-9]{40}$/)
          assert.equal(report.schemaVersion,1)
          const summary=report.summary
          assert(summary.peaQualified>=253,'at least 253 qualified PEA statements')
          assert(summary.peaRemaining<=5,'no more than five unresolved PEA statements')
          assert.equal(summary.peaQualified+summary.peaRemaining,258)
          assert(summary.registries>=256&&summary.catalogFields>=6753,'complete inventory present')
          const lines=csv.trim().split(/\r?\n/)
          assert.equal(lines.length,259,'258 exact shares in the public CSV')
          assert.equal(lines.slice(1).filter(line=>/^"[A-Z0-9]+","[^"]+","true","(?:true|false)",/.test(line)).length,summary.peaQualified)
          const receipt={verifiedAt:new Date().toISOString(),info:after,summary,csvShares:lines.length-1}
          writeFileSync('public-release-receipt.json',JSON.stringify(receipt,null,2))
          console.log(JSON.stringify(receipt))
          NODE
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: public-data-automation-receipt
          path: public-release-receipt.json
          retention-days: 14
