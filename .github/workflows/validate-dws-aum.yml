name: Validate dated DWS AUM recovery
on:
  pull_request:
    paths:
      - 'scripts/collect_dws_etf.py'
      - 'scripts/collect_etf_pilot.py'
      - 'scripts/test_data_refresh.py'
      - 'scripts/test_source_documents.py'
      - '.github/workflows/validate-dws-aum.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_source_documents.py'
      - run: python -m unittest discover -s scripts -p 'test_data_refresh.py'
      - name: Collect exact shares and explicit fund totals from official DWS endpoints
        run: |
          python - <<'PY'
          import datetime as dt, json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from refresh_additional_etf import refresh
          config = json.loads(pathlib.Path('scripts/additional-etf-sources.json').read_text())
          config['instruments'] = [s for s in config['instruments'] if s['isin'] in ('IE00BM67HV82', 'IE00BM67HQ30')]
          config['instruments'] += [s for s in json.loads(pathlib.Path('scripts/exposure-etf-expansion.json').read_text())['instruments'] if s['isin']=='IE00BK1PV551']
          assert len(config['instruments']) == 3
          _, report = refresh(config, {}, {}, dt.datetime.now(dt.timezone.utc))
          pathlib.Path('dws-aum-validation.json').write_text(json.dumps(report, indent=2))
          for result in report['shares']:
              assert result['status'] == 'validated', result
              aum = result['record']['aum']
              assert aum['scope'] == 'fund' and aum['sourceReportedAmount'].endswith(' '+aum['currency']) and aum['amount'] > 0
              assert aum['sourceLabel'] == 'Total AUM of fund'
              assert result['record']['currency'] == 'USD'  # share currency remains separate
              print(result['isin'], aum)
          PY
      - name: Qualify exact iShares AUM through production collection and application
        run: |
          python - <<'PYTHON'
          import datetime as dt, json, pathlib, sys, tempfile
          sys.path.insert(0, 'scripts')
          from collect_etf_pilot import collect, apply_valid_shares
          config = json.loads(pathlib.Path('scripts/etf-pilot.json').read_text())
          config['instruments'] = [s for s in config['instruments'] if s['isin'] in ('IE00B4WXJJ64', 'IE0000N55FP4')]
          assert len(config['instruments']) == 2
          previous = json.loads(pathlib.Path('src/data/automated-etf.json').read_text())
          report = collect(config, {s['isin']: {'currency': s['currency']} for s in config['instruments']})
          with tempfile.TemporaryDirectory() as directory:
              destination = pathlib.Path(directory)/'active.json'
              destination.write_text(json.dumps(previous))
              apply_valid_shares(report, destination, {})
              active = json.loads(destination.read_text())
          pathlib.Path('ishares-aum-validation.json').write_text(json.dumps(report, indent=2))
          assert not report['failures'], report['failures']
          assert len(report['shares']) == 2
          for share in report['shares']:
              aum = share['aum']
              assert aum['scope'] == 'share-class' and aum['currency'] == 'EUR' and aum['amount'] > 0
              assert active[share['isin']]['aum']['amount'] == aum['amount']
              assert active[share['isin']]['aum']['asOf'] == aum['asOf']
              print(share['isin'], aum)
          PYTHON
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/test-qualified-exposures.mjs
      - run: node scripts/test-etf-tool-connections.mjs
      - run: node scripts/test-monthly-consumers.mjs
      - run: npm run audit:instrument-catalog && npm run audit:instrument-listings && npm run audit:data-provenance
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dws-aum-validation
          path: |
            dws-aum-validation.json
            ishares-aum-validation.json
          retention-days: 14
