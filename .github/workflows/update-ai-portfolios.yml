name: Update AI portfolio daily tracking
on:
  schedule:
    - cron: '20 5,9 * * *'
    - cron: '35 3 * * 0'
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      assets:
        description: 'Identifiants exacts à rattraper, séparés par des virgules (en plus des positions et références requises)'
        type: string
        default: ''
      qualification_mode:
        description: 'Reprise du catalogue (aucune décision automatisée)'
        type: choice
        options: [none, remaining, due, retry, all]
        default: none
      qualify_all:
        description: 'Retester aussi les cotations non admises'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/update-ai-portfolios.yml'
      - 'scripts/*ai*portfolio*'
      - 'scripts/*ai*equit*'
      - 'scripts/*ai*weekly*'
      - 'scripts/*ai*runtime*'
      - 'scripts/*ai-owner*'
      - 'scripts/test-ai-request-transport.mjs'
      - '.github/workflows/ai-owner-requests.yml'
      - 'scripts/rehearse-ai-week.mjs'
      - 'scripts/measure-ai-mobile.mjs'
      - 'scripts/verify-ai-final-network.mjs'
      - 'scripts/check-ai-tracking.mjs'
      - 'scripts/ai-calendar-corrections.json'
      - 'scripts/ai-series-store.mjs'
      - 'scripts/collect_ai_security_classifications.py'
      - 'scripts/review_ai_provider_types.py'
      - 'src/data/instruments.js'
      - 'src/data/instrument-listings.js'
      - 'src/data/qualified-listings.js'
      - 'src/data/equity-history-links.json'
      - 'src/data/global-equities.json'
      - 'scripts/monthly-automation.json'
      - 'src/pages/ai-portfolios/**'
      - 'data/ai-portfolios/**'
      - 'public/data/ai-portfolios/**'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    concurrency:
      group: ai-portfolio-book-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' || steps.security_types.outcome == 'failure' || steps.tracking.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r scripts/ai-portfolios-requirements.txt
      - name: Validate accounting and daily coverage
        env:
          AI_REHEARSAL_OUTPUT: ${{ runner.temp }}/ai-final-rehearsal
        run: |
          node scripts/test-ai-portfolios.mjs
          node scripts/test-ai-weekly.mjs
          node scripts/test-ai-request-transport.mjs
          node scripts/test-ai-catalogue-recovery.mjs
          node scripts/test-ai-owner-issue.mjs
          node scripts/test-ai-owner-status.mjs
          node scripts/test-ai-owner-worker.mjs
          node scripts/rehearse-ai-week.mjs
          node scripts/test-ai-equity-directory.mjs
          python -m unittest discover -s scripts -p test_ai_portfolios.py
      - name: Collect SEC fund classifications
        id: security_types
        if: inputs.qualify_all == true || github.event.schedule == '35 3 * * 0'
        continue-on-error: true
        run: python scripts/collect_ai_security_classifications.py
      - name: Discover complete official exchange directories
        if: inputs.qualify_all == true || github.event.schedule == '35 3 * * 0'
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
          python scripts/discover_ai_equities.py --refresh
      - name: Discover and qualify every due registry candidate
        if: inputs.qualify_all == true || (inputs.qualification_mode != '' && inputs.qualification_mode != 'none') || github.event.schedule == '35 3 * * 0' || github.event.schedule == '10 0 * * *'
        env:
          QUALIFICATION_MODE: ${{ inputs.qualify_all && 'all' || inputs.qualification_mode != 'none' && inputs.qualification_mode || 'due' }}
        run: python scripts/qualify_ai_portfolios.py --mode "$QUALIFICATION_MODE" --workers 4 --batch-size 100 --time-budget 1800
      - name: Collect exact daily closes and ECB FX
        id: collect
        continue-on-error: true
        env:
          REQUESTED_ASSETS: ${{ inputs.assets }}
        run: |
          args=()
          if [[ -n "$REQUESTED_ASSETS" ]]; then args+=(--assets "$REQUESTED_ASSETS"); fi
          python scripts/collect_ai_portfolios.py "${args[@]}" --report "$RUNNER_TEMP/ai-portfolio-observations.json"
      - name: Reconcile international scope and exhaustive exports
        run: python scripts/report_ai_equities.py
      - name: Execute recorded simulations and prepare valuations
        run: node scripts/ai-portfolios.mjs refresh
      - name: Report incomplete portfolio valuations
        id: tracking
        continue-on-error: true
        run: node scripts/check-ai-tracking.mjs "$RUNNER_TEMP/ai-tracking-status.json"
      - name: Require complete tracking in PR validation
        if: github.event_name == 'pull_request' && steps.tracking.outcome == 'failure'
        run: exit 1
      - name: Validate every selectable equity against the accounting engine
        run: node scripts/test-ai-equity-coverage.mjs
      - name: Audit retained source identities
        if: always()
        run: node scripts/audit-ai-runtime.mjs
      - name: Validate collected observations
        run: npm run build
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Validate desktop mobile and PNGs
        env:
          AI_REHEARSAL_OUTPUT: ${{ runner.temp }}/ai-final-rehearsal
        if: github.event_name == 'pull_request'
        run: |
          node scripts/playwright-ai-portfolios.mjs
          node scripts/playwright-ai-owner.mjs
          node scripts/playwright-ai-owner.mjs --four
          node scripts/playwright-ai-catalogue-recovery.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          name: ai-portfolio-isolated-rehearsal
          path: |
            ${{ runner.temp }}/ai-final-rehearsal/*.png
            ${{ runner.temp }}/ai-final-rehearsal/report.json
            ${{ runner.temp }}/ai-final-rehearsal/browser-report.json
            ${{ runner.temp }}/ai-final-rehearsal/dossier-initial-*.txt
            ${{ runner.temp }}/ai-final-rehearsal/format-allocation-initiale.json
            ${{ runner.temp }}/ai-final-rehearsal/owner-browser-report-*.json
            ${{ runner.temp }}/ai-final-rehearsal/assembled-*-proof.json
            ${{ runner.temp }}/ai-final-rehearsal/weekly-*.txt
            ${{ runner.temp }}/ai-final-rehearsal/initial-*.txt
          retention-days: 35
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ai-portfolio-observations
          path: |
            ${{ runner.temp }}/ai-portfolio-observations.json
            ${{ runner.temp }}/ai-tracking-status.json
            data/ai-portfolios/qualification.*
            data/ai-portfolios/runtime-audit.json
            data/ai-portfolios/equity-coverage.*
            data/ai-portfolios/equity-catalogue.*
            data/ai-portfolios/selectable-equities.*
            data/ai-portfolios/selectable-assets.*
            data/ai-portfolios/equity-scope/sources.json
            data/ai-portfolios/equity-scope/sec-fund-classifications.json
            data/ai-portfolios/qualification-progress.json
          retention-days: 35
      - name: Validate collected observations
        run: node scripts/test-ai-portfolios.mjs
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh AI portfolio daily tracking' data/ai-portfolios public/data/ai-portfolios
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-ai-portfolios.yml
  report-failures:
    needs: [refresh, deploy]
    if: always() && github.ref == 'refs/heads/master' && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Une source quotidienne admise ou une classification SEC est en échec. Les autres observations ont été conservées ; consulter les sources dans Portefeuilles IA et relancer le workflow.'
          exit 1
