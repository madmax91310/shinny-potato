name: Update INSEE monthly inflation
on:
  schedule:
    # Daily checks recover from outages and pick up provisional-to-final revisions.
    # Unchanged observations create neither a commit nor a deployment.
    - cron: '15 7 * * *'
  workflow_dispatch:
  # Bootstrap production when the collector is installed or repaired. PR runs
  # remain validation only; their success must never stand in for production.
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-inflation.yml'
      - 'scripts/update_inflation.py'
      - 'scripts/insee_month_maturity.py'
      - 'scripts/data_automation.py'
      - 'scripts/export-inflation-baseline.mjs'
  pull_request:
    paths:
      - '.github/workflows/update-inflation.yml'
      - 'scripts/update_inflation.py'
      - 'scripts/insee_month_maturity.py'
      - 'scripts/data_automation.py'
      - 'scripts/test_data_refresh.py'
      - 'scripts/export-inflation-baseline.mjs'
permissions:
  contents: read
concurrency:
  group: insee-inflation-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: python -m unittest discover -s scripts -p 'test_data_refresh.py'
      - run: node scripts/export-inflation-baseline.mjs > "$RUNNER_TEMP/inflation-baseline.json"
      - name: "Collect observations: python scripts update_inflation.py --baseline RUNNER_TEMP inflation-baseline.json --output RUNNER_TEMP inflation-observation.json --apply"
        run: python scripts/update_inflation.py --baseline "$RUNNER_TEMP/inflation-baseline.json" --output "$RUNNER_TEMP/inflation-observation.json" --apply
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: insee-inflation-pr-observation
          path: ${{ runner.temp }}/inflation-observation.json
          retention-days: 35
          if-no-files-found: error
  collect:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: python -m unittest discover -s scripts -p 'test_data_refresh.py'
      - run: node scripts/export-inflation-baseline.mjs > "$RUNNER_TEMP/inflation-baseline.json"
      - name: "Collect observations: python scripts update_inflation.py --baseline  RUNNER_TEMP inflation-baseline.json  --output  RUNNER_TEMP inflation-observation.json  --apply"
        run: python scripts/update_inflation.py --baseline "$RUNNER_TEMP/inflation-baseline.json" --output "$RUNNER_TEMP/inflation-observation.json" --apply
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: insee-inflation-observation
          path: |
            ${{ runner.temp }}/inflation-observation.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
          if-no-files-found: error
      - run: npm ci
      - name: "Validate observations: node scripts test-inflation-consistency.mjs"
        run: node scripts/test-inflation-consistency.mjs
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Update validated INSEE monthly inflation and observation quality' src/data/inflation-monthly.js scripts/source-snapshots/inflation-automated.json
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.collect.outputs.commit_sha }}
      producer: update-inflation.yml
