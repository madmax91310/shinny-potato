name: Update publication observations
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-publication-observations.yml'
      - 'scripts/observation_rebase_guard.py'
      - 'scripts/validate-producer-publication.sh'
      - 'scripts/test_observation_rebase.py'
      - 'scripts/refresh_purchasing_power.py'
      - 'scripts/insee_month_maturity.py'
      - 'scripts/refresh_anniversary_levels.py'
      - 'scripts/fred_xndx_document.py'
      - 'scripts/issuer_nav_history.py'
      - 'scripts/collect_official_share_history.py'
      - 'scripts/collect_product_calendars.py'
      - 'scripts/refresh_anniversary_indices.py'
      - 'scripts/anniversary-indices.json'
      - 'scripts/monthly-automation.json'
  pull_request:
    paths:
      - '.github/workflows/update-publication-observations.yml'
      - 'scripts/observation_rebase_guard.py'
      - 'scripts/validate-producer-publication.sh'
      - 'scripts/test_observation_rebase.py'
      - 'scripts/*publication*'
      - 'scripts/fixtures/publication/**'
      - 'scripts/test-purchasing-power*'
      - 'scripts/test-household-benchmarks.mjs'
      - 'scripts/refresh_purchasing_power.py'
      - 'scripts/insee_month_maturity.py'
      - 'scripts/refresh_anniversary_levels.py'
      - 'scripts/fred_xndx_document.py'
      - 'scripts/issuer_nav_history.py'
      - 'scripts/collect_official_share_history.py'
      - 'scripts/collect_product_calendars.py'
      - 'scripts/refresh_anniversary_indices.py'
      - 'scripts/anniversary-indices.json'
      - 'scripts/monthly-automation.json'
      - 'src/data/purchasing-power*'
      - 'src/data/anniversary-levels*'
      - 'src/pages/purchasing-power/**'
      - 'src/pages/tweet-midi/**'
permissions:
  contents: read
jobs:
  refresh:
    concurrency:
      group: publication-observations-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
      queue: max
    # Match the ordinary market producer: FRED XNDX succeeded there in40752601140.
    # The newer image timed out on all three public FRED document routes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      changed: ${{ steps.commit.outputs.changed }}
      collection_failed: ${{ steps.prices.outcome == 'failure' || steps.levels.outcome == 'failure' || steps.indices.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install official NAV document parser
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install beautifulsoup4==4.15.0 openpyxl==3.1.5 exchange_calendars==4.13.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest discover -s scripts -p 'test_publication*.py'
      - name: "Validate observations: node scripts test-anniversary-indices.mjs"
        run: node scripts/test-anniversary-indices.mjs
      - name: "Validate observations: node scripts test-publication-consumers.mjs"
        run: node scripts/test-publication-consumers.mjs
      - id: prices
        name: Collect INSEE price levels, IRL and SMIC
        continue-on-error: true
        run: python scripts/refresh_purchasing_power.py --apply --output "$RUNNER_TEMP/purchasing-observation.json"
      - id: indices
        name: Collect completed official anniversary index months
        continue-on-error: true
        run: python scripts/refresh_anniversary_indices.py --apply --output "$RUNNER_TEMP/anniversary-indices-observation.json"
      - id: levels
        name: Collect completed anniversary levels
        continue-on-error: true
        run: python scripts/refresh_anniversary_levels.py --apply --output "$RUNNER_TEMP/anniversary-observation.json"
      - name: "Validate observations: node scripts test-anniversary-indices.mjs"
        run: node scripts/test-anniversary-indices.mjs
      - name: "Validate observations: node scripts test-publication-consumers.mjs"
        run: node scripts/test-publication-consumers.mjs
      - name: "Validate observations: node scripts test-household-benchmarks.mjs"
        run: node scripts/test-household-benchmarks.mjs
      - name: "Validate observations: node scripts test-purchasing-power-editorial.mjs"
        run: node scripts/test-purchasing-power-editorial.mjs
      - name: "Validate observations: npm run build"
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: "Validate observations: node scripts playwright-publication.mjs"
        run: node scripts/playwright-publication.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: publication-observations
          path: |
            ${{ runner.temp }}/*-observation.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
          overwrite: true
          if-no-files-found: error
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          VALIDATED_DATA_CHECK: bash scripts/validate-producer-publication.sh publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh dated publication observations' src/data/purchasing-power-observations.json src/data/anniversary-levels.json src/data/anniversary-index-history.json scripts/source-snapshots/anniversary-indices.json
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-publication-observations.yml

  report-failures:
    needs: [refresh, deploy]
    if: ${{ always() && needs.refresh.outputs.collection_failed == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte partielle : dernières observations validées conservées. Voir publication-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
