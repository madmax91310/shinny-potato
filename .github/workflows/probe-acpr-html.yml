name: Probe ACPR HTML transport (read only)
on:
  push:
    branches: [probe/acpr-html-20261113]
    paths: ['.github/workflows/probe-acpr-html.yml']
permissions:
  contents: read
jobs:
  transport:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch exact official HTML over verified HTTPS
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request, urllib.error, hashlib, json, pathlib, datetime, platform
          path='/fr/publications-et-statistiques/publications/ndeg-180-revalorisation-2025-des-contrats-dassurance-vie-et-de-capitalisation'
          attempts=[]
          for host in ('acpr.banque-france.fr','www.banque-france.fr'):
              url='https://'+host+path
              record={'url':url,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'platform':platform.platform()}
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'fr-FR,fr;q=0.9,en;q=0.8','Accept':'application/pdf,text/html,*/*'})
                  try:
                      response=urllib.request.urlopen(request,timeout=40)
                  except urllib.error.HTTPError as error:
                      response=error
                  with response:
                      body=response.read(8000001)
                      record.update(status=response.status, finalUrl=response.geturl(), contentType=response.headers.get('Content-Type'), bytes=len(body),sha256=hashlib.sha256(body).hexdigest())
                  pathlib.Path('evidence/'+host+'.html').write_bytes(body)
                  record['containsIndividual']=b'contrats individuels' in body
                  record['contains263']=b'2,63' in body
              except Exception as error:
                  record['error']=str(error)
              attempts.append(record)
          result={'scope':'Read-only transport probe; no production observation, no data changes','attempts':attempts}
          pathlib.Path('evidence/transport.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: acpr-html-${{ matrix.os }}
          path: evidence/
          retention-days: 35
