# Historical recovery entry point; the complete gate lives only in deploy-pages.yml.
name: Verify ETF publication 954
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verify-etf-publication-954.yml'
permissions:
  contents: read
  pages: write
  deployments: read
  id-token: write
jobs:
  verify:
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ github.sha }}
      validation_group: etf-publication-954
