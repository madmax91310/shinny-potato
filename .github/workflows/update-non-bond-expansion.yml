name: Update non-bond expansion
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/*non_bond*'
      - 'scripts/collect_invesco_allocations.py'
      - 'scripts/*non-bond*'
      - '.github/workflows/update-non-bond-expansion.yml'
      - 'scripts/apply_etf_collection.py'
      - 'scripts/wisdomtree_directory_aum.py'
      - 'scripts/test_wisdomtree_directory_aum.py'
      - 'scripts/issuer-access-routes.json'
  pull_request:
    paths:
      - 'scripts/test_issuer_refresh.py'
      - 'scripts/fixtures/characteristic-controls/**'
      - 'scripts/*non_bond*'
      - 'scripts/collect_invesco_allocations.py'
      - 'scripts/*non-bond*'
      - 'src/data/non-bond*'
      - '.github/workflows/update-non-bond-expansion.yml'
      - 'scripts/apply_etf_collection.py'
      - 'scripts/wisdomtree_directory_aum.py'
      - 'scripts/test_wisdomtree_directory_aum.py'
      - 'scripts/issuer-access-routes.json'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      # The ordinary ETF writer validates against these same non-bond outputs.
      # Serialize before checkout; do not weaken the rebase/input guard.
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r scripts/company-requirements.txt openpyxl==3.1.5
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_non_bond_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_directory_aum.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_refresh.py'
      - run: python -m unittest discover -s scripts -p 'test_roadmap_assets.py'
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/refresh_non_bond_sources.py --apply --output "$RUNNER_TEMP/non-bond.json"
      - name: "Validate observations: node scripts audit-automated-monthly.mjs"
        run: node scripts/audit-automated-monthly.mjs
      - name: "Validate observations: node scripts audit-comparison-automation.mjs"
        run: node scripts/audit-comparison-automation.mjs
      - name: "Validate observations: node scripts test-qualified-exposures.mjs"
        run: node scripts/test-qualified-exposures.mjs
      - name: "Validate observations: node scripts test-etf-tool-connections.mjs"
        run: node scripts/test-etf-tool-connections.mjs
      - name: "Validate observations: npm run audit:instrument-catalog"
        run: npm run audit:instrument-catalog
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: non-bond-source-observation
          path: |
            ${{ runner.temp }}/non-bond.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Verify histories reach all publication tools
        run: node scripts/build-dca-exposures.mjs && node scripts/audit-portfolio-routing.mjs
      - name: Commit validated observations
        id: commit
        env:
          VALIDATED_DATA_CHECK: bash scripts/validate-producer-publication.sh non-bond
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh approved non-bond expansion sources' src/data/non-bond-etf-records.json src/data/non-bond-qualified-records.json src/data/non-bond-monthly-records.json src/data/non-bond-levels.json scripts/source-snapshots/non-bond-monthly-active.json
  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-non-bond-expansion.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Collecte partielle : dernières valeurs fiables conservées ; données validées publiées si les contrôles réussissent.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
