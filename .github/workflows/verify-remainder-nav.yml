name: Read-only qualification of existing exact-index S&P PDF route
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Exercise the existing qualified PDF parser, no data writes or handoff cache
        run: |
          python - <<'PY'
          import sys, json, pathlib, datetime as dt
          sys.path.insert(0,'scripts')
          from collect_sp_composition import collect
          expected=['sp-global-dividend-aristocrats','sp-euro-dividend-aristocrats']
          configs={c['id']:c for c in json.load(open('scripts/index-automation.json'))['indices']}
          report={'expectedIds':expected,'selection':'fixed existing indices before source access','readOnly':True,'checkedAt':dt.datetime.now(dt.timezone.utc).isoformat(),'outcomes':[]}
          for id in expected:
            c=dict(configs[id]); c.pop('compositionDataUrl',None)
            try:
              facts=collect(c,dt.datetime.now(dt.timezone.utc))
              report['outcomes'].append({'id':id,'status':'validated-partial','sourceAttempted':True,'facts':facts,'fullPositionsQualified':False,'top10WeightsQualified':False})
            except Exception as e:
              report['outcomes'].append({'id':id,'status':'failed','sourceAttempted':True,'sourceUrl':c['sourceUrl'],'reason':str(e)})
          pathlib.Path('/tmp/sp-pdf-qualification.json').write_text(json.dumps(report,indent=2))
          print([(r['id'],r['status'],r.get('reason')) for r in report['outcomes']])
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exact-index-official-pdf-qualification
          path: /tmp/sp-pdf-qualification.json
          if-no-files-found: error
          retention-days: 35
