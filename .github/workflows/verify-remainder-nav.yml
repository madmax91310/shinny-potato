name: Verify remainder exact-share NAV routes
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Exact configured remainder NAV IDs, separated by spaces; empty keeps the existing full qualification'
        type: string
        default: ''
  pull_request:
    paths:
      - 'scripts/amundi_nav_history.py'
      - 'scripts/bitwise_nav_history.py'
      - 'scripts/test_amundi_nav_history.py'
      - 'scripts/test_bitwise_nav_history.py'
      - 'scripts/test-monthly-window-nav-consumers.mjs'
      - '.github/workflows/verify-remainder-nav.yml'
  push:
    branches: [fix/reliquat-79-20261023]
    paths:
      - 'scripts/official-nav-remainder-sources.json'
      - 'scripts/collect_official_share_history.py'
      - '.github/workflows/verify-remainder-nav.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare ordinary official document reader
        run: bash scripts/ensure-ci-runtime.sh poppler
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare ordinary public browser fallback
        run: bash scripts/ensure-ci-runtime.sh chromium
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4
      - name: Collect exact shares, verify identity, income, currency and annual bounds
        if: github.event_name != 'pull_request'
        env:
          NAV_ONLY: ${{ inputs.only }}
        run: |
          python - <<'PY'
          import json, os, shlex, subprocess, sys
          allowed = [r['id'] for r in json.load(open('scripts/official-nav-remainder-sources.json'))]
          ids = shlex.split(os.environ.get('NAV_ONLY', '')) or allowed
          if len(ids) != len(set(ids)) or any(i not in allowed for i in ids):
              raise SystemExit('Unknown or repeated exact NAV target')
          subprocess.run([sys.executable, 'scripts/collect_official_share_history.py', '--only', *ids,
                          '--output', os.path.join(os.environ['RUNNER_TEMP'], 'nav.json'),
                          '--capture-dir', os.path.join(os.environ['RUNNER_TEMP'], 'nav-raw')], check=True)
          PY
      - name: Check exact share units and Bitwise workbook validation
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s scripts -p test_amundi_nav_history.py
          python -m unittest discover -s scripts -p test_bitwise_nav_history.py
      - name: Exercise the ordinary producer and consumers on an isolated checkout
        if: github.event_name == 'pull_request'
        run: |
          node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/monthly-window-baseline.json"
          python scripts/refresh_monthly_history.py --only etfFR0010755611Nav etfFR0013411998Nav etfFR0013412004Nav etfDE000A27Z304Nav --baseline "$RUNNER_TEMP/monthly-window-baseline.json" --output "$RUNNER_TEMP/monthly-window-observation.json" --evidence-output "$RUNNER_TEMP/monthly-window-evidence.json" --apply
          node scripts/test-monthly-window-nav-consumers.mjs etfFR0010755611Nav etfFR0013411998Nav etfFR0013412004Nav etfDE000A27Z304Nav
          npm run build
      - name: Preserve real results even after a failure
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: remainder-exact-share-nav
          path: |
            ${{ runner.temp }}/nav.json
            ${{ runner.temp }}/nav-raw
            ${{ runner.temp }}/monthly-window-observation.json
            ${{ runner.temp }}/monthly-window-evidence.json
          retention-days: 35

  initialize-reviewed-observations:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/qualified-six-monthly-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: remainder-exact-share-nav
          run-id: 45338450833
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reviewed-monthly
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Import only observations from the validated producer receipt
        run: |
          git diff --exit-code 8a3bfcb27da58f0c9863e865eed41c7e903bb785 HEAD -- scripts src
          PYTHONPATH=scripts python - <<'PY'
          import json, os, pathlib
          from data_automation import write_json_atomic
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-monthly/monthly-window-evidence.json'
          report = json.loads(receipt.read_text())
          expected = {'etfFR0010755611Nav', 'etfFR0013411998Nav', 'etfFR0013412004Nav', 'etfDE000A27Z304Nav'}
          assert len(report['series']) == len(expected) and set(report['scope']['expectedIds']) == expected
          assert {r['id'] for r in report['series'] if r['status'] == 'validated'} == expected
          active_path = pathlib.Path('src/data/automated-etf-monthly.json')
          evidence_path = pathlib.Path('scripts/source-snapshots/monthly-automated.json')
          status_path = pathlib.Path('scripts/source-snapshots/monthly-collection-status.json')
          active, evidence, status = (json.loads(p.read_text()) for p in (active_path, evidence_path, status_path))
          for row in report['series']:
              identity = row['id']
              record = row['record']
              proof = row['evidence']
              assert record['responseSha256'] == proof['responseSha256']
              assert len(record['points']) == len(proof['proofRows']) and record['calendarProof']['checks']
              assert identity not in active or active[identity] == record
              active[identity] = record
              evidence[identity] = {k: v for k, v in proof.items() if k not in ('rawResponse', 'points', 'anniversaryPoints')}
              status['series'][identity] = dict(status='validated', checkedAt=report['checkedAt'],
                  periodEnd=record['periodEnd'], periodStart=record['periodStart'], responseSha256=record['responseSha256'])
          for path, value in zip((active_path, evidence_path, status_path), (active, evidence, status)):
              write_json_atomic(path, value)
          PY
          node scripts/build-equity-history-links.mjs
          node scripts/build-ranking-annual.mjs
          node scripts/build-monthly-duel-returns.mjs
          node scripts/build-equity-duel-returns.mjs
          node scripts/audit-automated-monthly.mjs
          node scripts/test-monthly-window-nav-consumers.mjs etfFR0010755611Nav etfFR0013411998Nav etfFR0013412004Nav etfDE000A27Z304Nav
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/automated-etf-monthly.json src/data/equity-history-links.json src/data/ranking-annual.json src/data/monthly-duel-returns.json src/data/equity-duel-returns.json scripts/source-snapshots/monthly-automated.json scripts/source-snapshots/monthly-collection-status.json docs/equity-identity-gaps.json
          git commit -m 'Record validated Amundi and Bitwise monthly observations from GitHub'
          git push origin HEAD:refs/heads/fix/qualified-six-monthly-20261124
