name: Verify data review sources without publication
on:
  pull_request:
    paths:
      - '.github/workflows/verify-data-review.yml'
      - 'scripts/issuer-access-routes.json'
      - 'scripts/collect_official_share_history.py'
      - 'scripts/collect_vaneck_etf.py'
  workflow_dispatch:
    inputs:
      scopes:
        description: JSON list of isolated collector scopes
        required: true
        default: '["fx","holdings","metadata","practical","copper","ai","conflict"]'
permissions:
  contents: read
jobs:
  sources:
    if: github.event_name == 'workflow_dispatch' && inputs.scopes != '["wisdomtree-native-macos"]'
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(inputs.scopes) }}
    runs-on: ${{ matrix.scope == 'brokers-macos' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
        if: runner.os == 'Linux'
      - run: brew install poppler
        if: runner.os == 'macOS'
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4 openpyxl xlrd exchange_calendars
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: contains(fromJSON('["holdings","holdings-retry","copper","financial","discovery"]'), matrix.scope)
      - name: Collect and validate exact sources in isolated checkout
        env:
          WISDOMTREE_BROWSER_CAPTURE: '1'
        run: python scripts/verify_data_review_sources.py --scope ${{ matrix.scope }} --output evidence
      - name: Preserve individual results and validated registries
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-review-${{ matrix.scope }}
          path: evidence/
          retention-days: 35

  routes:
    if: github.event_name == 'workflow_dispatch' && inputs.scopes != '["wisdomtree-native-macos"]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/probe_review_routes.py --output evidence
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: data-review-routes
          path: evidence/

  vaneck-route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4 openpyxl xlrd exchange_calendars
      - run: npm ci
      - name: Prepare official document readers
        timeout-minutes: 5
        run: |
          if ! command -v pdftotext >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
          if ! test -x /usr/bin/google-chrome && ! test -x /usr/bin/chromium; then npx playwright install --with-deps chromium; fi
      - name: Qualify the Danish public route with the full official NAV validator
        run: |
          python3 - <<'PY'
          import datetime as dt, hashlib, json, pathlib, shutil, sys
          sys.path.insert(0,'scripts')
          from data_automation import UTC, write_json_atomic
          from issuer_documents import download
          from collect_vaneck_etf import download_document
          from collect_official_share_history import configurations, collect_one
          import collect_official_share_history as official_history
          from collect_ranking_sources import ECB, parse_fx
          out=pathlib.Path('vaneck-evidence');out.mkdir(exist_ok=True)
          url='https://www.vaneck.com/dk/en/library/fact-sheets/gdig-fact-sheet.pdf'
          now=dt.datetime.now(UTC)
          stage='document-access'
          fx_proof=None
          try:
              raw,actual=download_document({'sourceUrl':url,'fallbackUrls':[]})
              if actual!=url:raise ValueError('Unexpected route used for qualification')
              (out/'gdig-dk.pdf').write_bytes(raw)
              source=next(s for s in configurations() if s['id']=='etfIE00BDFBTQ78')
              source={**source,'factsheetUrl':url}
              # This independent document probe keeps testing the PDF route;
              # the active producer may now qualify its calendar via page APIs.
              source.pop('navCalendarSource',None)
              # A live NAV probe can reach the newly completed month before its
              # shared FX registry is recorded on master. Qualify the same EUR
              # use with the ordinary BCE parser in an isolated input root;
              # never switch to native USD or modify the production registry.
              stage='conversion-inputs'
              original_root=official_history.ROOT
              fx=json.loads((original_root/'src/data/monthly-fx.json').read_text())
              month=(now.replace(day=1)-dt.timedelta(days=1)).strftime('%Y-%m')
              renewed=month not in fx.get('months',{})
              if renewed:
                  xml=download(ECB,max_bytes=12_000_000)
                  fx=parse_fx(xml,now)
                  (out/'ecb-source.xml').write_bytes(xml)
              fx_proof={'sourceUrl':fx['sourceUrl'],'sha256':fx['sha256'],
                        'sourceCheckedAt':fx['checkedAt'],'requiredMonth':month,
                        'observationAsOf':fx['months'][month]['asOf'],
                        'sourceConsulted':renewed,'publishedByThisRun':False}
              isolated=out/'conversion-inputs';(isolated/'src/data').mkdir(parents=True,exist_ok=True)
              write_json_atomic(isolated/'src/data/monthly-fx.json',fx)
              shutil.copy2(original_root/'src/data/freshness-policy.json',isolated/'src/data/freshness-policy.json')
              official_history.ROOT=isolated.resolve()
              def exact_document(target):
                  if '/library/fact-sheets/' in target:
                      if target!=url:raise ValueError('Other document routes disabled during this qualification')
                      return raw
                  return download(target)
              stage='exact-share-nav-qualification'
              try:record=collect_one(source,now,document_fetch=exact_document,capture=out/'raw')
              finally:official_history.ROOT=original_root
              if url not in record['sourceUrls']:raise ValueError('Qualified route missing from provenance')
              write_json_atomic(out/'record.json',record)
              proof={'checkedAt':now.isoformat(),'status':'qualified','route':url,'sha256':hashlib.sha256(raw).hexdigest(),'isin':source['isin'],'latestLevel':record['latestLevel'],'calendarProof':record['calendarProof'],'conversionDependency':fx_proof,'publication':'not-requested'}
              write_json_atomic(out/'qualification.json',proof);print(json.dumps(proof,ensure_ascii=False))
          except Exception as error:
              write_json_atomic(out/'qualification.json',{'checkedAt':now.isoformat(),'status':'blocked','route':url,'stage':stage,'error':str(error),'errorSourceUrl':getattr(error,'url',None),'conversionDependency':fx_proof,'publication':'not-requested'})
              raise
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: data-review-vaneck-dk
          path: vaneck-evidence/
          retention-days: 35

  native-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.scopes == '["wisdomtree-native-macos"]'
    runs-on: macos-15
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Read one official exact-share book without production writes
        run: |
          python - <<'PYTHON'
          import urllib.request,json,pathlib,datetime,hashlib,math
          root=pathlib.Path('evidence');root.mkdir()
          url='https://www.wisdomtree.com/api/fund-holdings/58690128'
          report={'expected':[{'instrument':'IE000W8WMSL2','field':'native-complete-book','classId':58690128,'ticker':'WQTM LN'}],'attemptedIds':['IE000W8WMSL2'],'sourceAttempted':True,'sourceUrl':url,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'trigger':'workflow_dispatch','runner':'macos-15','productionWritten':False}
          try:
            req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'EpargnantLibre source qualification lepargnantlibre@gmail.com'})
            response=urllib.request.urlopen(req,timeout=45);raw=response.read(4000001)
            if len(raw)>4000000:raise ValueError('Response too large')
            rows=json.loads(raw)
            if not isinstance(rows,list)or len(rows)<11:raise ValueError('Empty or partial book')
            if any(r.get('wtClassID')!=58690128 or r.get('fundTicker')!='WQTM LN' for r in rows):raise ValueError('Wrong exact share or listing')
            dates={r.get('dt')for r in rows}
            if len(dates)!=1:raise ValueError('Mixed dates')
            weights=[r.get('wgt')for r in rows]
            if not all(type(w)in(int,float)and math.isfinite(w)and 0<=w<=1 for w in weights)or abs(sum(weights)-1)>1e-7:raise ValueError('Unqualified source book weights')
            (root/'native-api.json').write_bytes(raw)
            report.update(status='validated-source-book-only',sha256=hashlib.sha256(raw).hexdigest(),asOf=next(iter(dates)),rows=len(rows),publishedTotalWeight=sum(weights),identityQualification='Not certified by this transport probe; retained separate proofs required')
          except Exception as error:report.update(status='failed',error=str(error)[:1000])
          (root/'native-probe.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          if report['status']=='failed':raise SystemExit(1)
          PYTHON
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: wisdomtree-native-macos-exact-source
          path: evidence/
          retention-days: 35
