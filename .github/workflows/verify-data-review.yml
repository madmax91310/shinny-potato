name: Verify LSE exact CSPX public alternative without publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public source without admitting a financial series
        run: node scripts/probe-lse-public.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lse-public-cspx-unqualified
          path: evidence/
          retention-days: 35
