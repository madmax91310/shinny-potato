name: Update editorial radar
on:
  schedule:
    - cron: '7,37 6-19 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-editorial-radar.yml'
      - 'scripts/*editorial-radar.mjs'
      - 'scripts/lib/editorial-radar.mjs'
      - 'scripts/lib/dws-reconciliation.mjs'
      - 'scripts/verify_dws_compositions.py'
      - 'scripts/test_dws_reconciliation.py'
      - 'scripts/test-dws-reconciliation.mjs'
      - 'scripts/lib/radar-news.mjs'
      - 'scripts/lib/radar-publications.mjs'
      - 'scripts/lib/radar-households.mjs'
      - 'scripts/lib/radar-schedule.mjs'
      - 'scripts/lib/radar-source-access.mjs'
      - 'scripts/lib/radar-extra-sources.mjs'
      - 'src/lib/radar-policy.js'
      - 'scripts/lib/radar-consumer.mjs'
      - 'scripts/test-radar-consumer.mjs'
      - 'scripts/fixtures/radar-consumer/**'
      - 'src/data/allowed-media.js'
      - 'src/lib/radar-housing.js'
      - 'scripts/test-radar-extensions.mjs'
      - 'scripts/check-radar-sources.mjs'
      - 'scripts/test-radar-publications.mjs'
      - 'scripts/fixtures/radar-publications/**'
      - 'src/lib/radar-editorial.js'
      - 'src/lib/replication-method.js'
      - 'scripts/test-radar-editorial.mjs'
      - 'scripts/lib/purchasing-power-news.mjs'
      - 'scripts/lib/purchasing-power-sources.mjs'
      - 'scripts/test-purchasing-power-news.mjs'
      - 'scripts/lib/radar-notifications.mjs'
      - 'scripts/test-radar-notifications.mjs'
      - 'src/data/automated-*.json'
      - 'src/data/qualified-exposure-etfs.json'
      - 'src/data/non-bond-*-records.json'
      - 'src/data/lifestrategy.json'
      - 'src/data/purchasing-power-observations.json'
      - 'public/data/investors/*.json'
  pull_request:
    paths:
      - '.github/workflows/update-editorial-radar.yml'
      - 'scripts/*editorial-radar.mjs'
      - 'scripts/lib/editorial-radar.mjs'
      - 'scripts/lib/dws-reconciliation.mjs'
      - 'scripts/verify_dws_compositions.py'
      - 'scripts/test_dws_reconciliation.py'
      - 'scripts/test-dws-reconciliation.mjs'
      - 'scripts/lib/radar-news.mjs'
      - 'scripts/lib/radar-publications.mjs'
      - 'scripts/lib/radar-households.mjs'
      - 'scripts/lib/radar-schedule.mjs'
      - 'scripts/lib/radar-source-access.mjs'
      - 'scripts/lib/radar-extra-sources.mjs'
      - 'src/lib/radar-policy.js'
      - 'scripts/lib/radar-consumer.mjs'
      - 'scripts/test-radar-consumer.mjs'
      - 'scripts/fixtures/radar-consumer/**'
      - 'src/data/allowed-media.js'
      - 'src/lib/radar-housing.js'
      - 'scripts/test-radar-extensions.mjs'
      - 'scripts/check-radar-sources.mjs'
      - 'scripts/test-radar-publications.mjs'
      - 'scripts/fixtures/radar-publications/**'
      - 'src/lib/radar-editorial.js'
      - 'src/lib/replication-method.js'
      - 'scripts/test-radar-editorial.mjs'
      - 'scripts/lib/purchasing-power-news.mjs'
      - 'scripts/lib/purchasing-power-sources.mjs'
      - 'scripts/test-purchasing-power-news.mjs'
      - 'scripts/lib/radar-notifications.mjs'
      - 'scripts/test-radar-notifications.mjs'
      - 'src/pages/editorial-radar/**'
  workflow_run:
    workflows:
      - Update active ETF issuer data
      - Update qualified exposure ETF data
      - Update non-bond expansion
      - Update Vanguard LifeStrategy data
      - Update investor 13F portfolios
      - Update insurance presentations
      - Update SCPI presentations
      - Update official economic data
      - Update official regulatory data
      - Update publication observations
    types: [completed]
permissions:
  contents: read
concurrency:
  group: editorial-radar-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_dws_reconciliation.py'
      - run: node scripts/test-dws-reconciliation.mjs
      - run: node scripts/test-editorial-radar.mjs
      - run: node scripts/test-radar-editorial.mjs
      - run: node scripts/test-radar-publications.mjs
      - run: node scripts/test-radar-extensions.mjs
      - run: node scripts/test-radar-consumer.mjs
      - run: node scripts/test-radar-notifications.mjs
      - run: node scripts/test-purchasing-power-news.mjs
      - name: Check official purchasing-power feeds
        run: node scripts/test-purchasing-power-news.mjs --live
      - name: Verify live DWS portfolios independently
        run: |
          python scripts/verify_dws_compositions.py --check > "$RUNNER_TEMP/dws-verification.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dws-composition-verification
          path: ${{ runner.temp }}/dws-verification.json
          retention-days: 35
          if-no-files-found: ignore
      - run: node scripts/update-editorial-radar.mjs --output "$RUNNER_TEMP/editorial-radar"
  update:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      failed: ${{ steps.partial.outputs.failed }}
    steps:
      # Execute only trusted master code, never code from a triggering PR.
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_dws_reconciliation.py'
      - run: node scripts/test-dws-reconciliation.mjs
      - run: node scripts/test-editorial-radar.mjs
      - run: node scripts/test-radar-editorial.mjs
      - run: node scripts/test-radar-publications.mjs
      - run: node scripts/test-radar-extensions.mjs
      - run: node scripts/test-radar-consumer.mjs
      - run: node scripts/test-radar-notifications.mjs
      - run: node scripts/test-purchasing-power-news.mjs
      # HTML and PDF official announcements; no retail availability inferred.
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Publish comparable observations and new signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RADAR_SOURCE_SHA=$(git rev-parse HEAD)
          node scripts/publish-editorial-radar.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: editorial-radar-observations
          path: ${{ runner.temp }}/editorial-radar/feed.json
          retention-days: 35
          if-no-files-found: ignore
      - name: Detect partial failures
        id: partial
        if: always()
        run: python scripts/report_partial_failures.py "$RUNNER_TEMP/editorial-radar/feed.json"
  report-failures:
    needs: [update]
    if: always() && needs.update.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Radar partiel : une famille de sources locales est illisible ; ses signaux précédents sont conservés. Voir editorial-radar-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
