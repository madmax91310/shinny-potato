      - 'scripts/check-radar-source-recovery.mjs'
      - 'scripts/fixtures/radar-source-recovery/**'
      - 'scripts/lib/radar-extra-sources.mjs'
      - 'src/lib/radar-policy.js'
      - 'src/lib/radar-qualification.js'
      - 'src/lib/radar-material.js'
      - 'src/lib/radar-fact-types.js'
      - 'src/lib/radar-titles.js'
      - 'src/lib/radar-overview.js'
      - 'scripts/lib/radar-tool-actions.mjs'
      - 'scripts/test-radar-publication-policy.mjs'
      - 'scripts/fixtures/radar-publication/**'
      - 'scripts/lib/radar-consumer.mjs'
      - 'scripts/lib/radar-coverage.mjs'
      - 'scripts/lib/radar-offer-watch.mjs'
      - 'scripts/lib/radar-queue.mjs'
      - 'scripts/lib/radar-run-metrics.mjs'
      - 'scripts/lib/radar-etf-table.mjs'
      - 'scripts/lib/radar-article-body.mjs'
      - 'scripts/lib/radar-relationships.mjs'
      - 'scripts/test-radar-audit-fixes.mjs'
      - 'scripts/replay-radar-audit.mjs'
      - 'scripts/check-radar-audit-fixes.mjs'
      - 'scripts/fixtures/radar-audit/**'
      - 'scripts/lib/radar-insee-search.mjs'
      - 'scripts/test-radar-depth.mjs'
      - 'scripts/check-radar-depth.mjs'
      - 'scripts/fixtures/radar-depth/**'
      - 'scripts/test-radar-coverage.mjs'
      - 'scripts/check-radar-coverage.mjs'
      - 'scripts/fixtures/radar-coverage/**'
      - 'scripts/test-radar-consumer.mjs'
      - 'scripts/fixtures/radar-consumer/**'
      - 'src/data/allowed-media.js'
      - 'src/lib/radar-housing.js'
      - 'scripts/test-radar-extensions.mjs'
      - 'scripts/check-radar-sources.mjs'
      - 'scripts/test-radar-publications.mjs'
      - 'scripts/fixtures/radar-publications/**'
      - 'src/lib/radar-editorial.js'
      - 'src/lib/replication-method.js'
      - 'scripts/test-radar-editorial.mjs'
      - 'scripts/lib/purchasing-power-news.mjs'
      - 'scripts/lib/purchasing-power-sources.mjs'
      - 'scripts/test-purchasing-power-news.mjs'
      - 'scripts/lib/radar-notifications.mjs'
      - 'scripts/test-radar-notifications.mjs'
      - 'src/data/automated-*.json'
      - 'src/data/qualified-exposure-etfs.json'
      - 'src/data/non-bond-*-records.json'
      - 'src/data/lifestrategy.json'
      - 'src/data/purchasing-power-observations.json'
      - 'public/data/investors/*.json'
  pull_request:
    paths:
      - '.github/workflows/update-editorial-radar.yml'
      - 'scripts/*editorial-radar.mjs'
      - 'scripts/lib/editorial-radar.mjs'
      - 'scripts/lib/radar-state-codec.mjs'
      - 'scripts/test-radar-state-codec.mjs'
      - 'scripts/fixtures/radar-state-v1-reader.mjs'
      - 'scripts/lib/dws-reconciliation.mjs'
      - 'scripts/lib/radar-allocation-coverage.mjs'
      - 'scripts/verify_dws_compositions.py'
      - 'scripts/test_dws_reconciliation.py'
      - 'scripts/test-dws-reconciliation.mjs'
      - 'scripts/lib/radar-news.mjs'
      - 'scripts/lib/radar-publications.mjs'
      - 'scripts/lib/bdf-debt-charts.mjs'
      - 'scripts/test-bdf-debt-charts.mjs'
      - 'scripts/check-radar-bdf-debt.mjs'
      - 'scripts/lib/radar-households.mjs'
      - 'scripts/lib/radar-schedule.mjs'
      - 'scripts/lib/radar-source-access.mjs'
      - 'scripts/lib/radar-source-health.mjs'
      - 'scripts/test-radar-source-recovery.mjs'
      - 'scripts/check-radar-source-recovery.mjs'
      - 'scripts/fixtures/radar-source-recovery/**'
      - 'scripts/lib/radar-extra-sources.mjs'
      - 'src/lib/radar-policy.js'
      - 'src/lib/radar-qualification.js'
      - 'src/lib/radar-material.js'
      - 'src/lib/radar-fact-types.js'
      - 'src/lib/radar-titles.js'
      - 'src/lib/radar-overview.js'
      - 'scripts/lib/radar-tool-actions.mjs'
      - 'scripts/test-radar-publication-policy.mjs'
      - 'scripts/fixtures/radar-publication/**'
      - 'scripts/lib/radar-consumer.mjs'
      - 'scripts/lib/radar-coverage.mjs'
      - 'scripts/lib/radar-offer-watch.mjs'
      - 'scripts/lib/radar-queue.mjs'
      - 'scripts/lib/radar-run-metrics.mjs'
      - 'scripts/lib/radar-etf-table.mjs'
      - 'scripts/lib/radar-article-body.mjs'
      - 'scripts/lib/radar-relationships.mjs'
      - 'scripts/test-radar-audit-fixes.mjs'
      - 'scripts/replay-radar-audit.mjs'
      - 'scripts/check-radar-audit-fixes.mjs'
      - 'scripts/fixtures/radar-audit/**'
      - 'scripts/lib/radar-insee-search.mjs'
      - 'scripts/test-radar-depth.mjs'
      - 'scripts/check-radar-depth.mjs'
      - 'scripts/fixtures/radar-depth/**'
      - 'scripts/test-radar-coverage.mjs'
      - 'scripts/check-radar-coverage.mjs'
      - 'scripts/fixtures/radar-coverage/**'
      - 'scripts/test-radar-consumer.mjs'
      - 'scripts/fixtures/radar-consumer/**'
      - 'src/data/allowed-media.js'
      - 'src/lib/radar-housing.js'
      - 'scripts/test-radar-extensions.mjs'
      - 'scripts/check-radar-sources.mjs'
      - 'scripts/test-radar-publications.mjs'
      - 'scripts/fixtures/radar-publications/**'
      - 'src/lib/radar-editorial.js'
      - 'src/lib/replication-method.js'
      - 'scripts/test-radar-editorial.mjs'
      - 'scripts/lib/purchasing-power-news.mjs'
      - 'scripts/lib/purchasing-power-sources.mjs'
      - 'scripts/test-purchasing-power-news.mjs'
      - 'scripts/lib/radar-notifications.mjs'
      - 'scripts/test-radar-notifications.mjs'
      - 'src/pages/editorial-radar/**'
  workflow_run:
    workflows:
      - Update active ETF issuer data
      - Update qualified exposure ETF data
      - Update non-bond expansion
      - Update Vanguard LifeStrategy data
      - Update investor 13F portfolios
      - Update insurance presentations
      - Update SCPI presentations
      - Update official economic data
      - Update official regulatory data
      - Update publication observations
    types: [completed]
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      # Reuse the existing X text counter for qualified Grok suggestions.
      - run: npm ci --omit=dev --ignore-scripts
      - run: python -m unittest discover -s scripts -p 'test_dws_reconciliation.py'
      - run: node scripts/test-dws-reconciliation.mjs
      - run: node scripts/test-editorial-radar.mjs
      - run: node scripts/test-radar-state-codec.mjs
      - run: node scripts/test-radar-editorial.mjs
      - run: node scripts/test-radar-publications.mjs
      - run: node scripts/test-radar-extensions.mjs
      - run: node scripts/test-radar-consumer.mjs
      - run: node scripts/test-radar-coverage.mjs
      - run: node scripts/test-radar-depth.mjs
      - run: node scripts/test-radar-audit-fixes.mjs
      - run: node scripts/test-radar-source-recovery.mjs
      - run: node scripts/test-radar-notifications.mjs
      - run: node scripts/test-radar-publication-policy.mjs "$RUNNER_TEMP/radar-publication-policy"
      - run: node scripts/test-purchasing-power-news.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Qualify the current official BDF debt charts (read-only)
        run: node scripts/check-radar-bdf-debt.mjs "$RUNNER_TEMP/radar-bdf-debt"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-bdf-debt-source-control
          path: ${{ runner.temp }}/radar-bdf-debt/
          retention-days: 35
          if-no-files-found: error
      - name: Qualify the six failed Radar sources (read-only)
        run: node scripts/check-radar-source-recovery.mjs "$RUNNER_TEMP/radar-source-recovery"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-publication-policy
          path: ${{ runner.temp }}/radar-publication-policy
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-six-source-recovery
          path: ${{ runner.temp }}/radar-source-recovery/report.json
          retention-days: 35
          if-no-files-found: error
      - name: Qualify public Radar source coverage (read-only)
        run: node scripts/check-radar-coverage.mjs "$RUNNER_TEMP/radar-coverage"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-public-source-qualification
          path: ${{ runner.temp }}/radar-coverage/report.json
          retention-days: 35
          if-no-files-found: ignore
      - name: Qualify priority banks, INSEE and housing (read-only)
        run: node scripts/check-radar-depth.mjs "$RUNNER_TEMP/radar-depth"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-priority-source-qualification
          path: |
            ${{ runner.temp }}/radar-depth/report.json
            ${{ runner.temp }}/radar-depth/trade-republic-entry.html
          retention-days: 35
          if-no-files-found: ignore
      - name: Replay the frozen Radar audit and qualify existing sources (read-only)
        run: |
          node scripts/replay-radar-audit.mjs "$RUNNER_TEMP/radar-audit-replay"
          node scripts/check-radar-audit-fixes.mjs "$RUNNER_TEMP/radar-audit-sources"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-audit-fixes-validation
          path: |
            ${{ runner.temp }}/radar-audit-replay/report.json
            ${{ runner.temp }}/radar-audit-replay/before-after.md
            ${{ runner.temp }}/radar-audit-sources/report.json
          retention-days: 35
          if-no-files-found: ignore
      - name: Check official purchasing-power feeds
        run: node scripts/test-purchasing-power-news.mjs --live
      - name: Verify live DWS portfolios independently
        run: |
          python scripts/verify_dws_compositions.py --check > "$RUNNER_TEMP/dws-verification.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dws-composition-verification
          path: ${{ runner.temp }}/dws-verification.json
          retention-days: 35
          if-no-files-found: ignore
      - run: node scripts/update-editorial-radar.mjs --output "$RUNNER_TEMP/editorial-radar"
  update:
    concurrency:
      group: editorial-radar-production
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      issues: write
    outputs:
      failed: ${{ steps.partial.outputs.failed }}
    steps:
      # Execute only trusted master code, never code from a triggering PR.
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      # Reuse the existing X text counter for qualified Grok suggestions.
      - run: npm ci --omit=dev --ignore-scripts
      - run: python -m unittest discover -s scripts -p 'test_dws_reconciliation.py'
      - run: node scripts/test-dws-reconciliation.mjs
      - run: node scripts/test-editorial-radar.mjs
      - run: node scripts/test-radar-state-codec.mjs
      - run: node scripts/test-radar-editorial.mjs
      - run: node scripts/test-radar-publications.mjs
      - run: node scripts/test-radar-extensions.mjs
      - run: node scripts/test-radar-consumer.mjs
      - run: node scripts/test-radar-coverage.mjs
      - run: node scripts/test-radar-depth.mjs
      - run: node scripts/test-radar-audit-fixes.mjs
      - run: node scripts/test-radar-source-recovery.mjs
      - run: node scripts/test-radar-notifications.mjs
      - run: node scripts/test-radar-publication-policy.mjs "$RUNNER_TEMP/radar-publication-policy"
      - run: node scripts/test-purchasing-power-news.mjs
      # HTML and PDF official announcements; no retail availability inferred.
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Publish comparable observations and new signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RADAR_SOURCE_SHA=$(git rev-parse HEAD)
          node scripts/publish-editorial-radar.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: editorial-radar-observations
          path: |
            ${{ runner.temp }}/editorial-radar/feed.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
          if-no-files-found: ignore
      - name: Detect partial failures
        id: partial
        if: always()
        run: python scripts/report_partial_failures.py "$RUNNER_TEMP/editorial-radar/feed.json"
  report-failures:
    needs: [update]
    if: always() && needs.update.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Radar partiel : une famille de sources locales est illisible ; ses signaux précédents sont conservés. Voir editorial-radar-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
