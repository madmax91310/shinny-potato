name: Finish superseded data review validations
on:
  pull_request:
    paths:
      - '.github/workflows/finish-data-review-validations.yml'
permissions:
  contents: read
  actions: write
jobs:
  finish-superseded:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/data-review-complete-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only obsolete validation runs of this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          ids = [39993469168,39993469202,39993468937,39993469088,39993469092,39993469052,39993468925,39993469124,39993469157,39993468966,39993469048,39993469020,39993469192,39993469114,39993469082,39993469075,39996039075,39996039029,39996039289,39996039117,39996039141,39996039121,39996039390,39996039157,39996039088,39996039118,39996039116,39996039202,39996039011,39996039012,39996039165,39996039179,39997262879,39997262953,39997262764,39997262793,39997262703,39997262668,39997262615,39997262559,39997262514,39997262717,39997262600,39997262675,39997262647,39997262705,39997262695,39997262684]
          obsolete = {'21f1a109404d7495965d1acb0fa81fc40065fa98','d35a0112f12cc5b7aa48ad2c25a1b8cef56e55ff','973312ff96c666ae242e1b507f7e8c281d606369'}
          base = 'https://api.github.com/repos/madmax91310/shinny-potato/actions/runs/'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for run_id in ids:
              req=urllib.request.Request(base+str(run_id),headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:r=json.load(response)
              if r['status']=='completed':continue
              if r['head_branch']!='fix/data-review-complete-20261023' or r['head_sha'] not in obsolete or r['event']!='pull_request':
                  raise SystemExit('Unexpected run identity: '+str(run_id))
              req=urllib.request.Request(base+str(run_id)+'/cancel',headers=headers,method='POST',data=b'')
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:print(json.dumps({'runId':run_id,'supersededSha':r['head_sha'],'cancelStatus':response.status}))
              except urllib.error.HTTPError as error:
                  if error.code!=409:raise
                  print(json.dumps({'runId':run_id,'alreadyFinished':True}))
          PY
