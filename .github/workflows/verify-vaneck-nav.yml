name: Qualify existing VanEck NAV routes
on:
  workflow_dispatch:
  push:
    branches: [fix/vaneck-nav-remainder-20261023, probe/vaneck-calendar-format-20261023]
    paths:
      - 'scripts/collect_official_share_history.py'
      - 'scripts/collect_vaneck_etf.py'
      - 'scripts/refresh_monthly_history.py'
      - 'scripts/official-nav-remainder-sources.json'
      - 'scripts/test_vaneck_nav_routes.py'
      - '.github/workflows/verify-vaneck-nav.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s scripts -p 'test_vaneck_nav_routes.py'
      - name: Qualify exact shares through the normal monthly producer
        run: |
          node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/baseline.json"
          python scripts/refresh_monthly_history.py --baseline "$RUNNER_TEMP/baseline.json" --only $(python -c 'import json; print(" ".join(r["id"] for r in json.load(open("scripts/monthly-automation.json"))["series"] if r.get("navCalendarSource")=="page-api"))') --output "$RUNNER_TEMP/monthly-observation.json" --evidence-output "$RUNNER_TEMP/nav.json" --apply
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: vaneck-exact-share-nav
          path: |
            ${{ runner.temp }}/nav.json
            ${{ runner.temp }}/monthly-observation.json
          retention-days: 35
