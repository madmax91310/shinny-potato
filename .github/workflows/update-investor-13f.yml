name: Update investor 13F portfolios
on:
  schedule:
    - cron: '25 12 * * *'
  pull_request:
    paths:
      - 'scripts/update-investor-13f.py'
      - 'scripts/test_investor_refresh.py'
      - 'scripts/refresh-investor-media.py'
      - 'scripts/validate-investor-publication.py'
      - 'scripts/observation_rebase_guard.py'
      - 'scripts/producer_report_contract.py'
      - 'scripts/producer_report_plans.py'
      - 'scripts/audit-investor-profiles.mjs'
      - 'src/pages/investor-portfolio/data.js'
      - '.github/workflows/update-investor-13f.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  deployments: read
  id-token: write
concurrency:
  # Read-only PR validations must not occupy the scheduled writer queue.
  group: ${{ github.event_name == 'pull_request' && format('investor-13f-validation-{0}', github.event.pull_request.number) || 'investor-13f-refresh' }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      # Fetch and validate all registered live portfolios in the disposable PR workspace.
      # No commit or deployment is possible from this read-only job.
      # Source failures remain explicit; the independent validator must certify
      # each successful acquisition and byte-for-byte retention of failed ones.
      - name: "Collect observations: python -u scripts update-investor-13f.py --output RUNNER_TEMP investor-observations.json"
        continue-on-error: true
        env:
          INVESTOR_HTTP_CACHE: .cache/investor-http
        run: python -u scripts/update-investor-13f.py --output "$RUNNER_TEMP/investor-observations.json"
      - name: Validate collected 13F observations and consumers
        run: python -u scripts/validate-investor-publication.py validate --report "$RUNNER_TEMP/investor-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-observations
          path: |
            ${{ runner.temp }}/investor-observations.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
  update:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      - uses: actions/cache@v4
        with:
          path: .cache/investor-http
          key: investor-http-${{ github.run_id }}
          restore-keys: investor-http-
      # A failed manager keeps its last validated filing; the others are recorded and published.
      - name: "Collect observations: python -u scripts update-investor-13f.py --output  RUNNER_TEMP investor-observations.json"
        id: collect
        continue-on-error: true
        env:
          INVESTOR_HTTP_CACHE: .cache/investor-http
        run: python -u scripts/update-investor-13f.py --output "$RUNNER_TEMP/investor-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-observations
          path: |
            ${{ runner.temp }}/investor-observations.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: investor-cutout-u2netp-v1
      - name: Prepare licensed portrait cutouts (fallback initials on failure)
        continue-on-error: true
        run: |
          python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
          python -m pip install -c scripts/python-constraints.txt 'rembg[cpu]==2.0.69' pillow
          python scripts/refresh-investor-media.py
      - name: Validate collected observations
        run: python -u scripts/validate-investor-publication.py validate --report "$RUNNER_TEMP/investor-observations.json"
      - name: Commit validated observations
        id: commit
        env:
          VALIDATED_DATA_CHECK: python -u scripts/validate-investor-publication.py check --report "$RUNNER_TEMP/investor-observations.json"
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Update SEC 13F portfolios and preserve prior quarters' public/data/investors
  # GITHUB_TOKEN pushes do not trigger the usual push workflow. Explicitly reuse
  # the same checked build and Pages deployment for the newly committed snapshot.
  deploy:
    needs: update
    # Also retry deployment on unchanged data after a previous deployment failure.
    if: needs.update.result == 'success'
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
      producer: update-investor-13f.yml

  report-failures:
    needs: [update, deploy]
    if: always() && needs.update.outputs.collection_failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte 13F partielle : les investisseurs en échec gardent leur dernier relevé validé ; les autres ont été enregistrés. Voir investor-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
