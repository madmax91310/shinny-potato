name: Update investor 13F portfolios
on:
  schedule:
    - cron: '25 12 * * *'
  pull_request:
    paths:
      - 'scripts/update-investor-13f.py'
      - 'scripts/test_investor_refresh.py'
      - 'scripts/audit-investor-profiles.mjs'
      - 'src/pages/investor-portfolio/data.js'
      - '.github/workflows/update-investor-13f.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  deployments: read
  id-token: write
concurrency:
  group: investor-13f-refresh
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      # Fetch and validate all registered live portfolios in the disposable PR workspace.
      # No commit or deployment is possible from this read-only job.
      - name: "Collect observations: python -u scripts update-investor-13f.py --output RUNNER_TEMP investor-observations.json"
        run: python -u scripts/update-investor-13f.py --output "$RUNNER_TEMP/investor-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-observations
          path: ${{ runner.temp }}/investor-observations.json
          retention-days: 35
  update:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      # A failed manager keeps its last validated filing; the others are recorded and published.
      - name: "Collect observations: python -u scripts update-investor-13f.py --output  RUNNER_TEMP investor-observations.json"
        id: collect
        continue-on-error: true
        run: python -u scripts/update-investor-13f.py --output "$RUNNER_TEMP/investor-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-observations
          path: ${{ runner.temp }}/investor-observations.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Update SEC 13F portfolios and preserve prior quarters' public/data/investors
  # GITHUB_TOKEN pushes do not trigger the usual push workflow. Explicitly reuse
  # the same checked build and Pages deployment for the newly committed snapshot.
  deploy:
    needs: update
    # Also retry deployment on unchanged data after a previous deployment failure.
    if: needs.update.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
  report-failures:
    needs: [update, deploy]
    if: always() && needs.update.outputs.collection_failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte 13F partielle : les investisseurs en échec gardent leur dernier relevé validé ; les autres ont été enregistrés. Voir investor-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
