name: Update selected investor 13F data
on:
  schedule:
    - cron: '25 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-investor-13f.py
      - name: Commit changed filings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/investors
          git diff --cached --quiet || { git commit -m 'Update selected SEC 13F portfolios'; git push; }
