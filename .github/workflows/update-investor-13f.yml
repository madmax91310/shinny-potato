name: Update investor 13F portfolios
on:
  schedule:
    - cron: '25 12 * * *'
  pull_request:
    paths:
      - 'scripts/update-investor-13f.py'
      - 'scripts/test_investor_refresh.py'
      - 'scripts/audit-investor-profiles.mjs'
      - 'src/pages/investor-portfolio/data.js'
      - '.github/workflows/update-investor-13f.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: investor-13f-refresh
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      # Fetch and validate all registered live portfolios in the disposable PR workspace.
      # No commit or deployment is possible from this read-only job.
      - run: python -u scripts/update-investor-13f.py --output "$RUNNER_TEMP/investor-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-observations
          path: ${{ runner.temp }}/investor-observations.json
          retention-days: 35
  update:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      - run: python -u scripts/update-investor-13f.py --output "$RUNNER_TEMP/investor-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-observations
          path: ${{ runner.temp }}/investor-observations.json
          retention-days: 35
      - name: Commit changed filings
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/investors
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Update SEC 13F portfolios and preserve prior quarters'
            git pull --rebase origin master
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # GITHUB_TOKEN pushes do not trigger the usual push workflow. Explicitly reuse
  # the same checked build and Pages deployment for the newly committed snapshot.
  deploy:
    needs: update
    # Also retry deployment on unchanged data after a previous deployment failure.
    if: needs.update.result == 'success'
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
