name: Update World Bank monthly gold data

on:
  schedule:
    # Retry after the second business day, accounting for weekends/publication lag.
    - cron: '15 7 3-10 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-gold-monthly.yml'
      - 'scripts/update_gold_monthly.py'
      - 'scripts/test_gold_monthly.py'
      - 'scripts/requirements-gold.txt'
      - 'src/data/worldbank-gold-monthly.json'

permissions:
  contents: read

concurrency:
  group: gold-refresh-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-gold.txt
      - run: python -m unittest discover -s scripts -p 'test_gold_monthly.py'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - name: Collect official monthly workbook
        run: python scripts/update_gold_monthly.py
      - name: Validate gold observations
        run: |
          node scripts/audit-calculator-series.mjs
          node scripts/test-gold-consumers.mjs
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VALIDATED_DATA_CHECK='node scripts/audit-calculator-series.mjs' \
          bash scripts/commit-validated-data.sh 'Update World Bank monthly gold history' src/data/worldbank-gold-monthly.json
      - name: Collection summary
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const d = JSON.parse(fs.readFileSync('src/data/worldbank-gold-monthly.json')); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Or : ' + d.points.length + ' mois, jusqu’à ' + d.points.at(-1)[0] + '. Source Banque mondiale, CC BY 4.0.\n');"
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.update.outputs.commit_sha }}
      producer: update-gold-monthly.yml
