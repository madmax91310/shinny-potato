name: Check scanner holdings freshness
on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scanner-holdings-health.yml'
      - 'scripts/scanner_holdings.py'
      - 'scripts/refresh_scanner_holdings.py'
      - 'scripts/scanner-holdings.json'
      - 'scripts/test_scanner_holdings.py'
      - 'public/data/scanner-holdings/**'
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_scanner_holdings.py'
      - name: Recompute freshness and verify snapshot integrity
        run: python scripts/refresh_scanner_holdings.py --audit
