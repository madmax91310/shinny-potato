name: Validate complete automation delivery
on:
  push:
    branches: [feat/complete-data-automation]
    paths: ['.github/workflows/qualify-automation-sources.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/complete-data-automation
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0 xlrd==2.0.2
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: node scripts/build-automation-targets.mjs
      - run: python -m unittest discover -s scripts -p 'test*dws*py'
      - run: python -m unittest discover -s scripts -p 'test_hsbc_jpm_holdings.py'
      - run: python -m unittest discover -s scripts -p 'test_automation_recovery.py'
      - run: python -m unittest discover -s scripts -p 'test_pending_sources.py'
      - name: Collect and qualify all complete portfolios
        run: python scripts/collect_dca_complete_holdings.py --apply --output test-artifacts/automation-delivery/holdings-live.json
      - run: node scripts/data-automation-inventory.mjs --write && python scripts/check_pending_sources.py
      - run: npm run build
      - run: npm run test:dca && node scripts/test-data-automation-inventory.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-live-data-connections.mjs
      - run: node scripts/playwright-live-data-connections.mjs --physical
      - run: node scripts/playwright-live-data-connections.mjs --new-issuers
      - run: node scripts/playwright-data-automation-inventory.mjs
      - name: Record validated observations on delivery branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/pending-source-checks.json scripts/generated-holdings-sources.json scripts/instrument-metadata-sources.json src/data/dca-complete-holdings.json src/data/dca-holdings-status.json src/data/dca-security-classifications.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record validated full portfolios and pending-source access evidence'
            git push origin HEAD:feat/complete-data-automation
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: automation-delivery-validation
          path: |
            test-artifacts/automation-delivery
            test-artifacts/live-data-connections
            test-artifacts/data-automation-inventory
            public/data/data-automation-summary.json
            public/data/pending-source-checks.json
          retention-days: 14
