name: Update qualified exposure ETF data
on:
  schedule:
    - cron: '50 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/collect_dca_complete_holdings.py'
      - 'scripts/build-automation-targets.mjs'
      - 'scripts/dca-complete-holdings-sources.json'
      - '.github/workflows/update-qualified-exposures.yml'
  pull_request:
    paths:
      - 'scripts/collect_qualified_exposures.py'
      - 'scripts/qualified-exposure-sources.json'
      - 'scripts/collect_dca_equities.py'
      - 'scripts/collect_exposure_sleeves.py'
      - 'scripts/collect_vanguard_sleeves.py'
      - 'scripts/derive-exposure-sleeves.mjs'
      - 'scripts/dca-equity-identities.json'
      - 'scripts/collect_dca_complete_holdings.py'
      - 'scripts/collect_dws_etf.py'
      - 'scripts/collect_ssga_etf.py'
      - 'scripts/test_dca_dws_complete.py'
      - 'scripts/test_dca_localized_complete.py'
      - 'scripts/validate_holdings_refresh.py'
      - 'scripts/test_dca_refresh_gate.py'
      - 'scripts/playwright-live-data-connections.mjs'
      - 'scripts/build-automation-targets.mjs'
      - 'scripts/dca-complete-holdings-sources.json'
      - 'scripts/dca-equity-extra-identities.json'
      - 'src/data/qualified-exposure*'
      - '.github/workflows/update-qualified-exposures.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' || steps.equities.outcome == 'failure' || steps.holdings.outcome == 'failure' || steps.sleeves.outcome == 'failure' || steps.underliers.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_qualified_exposures.py --apply --output "$RUNNER_TEMP/qualified-exposures.json"
      - name: "Collect observations: equities"
        id: equities
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_dca_equities.py --apply --output "$RUNNER_TEMP/dca-equities.json"
      - run: node scripts/build-automation-targets.mjs
      - run: cp src/data/dca-holdings-status.json "$RUNNER_TEMP/previous-holdings-status.json"
      - name: "Collect observations: holdings"
        id: holdings
        continue-on-error: true
        run: python scripts/collect_dca_complete_holdings.py --apply --output "$RUNNER_TEMP/dca-complete-holdings.json"
      - name: Reject new complete-holdings failures in a PR
        if: github.event_name == 'pull_request'
        run: python scripts/validate_holdings_refresh.py "$RUNNER_TEMP/dca-complete-holdings.json" "$RUNNER_TEMP/previous-holdings-status.json"
      - name: "Collect observations: sleeves"
        id: sleeves
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_exposure_sleeves.py --apply --output "$RUNNER_TEMP/exposure-sleeves.json"
      - name: "Collect observations: underliers"
        id: underliers
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_vanguard_sleeves.py --apply --output "$RUNNER_TEMP/vanguard-sleeves.json"
      - run: python -m unittest discover -s scripts -p "test_exposure_sleeves.py"
      - name: Validate complete DWS parser
        run: python -m unittest discover -s scripts -p "test_dca*py"
      - name: Validate DCA observations
        run: node scripts/build-dca-exposures.mjs && npm run test:dca
      - name: "Validate observations: node scripts test-qualified-exposures.mjs"
        run: node scripts/test-qualified-exposures.mjs
      - name: "Validate observations: npm run audit:instrument-catalog"
        run: npm run audit:instrument-catalog
      - name: "Validate observations: npm run build"
        run: npm run build
      - name: Verify complete portfolios in the browser
        run: |
          npx playwright install --with-deps chromium
          node scripts/playwright-live-data-connections.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: qualified-exposures-observation
          path: |
            test-artifacts/live-data-connections
            ${{ runner.temp }}/qualified-exposures.json
            ${{ runner.temp }}/dca-equities.json
            ${{ runner.temp }}/dca-complete-holdings.json
            ${{ runner.temp }}/exposure-sleeves.json
            ${{ runner.temp }}/vanguard-sleeves.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh qualified exact-share exposure data' scripts/generated-holdings-sources.json scripts/instrument-metadata-sources.json src/data/qualified-listing-records.json src/data/exposure-sleeves.json src/data/vanguard-equity-underliers.json docs/exposure-coverage.json docs/exposure-coverage.md src/data/qualified-exposure-etfs.json src/data/automated-etf.json src/data/dca-equity-exposures.json src/pages/dca-profiles/exposures.json src/pages/dca-profiles/exposures-extra-0.json src/pages/dca-profiles/exposures-extra-1.json src/pages/dca-profiles/exposures-extra-2.json src/pages/dca-profiles/catalog.json src/pages/dca-profiles/holdings*.json src/data/dca-complete-holdings.json src/data/dca-security-classifications.json src/data/dca-holdings-status.json
  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Collecte partielle : dernières valeurs fiables conservées ; données validées publiées si les contrôles réussissent.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
