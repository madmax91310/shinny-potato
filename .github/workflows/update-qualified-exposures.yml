name: Update qualified exposure ETF data
on:
  schedule:
    - cron: '50 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/native_source_evidence.py'
      - 'scripts/test_native_source_evidence.py'
      - 'scripts/test_security_residual_identities.py'
      - 'scripts/test_wisdomtree_identity_isolation.py'
      - 'scripts/fixtures/security-residual-identities.json.gz'
      - 'scripts/holdings_reconciliation.py'
      - 'scripts/test_dca_nav_reconciliation.py'
      - 'scripts/native-index-source-candidates.json'
      - 'scripts/lib/native-index-source-candidates.mjs'
      - 'scripts/collect_dca_complete_holdings.py'
      - 'scripts/collect_physical_holdings.py'
      - 'scripts/collect_wisdomtree_holdings.py'
      - 'scripts/wisdomtree_api_holdings.py'
      - 'scripts/wisdomtree_identity_cache.py'
      - 'scripts/wisdomtree-holdings-classes.json'
      - 'scripts/test_wisdomtree_complete_api.py'
      - 'scripts/fixtures/wisdomtree-complete/precise-qualified-books.json.gz'
      - 'scripts/test_wisdomtree_public_rankings.py'
      - 'scripts/test_dca_holdings_retention.py'
      - 'scripts/capture-wisdomtree-api.mjs'
      - 'scripts/test_wisdomtree_api_holdings.py'
      - 'scripts/discover_holdings_sources.py'
      - 'scripts/discover_lg_holdings.py'
      - 'scripts/test_lg_discovery.py'
      - 'scripts/security_identifier_observations.py'
      - 'scripts/test_security_candidate_names.py'
      - 'scripts/security-identity-sources.json'
      - 'scripts/security-identifier-candidates.json'
      - 'scripts/test_wisdomtree_discovery.py'
      - 'src/data/native-index-composition-contracts.json'
      - 'src/data/native-index-composition.js'
      - 'scripts/test-native-index-compositions.mjs'
      - 'scripts/collect_topix_holdings.py'
      - 'scripts/test_topix_holdings.py'
      - 'scripts/dws_liquidity_funds.py'
      - 'scripts/hsbc_holdings.py'
      - 'scripts/jpm_holdings.py'
      - 'scripts/check_pending_sources.py'
      - 'scripts/lifestrategy_holdings.py'
      - 'scripts/test_lifestrategy_holdings.py'
      - 'scripts/test_physical_holdings.py'
      - 'scripts/build-automation-targets.mjs'
      - 'scripts/dca-complete-holdings-sources.json'
      - '.github/workflows/update-qualified-exposures.yml'
  pull_request:
    paths:
      - 'scripts/native_source_evidence.py'
      - 'scripts/test_native_source_evidence.py'
      - 'scripts/collect_qualified_exposures.py'
      - 'scripts/dws_liquidity_funds.py'
      - 'scripts/hsbc_holdings.py'
      - 'scripts/jpm_holdings.py'
      - 'scripts/check_pending_sources.py'
      - 'scripts/qualified-exposure-sources.json'
      - 'scripts/collect_dca_equities.py'
      - 'scripts/collect_exposure_sleeves.py'
      - 'scripts/collect_vanguard_sleeves.py'
      - 'scripts/derive-exposure-sleeves.mjs'
      - 'scripts/dca-equity-identities.json'
      - 'scripts/test_security_residual_identities.py'
      - 'scripts/test_wisdomtree_identity_isolation.py'
      - 'scripts/fixtures/security-residual-identities.json.gz'
      - 'scripts/holdings_reconciliation.py'
      - 'scripts/test_dca_nav_reconciliation.py'
      - 'scripts/native-index-source-candidates.json'
      - 'scripts/lib/native-index-source-candidates.mjs'
      - 'scripts/collect_dca_complete_holdings.py'
      - 'scripts/collect_physical_holdings.py'
      - 'scripts/collect_wisdomtree_holdings.py'
      - 'scripts/wisdomtree_api_holdings.py'
      - 'scripts/wisdomtree_identity_cache.py'
      - 'scripts/wisdomtree-holdings-classes.json'
      - 'scripts/test_wisdomtree_complete_api.py'
      - 'scripts/fixtures/wisdomtree-complete/precise-qualified-books.json.gz'
      - 'scripts/test_wisdomtree_public_rankings.py'
      - 'scripts/test_dca_holdings_retention.py'
      - 'scripts/capture-wisdomtree-api.mjs'
      - 'scripts/test_wisdomtree_api_holdings.py'
      - 'scripts/discover_holdings_sources.py'
      - 'scripts/discover_lg_holdings.py'
      - 'scripts/test_lg_discovery.py'
      - 'scripts/security_identifier_observations.py'
      - 'scripts/security-identity-sources.json'
      - 'scripts/security-identifier-candidates.json'
      - 'scripts/test_wisdomtree_discovery.py'
      - 'src/data/native-index-composition-contracts.json'
      - 'src/data/native-index-composition.js'
      - 'scripts/test-native-index-compositions.mjs'
      - 'scripts/collect_topix_holdings.py'
      - 'scripts/test_topix_holdings.py'
      - 'scripts/lifestrategy_holdings.py'
      - 'scripts/test_lifestrategy_holdings.py'
      - 'scripts/test_physical_holdings.py'
      - 'scripts/collect_dws_etf.py'
      - 'scripts/collect_ssga_etf.py'
      - 'scripts/test_dca_dws_complete.py'
      - 'scripts/test_dca_localized_complete.py'
      - 'scripts/test_dca_blackrock_recovery.py'
      - 'scripts/playwright-live-data-connections.mjs'
      - 'scripts/build-automation-targets.mjs'
      - 'scripts/dca-complete-holdings-sources.json'
      - 'scripts/dca-equity-extra-identities.json'
      - 'src/data/qualified-exposure*'
      - '.github/workflows/update-qualified-exposures.yml'
permissions:
  contents: read
jobs:
  native-source-runtime-check:
    # Read-only runtime qualification of the SAME producer. This does not
    # publish observations or introduce another financial collection chain.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0 xlrd==2.0.2
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Qualify exact native books through the ordinary shared producer
        env:
          WISDOMTREE_BROWSER_CAPTURE: '1'
        run: python scripts/collect_dca_complete_holdings.py --only IE00BKLF1R75 IE00BZ56SW52 --output "$RUNNER_TEMP/native-runtime-observations.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-source-runtime-observations
          path: ${{ runner.temp }}/native-runtime-observations.json
          retention-days: 35
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' || steps.equities.outcome == 'failure' || steps.holdings.outcome == 'failure' || steps.sleeves.outcome == 'failure' || steps.underliers.outcome == 'failure' || steps.identifiers.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0 xlrd==2.0.2
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_qualified_aum_retention.py'
      - run: node scripts/test-qualified-aum-retention.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install browser for public issuer API fallback
        run: npx playwright install --with-deps chromium
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_qualified_exposures.py --apply --output "$RUNNER_TEMP/qualified-exposures.json"
      - name: "Collect observations: equities"
        id: equities
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_dca_equities.py --apply --output "$RUNNER_TEMP/dca-equities.json"
      - run: node scripts/build-automation-targets.mjs
      - name: Validate staged source qualification
        run: python -m unittest discover -s scripts -p 'test_wisdomtree_discovery.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_regional_routes.py'
      - run: python -m unittest discover -s scripts -p 'test_independent_portfolio_identities.py'
      - run: node scripts/test-issuer-product-routes.mjs
      - run: python -m unittest discover -s scripts -p 'test_security_candidate_names.py' && python -m unittest discover -s scripts -p 'test_security_residual_identities.py' && python -m unittest discover -s scripts -p 'test_wisdomtree_identity_isolation.py'
      - name: Validate public holdings API identities and complete weights
        run: python -m unittest discover -s scripts -p 'test_wisdomtree_api_holdings.py' && python -m unittest discover -s scripts -p 'test_wisdomtree_complete_api.py' && python -m unittest discover -s scripts -p 'test_wisdomtree_public_rankings.py' && python -m unittest discover -s scripts -p 'test_dca_holdings_retention.py'
      - name: Validate exact native-index and dated-identity contracts
        run: python -m unittest discover -s scripts -p 'test_topix_holdings.py' && node scripts/test-native-index-compositions.mjs
      - name: Refresh exact security identifier evidence
        id: identifiers
        continue-on-error: true
        run: python scripts/security_identifier_observations.py
      - run: python -m unittest discover -s scripts -p 'test_lg_discovery.py'
      - name: Discover complete issuer portfolios without replacing qualified values on failure
        run: python scripts/discover_holdings_sources.py
      - name: "Collect observations: holdings"
        id: holdings
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          WISDOMTREE_BROWSER_CAPTURE: '1'
        run: python scripts/collect_dca_complete_holdings.py --apply --output "$RUNNER_TEMP/dca-complete-holdings.json"
      - name: "Collect observations: sleeves"
        id: sleeves
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_exposure_sleeves.py --apply --output "$RUNNER_TEMP/exposure-sleeves.json"
      - name: "Collect observations: underliers"
        id: underliers
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_vanguard_sleeves.py --apply --output "$RUNNER_TEMP/vanguard-sleeves.json"
      - run: python -m unittest discover -s scripts -p "test_exposure_sleeves.py"
      - name: Validate complete DWS parser
        run: python -m unittest discover -s scripts -p "test_dca*py"
      - name: Validate complete physical issuer portfolios
        run: python -m unittest discover -s scripts -p "test_physical_holdings.py" && python -m unittest discover -s scripts -p "test_lifestrategy_holdings.py"
      - run: python -m unittest discover -s scripts -p 'test_dws_liquidity_funds.py' && python -m unittest discover -s scripts -p 'test_hsbc_jpm_holdings.py' && python -m unittest discover -s scripts -p 'test_pending_sources.py' && python -m unittest discover -s scripts -p 'test_native_source_evidence.py'
      - name: Validate DCA observations
        run: node scripts/build-dca-exposures.mjs && npm run test:dca
      - name: "Validate observations: node scripts test-qualified-exposures.mjs"
        run: node scripts/test-qualified-exposures.mjs
      - name: "Validate observations: npm run audit:instrument-catalog"
        run: npm run audit:instrument-catalog
      - name: Check access to remaining unqualified sources
        run: node scripts/data-automation-inventory.mjs --write && python scripts/check_pending_sources.py
      - name: "Validate observations: npm run build"
        run: npm run build
      - name: Verify complete portfolios in the browser
        run: |
          node scripts/playwright-live-data-connections.mjs
          node scripts/playwright-live-data-connections.mjs --physical
          node scripts/playwright-live-data-connections.mjs --new-issuers
          node scripts/playwright-live-data-connections.mjs --wisdomtree
          node scripts/playwright-live-data-connections.mjs --defence
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: qualified-exposures-observation
          path: |
            test-artifacts/live-data-connections
            ${{ runner.temp }}/qualified-exposures.json
            ${{ runner.temp }}/dca-equities.json
            ${{ runner.temp }}/dca-complete-holdings.json
            ${{ runner.temp }}/exposure-sleeves.json
            ${{ runner.temp }}/vanguard-sleeves.json
            public/data/pending-source-checks.json
            public/data/holdings-discovery.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        env:
          VALIDATED_DATA_CHECK: bash scripts/validate-producer-publication.sh holdings
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh qualified exact-share exposure data' public/data/holdings-discovery.json src/data/security-identifier-observations.json public/data/pending-source-checks.json scripts/generated-holdings-sources.json scripts/instrument-metadata-sources.json src/data/qualified-listing-records.json src/data/exposure-sleeves.json src/data/vanguard-equity-underliers.json docs/exposure-coverage.json docs/exposure-coverage.md src/data/qualified-exposure-etfs.json src/data/automated-etf.json src/data/dca-equity-exposures.json src/pages/dca-profiles/exposures.json src/pages/dca-profiles/exposures-extra-0.json src/pages/dca-profiles/exposures-extra-1.json src/pages/dca-profiles/exposures-extra-2.json src/pages/dca-profiles/catalog.json src/pages/dca-profiles/holdings*.json src/data/dca-complete-holdings.json src/data/dca-security-classifications.json src/data/dca-holdings-status.json
  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-qualified-exposures.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Collecte partielle : dernières valeurs fiables conservées ; données validées publiées si les contrôles réussissent.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
