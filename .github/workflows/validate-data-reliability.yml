name: Validate data reliability and physical holdings
on:
  push:
    branches: [feat/data-reliability-physical-holdings]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/probe_extra_sources.py
      - run: node scripts/probe-browser-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-probe
          path: source-probe
          retention-days: 7
