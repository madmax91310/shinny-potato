name: Validate data reliability and physical holdings
on:
  push:
    branches: [feat/data-reliability-physical-holdings]
  pull_request:
    paths:
      - 'scripts/*physical*'
      - 'scripts/*metadata_incidents*'
      - 'scripts/*pages-snapshot*'
      - 'scripts/*bounded-command*'
      - 'scripts/lib/bounded-command.mjs'
      - '.github/workflows/validate-data-reliability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: python -m unittest discover -s scripts -p 'test*metadata*.py'
      - run: python -m unittest discover -s scripts -p 'test_publication_safety.py' && python -m unittest discover -s scripts -p 'test_data_publication.py'
      - run: python -m unittest discover -s scripts -p 'test_audit_workflows.py'
      - run: node scripts/test-pages-snapshot.mjs && node scripts/test-bounded-command.mjs && node scripts/test-data-incidents.mjs && node scripts/test-browser-shards.mjs
      - run: python -m unittest discover -s scripts -p 'test_physical_holdings.py'
      - run: python -m unittest discover -s scripts -p 'test_lifestrategy_holdings.py'
      - run: node scripts/build-automation-targets.mjs
      - name: Qualify complete portfolios against live issuer sources
        env:
          PHYSICAL_SOURCE_PROOF_DIR: test-artifacts/physical-sources
        run: |
          python - <<'PYTHON'
          import json, subprocess
          config=json.load(open('scripts/generated-holdings-sources.json'))
          selected=[k for k,v in config.items() if v.get('parser','').endswith('-complete') or v.get('parser')=='lifestrategy-lookthrough']
          subprocess.run(['python','scripts/collect_dca_complete_holdings.py','--apply','--only',*selected,'--output','test-artifacts/physical-live.json'],check=True)
          PYTHON
      - run: npm ci
      - run: node scripts/build-dca-exposures.mjs && npm run test:dca
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-live-data-connections.mjs --physical
      - name: Save validated source observations on the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/data-reliability-physical-holdings'
        run: |
          git fetch origin feat/data-reliability-physical-holdings
          test "$(git rev-parse origin/feat/data-reliability-physical-holdings)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/dca-complete-holdings.json src/data/dca-holdings-status.json scripts/generated-holdings-sources.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record validated complete physical equity portfolios'
            git push origin HEAD:feat/data-reliability-physical-holdings
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-qualification
          path: |
            test-artifacts
            src/data/dca-complete-holdings.json
            src/data/dca-holdings-status.json
            scripts/generated-holdings-sources.json
          retention-days: 7
