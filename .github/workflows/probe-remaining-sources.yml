name: Qualify remaining official portfolio sources
on:
  push:
    branches: [feat/data-reliability-physical-holdings]
    paths: ['scripts/probe_remaining_sources.py', '.github/workflows/probe-remaining-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - run: python scripts/probe_remaining_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-source-proof
          path: source-probe
          retention-days: 7
