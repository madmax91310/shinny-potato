name: Retire failed pre-correction validation (temporary branch)
on:
  push:
    branches: [ops/retire-failed-pages-validation-20261124]
    paths: [.github/workflows/temporary-retire-failed-pages-validation.yml]
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm successful recording and stop only the failed validation
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions"
          snapshot="$(gh api "${endpoint}/runs/45461116274/jobs?per_page=100")"
          jq -e '[.jobs[] | select(.id == 138683622132 and .conclusion == "success")] | length == 1' <<<"$snapshot"
          jq -e '[.jobs[] | select(.id == 138731348612 and .conclusion == "failure")] | length == 1' <<<"$snapshot"
          state="$(gh api "${endpoint}/runs/45461116274" --jq .status)"
          if [ "$state" != completed ]; then
            gh api -X POST "${endpoint}/runs/45461116274/cancel"
          fi
