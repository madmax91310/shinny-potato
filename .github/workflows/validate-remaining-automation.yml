name: Validate remaining automation changes
on:
  push:
    branches: [feat/finish-remaining-automation]
    paths: ['.github/workflows/validate-remaining-automation.yml', 'scripts/collect_presentation_actors.py', 'scripts/test_presentation_actors.py', 'scripts/test-presentations*', 'src/pages/presentations/Actors.jsx', 'src/data/catalog.js']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/finish-remaining-automation
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pip install beautifulsoup4==4.15.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m unittest discover -s scripts -p test_presentation_actors.py
      - run: python scripts/collect_presentation_actors.py --apply --output actor-observations.json
      - run: node scripts/test-presentations.mjs
      - run: npm run audit:data-catalog
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-presentations-ui.mjs
      - name: Retain validated general platform observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/automated-presentation-actors.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated general platform sheets from official sources'
            git push origin HEAD:feat/finish-remaining-automation
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: platform-validation
          path: |
            actor-observations.json
            src/data/automated-presentation-actors.json
          retention-days: 14
