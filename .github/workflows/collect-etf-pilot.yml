name: Update active ETF issuer data
on:
  schedule:
    - cron: '10 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/data/etf-themes.js'
      - 'scripts/*comparison-automation.mjs'
      - '.github/workflows/collect-etf-pilot.yml'
      - 'scripts/collect_*etf*.py'
      - 'scripts/*vaneck*.py'
      - 'scripts/apply_etf_collection.py'
      - 'scripts/etf_anomalies.py'
      - 'scripts/test_etf_resilience.py'
      - 'scripts/*etf.json'
      - 'scripts/*index*.py'
      - 'scripts/index-automation.json'
      - 'scripts/collect_sp_composition.py'
      - 'scripts/sp_public_feed.py'
      - 'scripts/test_sp_public_feed.py'
      - 'scripts/observations/sp-public-feed.json'
      - 'scripts/test_sp_composition.py'
      - 'scripts/collect_russell_composition.py'
      - 'scripts/test_russell_composition.py'
      - 'scripts/recent-calendar-evidence.json'
      - 'scripts/automation-gap-inventory.mjs'
      - 'scripts/test-automation-gap-inventory.mjs'
      - 'scripts/fixtures/russell-composition/**'
      - 'scripts/fixtures/sp-composition/**'
      - 'scripts/additional-etf-sources.json'
      - 'scripts/issuer_documents.py'
      - 'scripts/issuer_calendar_capture.py'
      - 'scripts/issuer_monthly_capture.py'
      - 'scripts/test_issuer_monthly_capture.py'
      - 'scripts/report-asset-fields.mjs'
      - 'scripts/test_issuer_calendar_capture.py'
      - 'scripts/collect_presentation_etf.py'
      - 'scripts/data_automation.py'
      - 'scripts/test_issuer_reliability.py'
      - 'scripts/collect_document_etf.py'
      - 'scripts/collect_presentation_performance.py'
      - 'scripts/test_presentation_performance.py'
      - 'scripts/fixtures/presentation-performance/**'
      - 'scripts/download-vaneck-document.mjs'
      - 'scripts/*vaneck*.mjs'
      - 'scripts/refresh_additional_etf.py'
      - 'scripts/collect_public_issuer.py'
      - 'scripts/collect_priority_issuer_etf.py'
      - 'scripts/test_priority_issuer_etf.py'
      - 'scripts/collect_tracked_exposure.py'
      - 'scripts/collect_vanguard_holdings.py'
      - 'scripts/test_priority_etf_completion.py'
      - 'scripts/*wisdomtree*.py'
      - 'scripts/collect_lg_api.py'
      - 'scripts/collect_remaining_documents.py'
      - 'scripts/collect_coinshares_aum.py'
      - 'scripts/collect_product_calendars.py'
      - 'scripts/test_product_calendars.py'
      - 'scripts/collect_commodity_allocations.py'
      - 'scripts/test_commodity_allocations.py'
      - 'scripts/collect_annual_fx.py'
      - 'scripts/collect_performance_currency.py'
      - 'src/data/official-performance-currencies.json'
      - 'scripts/test_remaining_aum.py'
      - 'scripts/test-annual-rollover.mjs'
      - 'src/data/annual-*'
      - 'scripts/test_new_issuer_sources.py'
  pull_request:
    paths:
      - 'src/data/etf-themes.js'
      - 'scripts/*comparison-automation.mjs'
      - '.github/workflows/collect-etf-pilot.yml'
      - 'scripts/audit-data-review.mjs'
      - 'scripts/lib/data-review-observation.mjs'
      - 'scripts/test-data-review-observation.mjs'
      - 'scripts/*etf*'
      - 'scripts/*vaneck*.py'
      - 'scripts/*amundi*'
      - 'scripts/test_issuer_refresh.py'
      - 'scripts/*index*.py'
      - 'scripts/index-automation.json'
      - 'scripts/collect_sp_composition.py'
      - 'scripts/sp_public_feed.py'
      - 'scripts/test_sp_public_feed.py'
      - 'scripts/observations/sp-public-feed.json'
      - 'scripts/test_sp_composition.py'
      - 'scripts/collect_russell_composition.py'
      - 'scripts/test_russell_composition.py'
      - 'scripts/recent-calendar-evidence.json'
      - 'scripts/automation-gap-inventory.mjs'
      - 'scripts/test-automation-gap-inventory.mjs'
      - 'scripts/fixtures/russell-composition/**'
      - 'scripts/fixtures/sp-composition/**'
      - 'scripts/additional-etf-sources.json'
      - 'scripts/issuer_documents.py'
      - 'scripts/issuer_calendar_capture.py'
      - 'scripts/issuer_monthly_capture.py'
      - 'scripts/test_issuer_monthly_capture.py'
      - 'scripts/report-asset-fields.mjs'
      - 'scripts/test_issuer_calendar_capture.py'
      - 'scripts/collect_presentation_etf.py'
      - 'scripts/data_automation.py'
      - 'scripts/test_issuer_reliability.py'
      - 'scripts/download-vaneck-document.mjs'
      - 'scripts/*vaneck*.mjs'
      - 'scripts/test_source_documents.py'
      - 'scripts/test_document_etf.py'
      - 'scripts/collect_document_etf.py'
      - 'scripts/collect_presentation_performance.py'
      - 'scripts/test_presentation_performance.py'
      - 'scripts/fixtures/presentation-performance/**'
      - 'scripts/refresh_additional_etf.py'
      - 'scripts/collect_public_issuer.py'
      - 'scripts/collect_priority_issuer_etf.py'
      - 'scripts/test_priority_issuer_etf.py'
      - 'scripts/collect_tracked_exposure.py'
      - 'scripts/collect_vanguard_holdings.py'
      - 'scripts/test_priority_etf_completion.py'
      - 'scripts/*wisdomtree*.py'
      - 'scripts/collect_lg_api.py'
      - 'scripts/collect_remaining_documents.py'
      - 'scripts/collect_coinshares_aum.py'
      - 'scripts/collect_product_calendars.py'
      - 'scripts/test_product_calendars.py'
      - 'scripts/collect_commodity_allocations.py'
      - 'scripts/test_commodity_allocations.py'
      - 'scripts/collect_annual_fx.py'
      - 'scripts/collect_performance_currency.py'
      - 'src/data/official-performance-currencies.json'
      - 'scripts/test_remaining_aum.py'
      - 'scripts/test-annual-rollover.mjs'
      - 'src/data/annual-*'
      - 'scripts/test_new_issuer_sources.py'
      - 'scripts/fixtures/official-documents/**'
      - 'src/data/automated-indices*'
      - 'scripts/update_bitcoin_monthly.py'
      - 'scripts/test_active_refresh.py'
      - 'src/data/automated-etf*'
      - 'src/data/bitcoin-yahoo-monthly.json'
permissions:
  contents: read
jobs:
  refresh:
    concurrency:
      # Serialize writers of automated-indices.json; keep PR validations independent.
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    # Temporary pin: the full 26.04 run is blocked by VanEck document redirects
    # to its US landing page (PR #349). CoinShares calendars now validate.
    # No runner-image incompatibility was identified. Move to 26.04 only after
    # the complete collection, including VanEck, is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.ishares.outcome == 'failure' || steps.amundi.outcome == 'failure' || steps.ssga.outcome == 'failure' || steps.additional.outcome == 'failure' || steps.presentation_performance.outcome == 'failure' || steps.indices.outcome == 'failure' || steps.fx.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Queued runs and old-run retries must collect against current data.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: pip install Pillow==12.3.0
      - run: python -m unittest discover -s scripts -p 'test_russell_composition.py'
      - run: python -m unittest discover -s scripts -p 'test_sp_composition.py'
      - run: python -m unittest discover -s scripts -p 'test_sp_public_feed.py'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: npm ci
      - run: node scripts/test-comparison-automation.mjs
      - run: node scripts/test-vaneck-document.mjs
      - run: python -m unittest discover -s scripts -p 'test_source_documents.py'
      - run: python -m unittest discover -s scripts -p 'test_bnp_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_etf_field_completion.py'
      - run: python -m unittest discover -s scripts -p 'test_priority_etf_completion.py'
      - run: python -m unittest discover -s scripts -p 'test_document_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_new_issuer_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_priority_issuer_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_calendar_capture.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_monthly_capture.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_performance.py'
      - run: node scripts/test-presentation-etf.mjs
      - run: python -m unittest discover -s scripts -p 'test_product_calendars.py'
      - run: python -m unittest discover -s scripts -p 'test_commodity_allocations.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_reliability.py'
      - run: python -m unittest discover -s scripts -p 'test_four_issuer_recovery.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_allocations.py'
      - run: python -m unittest discover -s scripts -p 'test_remaining_index_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_index_extensions.py'
      - run: python -m unittest discover -s scripts -p 'test_index_composition_gate.py'
      - run: python -m unittest discover -s scripts -p 'test_remaining_aum.py'
      - run: node scripts/test-annual-rollover.mjs
      - run: python -m unittest discover -s scripts -p 'test_active_refresh.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_refresh.py'
      - run: python -m unittest discover -s scripts -p 'test_etf_resilience.py'
      - run: python -m unittest discover -s scripts -p 'test_data_refresh.py'
      - run: node scripts/export-etf-pilot-baseline.mjs > "$RUNNER_TEMP/baseline.json"
      - run: node scripts/audit-comparison-automation.mjs
      - name: "Collect observations: ishares"
        id: ishares
        continue-on-error: true
        run: python scripts/collect_etf_pilot.py --baseline "$RUNNER_TEMP/baseline.json" --output "$RUNNER_TEMP/observation.json" --apply
      - name: "Collect observations: amundi"
        id: amundi
        continue-on-error: true
        run: python scripts/collect_amundi_etf.py --baseline "$RUNNER_TEMP/baseline.json" --output "$RUNNER_TEMP/amundi-observation.json" --apply
      - name: "Collect observations: ssga"
        id: ssga
        continue-on-error: true
        run: python scripts/collect_ssga_etf.py --baseline "$RUNNER_TEMP/baseline.json" --output "$RUNNER_TEMP/ssga-observation.json" --apply
      - name: "Collect observations: additional"
        id: additional
        continue-on-error: true
        run: python scripts/refresh_additional_etf.py --baseline "$RUNNER_TEMP/baseline.json" --output "$RUNNER_TEMP/additional-observation.json" --apply
      - name: "Collect observations: presentation_performance"
        id: presentation_performance
        continue-on-error: true
        run: python scripts/collect_presentation_performance.py --output "$RUNNER_TEMP/presentation-performance.json" --apply
      - name: "Collect observations: fx"
        id: fx
        continue-on-error: true
        run: |
          python scripts/collect_annual_fx.py --apply
          python scripts/collect_performance_currency.py --apply
      - name: "Collect observations: indices"
        id: indices
        continue-on-error: true
        run: python scripts/refresh_index_sources.py --output "$RUNNER_TEMP/index-observation.json" --apply
      - run: node scripts/test-asset-field-coverage.mjs
      - run: node scripts/report-automation-coverage.mjs --write
      - name: "Validate observations: node scripts test-automation-gap-inventory.mjs"
        run: node scripts/test-automation-gap-inventory.mjs
      - name: "Validate observations: node scripts test-priority-issuer-consumers.mjs"
        run: node scripts/test-priority-issuer-consumers.mjs
      - name: "Validate observations: npm run audit:data-review"
        run: npm run audit:data-review
      - name: "Validate observations: npm run audit:index-facts"
        run: npm run audit:index-facts
      - name: "Validate observations: npm run audit:index-completeness"
        run: npm run audit:index-completeness
      - name: "Validate observations: node scripts test-automated-indices.mjs"
        run: node scripts/test-automated-indices.mjs
      - name: "Validate observations: node scripts test-automated-index-sheets.mjs"
        run: node scripts/test-automated-index-sheets.mjs
      - name: "Validate observations: npm run audit:etf-annual-performance"
        run: npm run audit:etf-annual-performance
      - name: "Validate observations: npm run audit:etf-completeness"
        run: npm run audit:etf-completeness
      - name: "Validate observations: npm run audit:etf-consistency"
        run: npm run audit:etf-consistency
      - name: "Validate observations: node scripts test-four-issuer-consumers.mjs"
        run: node scripts/test-four-issuer-consumers.mjs
      - name: "Validate observations: npm run audit:calculator-series"
        run: npm run audit:calculator-series
      - name: "Validate observations: node scripts test-comparison-etf-details.mjs"
        run: node scripts/test-comparison-etf-details.mjs
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: active-etf-observation
          path: |
            ${{ runner.temp }}/observation.json
            ${{ runner.temp }}/amundi-observation.json
            ${{ runner.temp }}/ssga-observation.json
            ${{ runner.temp }}/additional-observation.json
            ${{ runner.temp }}/presentation-performance.json
            ${{ runner.temp }}/index-observation.json
          if-no-files-found: ignore
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh validated active ETF issuer data' src/data/annual-fx.json src/data/official-performance-currencies.json src/data/automated-etf.json src/data/automated-indices.json docs/automation-coverage.md docs/automation-gaps.md docs/automation-gaps.json docs/asset-field-coverage.md public/data/asset-field-coverage.json docs/app-inventory.md
      - name: Preserve data publication receipt
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-publication-receipt
          path: ${{ runner.temp }}/data-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 35
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Une source ETF ou indice a échoué. Ses dernières données fiables sont conservées ; les autres collectes validées ont été publiées si les audits et le déploiement ont réussi.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
