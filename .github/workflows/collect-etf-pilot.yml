name: Collect five iShares ETF snapshots and annual returns
on:
  schedule:
    - cron: '10 7 3 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/collect-etf-pilot.yml'
      - 'scripts/collect_etf_pilot.py'
      - 'scripts/etf-pilot.json'
      - 'scripts/data_automation.py'
      - 'scripts/test_data_refresh.py'
      - 'scripts/export-etf-pilot-baseline.mjs'
permissions:
  contents: read
concurrency:
  group: etf-pilot-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m unittest discover -s scripts -p 'test_data_refresh.py'
      - run: node scripts/export-etf-pilot-baseline.mjs > "$RUNNER_TEMP/etf-baseline.json"
      - run: python scripts/collect_etf_pilot.py --baseline "$RUNNER_TEMP/etf-baseline.json" --output "$RUNNER_TEMP/etf-observation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ishares-five-shares-observation
          path: ${{ runner.temp }}/etf-observation.json
          retention-days: 35
          if-no-files-found: error
