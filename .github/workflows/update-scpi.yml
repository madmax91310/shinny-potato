name: Update SCPI presentations
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/observation_rebase_guard.py', 'scripts/validate-producer-publication.sh', 'scripts/test_observation_rebase.py', '.github/workflows/update-scpi.yml', 'scripts/*scpi*', 'scripts/*iroko_snapshot*', 'scripts/*corum*', 'scripts/fixtures/scpi/**', 'scripts/fixtures/scpi-q3-20261030/**', 'scripts/fixtures/corum/**', 'scripts/fixtures/extended-scpi/**', 'scripts/publication_periods.py', 'scripts/test_publication_periods.py', 'scripts/test_presentation_expansion.py', 'scripts/fixtures/presentation-expansion/**', 'src/data/*scpi*', 'src/pages/scpi-presentation/**']
  push:
    branches: [master]
    paths: ['scripts/observation_rebase_guard.py', 'scripts/validate-producer-publication.sh', 'scripts/test_observation_rebase.py', 'scripts/publication_periods.py', 'scripts/test_publication_periods.py', '.github/workflows/update-scpi.yml', 'scripts/collect_scpi.py', 'scripts/test-scpi.mjs', 'scripts/collect_iroko_snapshot.py', 'scripts/collect_corum.py', 'scripts/corum_vector_ocr.py', 'scripts/fixtures/corum/vector-labels.json', 'scripts/corum-quarterly-qualified.json', 'scripts/collect_extended_scpi.py', 'scripts/collect_atland_scpi.py']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: scpi-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: pip install beautifulsoup4==4.15.0 Pillow==12.3.0
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_scpi.py'
      - run: python -m unittest discover -s scripts -p 'test_iroko_snapshot.py'
      - run: python -m unittest discover -s scripts -p 'test_corum.py'
      - run: python -m unittest discover -s scripts -p 'test_corum_vector.py'
      - run: python -m unittest discover -s scripts -p 'test_extended_scpi.py'
      - run: python -m unittest discover -s scripts -p 'test_scpi_current_bulletins.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_publication_periods.py'
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_scpi.py --apply --output "$RUNNER_TEMP/scpi-observation.json"
      - name: "Validate observations: node scripts test-scpi.mjs"
        run: node scripts/test-scpi.mjs
      - name: "Validate observations: npm run audit:data-catalog"
        run: npm run audit:data-catalog
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: scpi-observations
          path: |
            ${{ runner.temp }}/scpi-observation.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          VALIDATED_DATA_CHECK: bash scripts/validate-producer-publication.sh scpi
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh validated official SCPI presentations' src/data/automated-scpi.json
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-scpi.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte SCPI partielle : les dernières fiches validées sont conservées. Voir scpi-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
