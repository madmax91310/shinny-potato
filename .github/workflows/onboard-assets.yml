name: Onboard new assets
# Qualifies newly configured assets with real collections: exact-stock classification from
# official complete holdings, iShares qualified exposures, Yahoo monthly histories and dated
# closes. On master (monthly schedule or manual run) validated observations are recorded
# through the shared isolated commit and published by the full deployment gate; on a work
# branch (manual run) they are committed to that branch. Failures keep the previous data
# and stay listed in the run summary.
on:
  schedule:
    - cron: '35 5 3 * *'
  workflow_dispatch:
    inputs:
      equity_limit:
        description: Maximum number of equity candidates to qualify in this run
        default: '200'
      etf_limit:
        description: Maximum number of ETF listings to qualify in this run
        default: '40'
      qualified_only:
        description: Space-separated ids of qualified-exposure-sources.json to collect (empty = every configured share without a record)
        default: ''
      push:
        description: Record validated observations (master through the isolated commit, a work branch directly)
        default: 'true'
permissions:
  contents: read
env:
  VALIDATED_PATHS: src/data src/pages/dca-profiles scripts/source-snapshots scripts/monthly-automation.json scripts/global-equity-candidates.json scripts/generated-holdings-sources.json scripts/instrument-metadata-sources.json docs public/data
jobs:
  onboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: onboard-assets-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.qualified.outcome == 'failure' || steps.classify.outcome == 'failure' || steps.equities.outcome == 'failure' || steps.etfs.outcome == 'failure' }}
    env:
      EQUITY_LIMIT: ${{ inputs.equity_limit || '200' }}
      ETF_LIMIT: ${{ inputs.etf_limit || '40' }}
      PUSH: ${{ inputs.push || 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: pip install beautifulsoup4==4.15.0
      - name: Producer result contract v1
        run: python -m unittest discover -s scripts -p 'test_producer_report_contract.py'
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_monthly_qualification.py'
      - name: "Collect observations: qualified"
        id: qualified
        continue-on-error: true
        env:
          QUALIFIED_ONLY: ${{ inputs.qualified_only }}
        run: |
          if [ -z "$QUALIFIED_ONLY" ]; then
            QUALIFIED_ONLY=$(node -e "const c=require('./scripts/qualified-exposure-sources.json').instruments,r=require('./src/data/qualified-exposure-etfs.json');console.log(c.filter(i=>!r[i.id]).map(i=>i.id).join(' '))")
          fi
          if [ -z "$QUALIFIED_ONLY" ]; then python scripts/emit_empty_producer_report.py --producer collect_qualified_exposures --output "$RUNNER_TEMP/qualified-exposures.json" --reason 'Every configured qualified share already has a record; no source collection requested'; exit 0; fi
          echo "Collecting: $QUALIFIED_ONLY"
          # shellcheck disable=SC2086
          python scripts/collect_qualified_exposures.py --apply --output "$RUNNER_TEMP/qualified-exposures.json" --only $QUALIFIED_ONLY
      - run: node scripts/build-automation-targets.mjs
      - name: "Collect observations: classify"
        id: classify
        continue-on-error: true
        # The four classification funds plus every newly generated physical-fund source
        # that has no complete composition yet (new qualified shares).
        run: |
          MISSING=$(node -e "const s={...require('./scripts/dca-complete-holdings-sources.json'),...require('./scripts/generated-holdings-sources.json')},h=require('./src/data/dca-complete-holdings.json');console.log(Object.keys(s).filter(i=>!h[i]).join(' '))")
          # shellcheck disable=SC2086
          python scripts/collect_dca_complete_holdings.py --apply --output "$RUNNER_TEMP/dca-complete-holdings.json" --only IE00B4L5Y983 IE00BKM4GZ66 IE00B5BMR087 IE00BF4RFH31 $MISSING
      - run: node scripts/build-dca-exposures.mjs
      - name: "Collect observations: equities"
        id: equities
        continue-on-error: true
        run: |
          node scripts/export-equity-candidates.mjs > "$RUNNER_TEMP/equity-candidates.json" 2> "$RUNNER_TEMP/equity-skipped.json" || true
          python scripts/qualify_monthly_candidates.py --candidates "$RUNNER_TEMP/equity-candidates.json" --limit "$EQUITY_LIMIT" --apply --output "$RUNNER_TEMP/equity-qualification.json"
      - name: "Collect observations: etfs"
        id: etfs
        continue-on-error: true
        run: |
          node scripts/export-monthly-candidates.mjs > "$RUNNER_TEMP/monthly-candidates.json"
          python scripts/qualify_monthly_candidates.py --candidates "$RUNNER_TEMP/monthly-candidates.json" --limit "$ETF_LIMIT" --apply --output "$RUNNER_TEMP/etf-qualification.json"
      - name: Promote qualified curated equities
        run: node scripts/sync-global-equities.mjs
      - name: Rebuild derived registries
        run: node scripts/build-equity-history-links.mjs && node scripts/build-dca-exposures.mjs && node scripts/build-ranking-annual.mjs && node scripts/build-monthly-duel-returns.mjs && node scripts/build-equity-duel-returns.mjs && node scripts/build-performance-links.mjs && node scripts/build-tool-links.mjs
      - name: "Validate observations: audit"
        run: node scripts/audit-automated-monthly.mjs && node scripts/test-monthly-consumers.mjs && node scripts/test-global-equities.mjs
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: onboarding-observation
          path: |
            ${{ runner.temp }}/qualified-exposures.json
            ${{ runner.temp }}/dca-complete-holdings.json
            ${{ runner.temp }}/equity-candidates.json
            ${{ runner.temp }}/equity-skipped.json
            ${{ runner.temp }}/monthly-candidates.json
            ${{ runner.temp }}/equity-qualification.json
            ${{ runner.temp }}/etf-qualification.json
            scripts/source-snapshots/monthly-qualification-status.json
            scripts/global-equity-candidates.json
          if-no-files-found: ignore
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Save validated observations for a work branch
        if: env.PUSH == 'true' && github.ref_name != 'master'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: onboarding-validated-data
          # One path per line: a single space-separated line is read as one path.
          path: |
            src/data
            src/pages/dca-profiles
            scripts/source-snapshots
            scripts/monthly-automation.json
            scripts/global-equity-candidates.json
            scripts/generated-holdings-sources.json
            scripts/instrument-metadata-sources.json
            docs
            public/data
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 3
      - name: Commit validated observations
        id: commit
        if: env.PUSH == 'true' && github.ref_name == 'master'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # shellcheck disable=SC2086
          bash scripts/commit-validated-data.sh 'Onboard validated observations for newly configured assets' $VALIDATED_PATHS
      - name: Report collection outcome
        if: always()
        run: |
          {
            echo "qualified: ${{ steps.qualified.outcome }} | classify: ${{ steps.classify.outcome }} | equities: ${{ steps.equities.outcome }} | etfs: ${{ steps.etfs.outcome }}"
            echo; echo '## Candidates still pending'; node -e "for(const c of require('./scripts/global-equity-candidates.json').candidates)console.log('- '+c.id+' ('+c.isin+'): '+(c.lastAttempt?.error??'not attempted'))"
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: onboard
    if: github.ref_name == 'master' && needs.onboard.outputs.commit_sha != ''
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.onboard.outputs.commit_sha }}
      producer: onboard-assets.yml
  # A manual run on a work branch records the validated observations on that branch; the
  # pull request's own gate then re-checks them with the code.
  publish-branch:
    needs: onboard
    if: github.ref_name != 'master' && (inputs.push || 'true') == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: onboarding-validated-data
          path: .
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # shellcheck disable=SC2086
          git add $VALIDATED_PATHS
          if git diff --cached --quiet; then echo 'No validated observation to commit'; exit 0; fi
          git commit -m 'Collect validated observations for newly configured assets'
          git push origin "HEAD:${{ github.ref_name }}"

  report-failures:
    needs: [onboard, deploy]
    if: always() && needs.onboard.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
