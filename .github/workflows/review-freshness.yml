name: Revue hebdomadaire des données

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminder:
    # Sérialiser lecture + création pour éviter deux rappels d'une même échéance.
    concurrency:
      group: data-review-reminders
      cancel-in-progress: false
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - name: Tester le calendrier et le rappel
        run: |
          npm run audit:data-review
          node scripts/test-data-review-reminder.mjs
      - name: Ouvrir les rappels du calendrier sans bloquer les publications
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/data-review-reminder.mjs --sync
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - name: Préparer le rapport de revue
        run: |
          echo '## Sources et échéances à vérifier' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          node scripts/data-review-reminder.mjs --report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Vérifier les sources et les séries du code
        run: |
          npm run audit:source-inventory
          npm run audit:portfolio-provenance
          npm run audit:data-roadmap
          node scripts/audit-data-roadmap.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Repérer les encours ETF à rapprocher
        run: |
          echo '## Encours ETF enregistrés dans plusieurs outils' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          npm run audit:etf-snapshots >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
