name: Retire superseded task PR 837 validation
on:
  push:
    branches: [ops/retire-merged-lot-validations]
permissions:
  contents: read
# The task's merged or draft PR only. Production groups remain untouched.
concurrency:
  group: pages-code-validation-refs/pull/837/merge
  cancel-in-progress: true
jobs:
  retired:
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "Superseded task PR 837; keep the fully checked master publication."
