name: Publish automation failures
on:
  workflow_run:
    workflows:
      - Update editorial radar
      - Update active ETF issuer data
      - Update exact instrument metadata
      - Update active monthly market histories
      - Update active Bitcoin Yahoo data
      - Update World Bank monthly gold data
      - Update INSEE monthly inflation
      - Update investor 13F portfolios
      - Update insurance presentations
      - Update SCPI presentations
      - Update actor presentations
      - Update publication observations
      - Update official economic data
      - Update official regulatory data
      - Update practical sheet references
      - Update Vanguard LifeStrategy data
      - Update non-bond expansion
      - Update qualified exposure ETF data
      - Refresh 35 portfolio exposure ETFs
      - Refresh fully automated index sheets
      - Onboard new assets
      - Rehearse future data refreshes
      - Revue hebdomadaire des données
      - Deploy to GitHub Pages
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "8,23,38,53 * * * *"
  pull_request:
    paths:
      - ".github/workflows/automation-status.yml"
      - "scripts/publish_automation_status.py"
      - "scripts/automation-report-contracts.json"
      - "scripts/test_automation_product.py"
      - "scripts/automation_status_storage.py"
      - "scripts/automation_status_git.py"
      - "scripts/test_automation_status_storage.py"
      - "scripts/test-monitor-storage.mjs"
      - "src/lib/monitor-storage.js"
      - "public/monitor-storage-capabilities.json"
      - "scripts/fixtures/automation-reports/**"
      - "scripts/test_automation_status.py"
      - "scripts/automation_monitoring.py"
      - "scripts/monitor_notifications.py"
      - "scripts/test_automation_monitoring.py"
      - "scripts/automation_recovery.py"
      - "scripts/github_automation_transport.py"
      - "scripts/test_automation_github_transport.py"
      - "scripts/test_automation_recovery.py"
      - "scripts/build-monitoring-context.mjs"
      - "scripts/test-monitoring-context.mjs"
      - "src/data/automation-workflows.json"
  push:
    branches: [master]
    paths:
      - '.github/workflows/automation-status.yml'
      - 'scripts/publish_automation_status.py'
      - 'scripts/automation_status_storage.py'
      - 'scripts/automation_status_git.py'
      - 'src/lib/monitor-storage.js'
      - 'public/monitor-storage-capabilities.json'
      - 'scripts/automation-report-contracts.json'
      - 'scripts/fixtures/automation-reports/**'
      - 'scripts/automation_monitoring.py'
      - 'scripts/monitor_notifications.py'
      - 'scripts/automation_recovery.py'
      - 'scripts/github_automation_transport.py'
      - 'scripts/build-monitoring-context.mjs'
      - 'src/data/automation-workflows.json'
permissions:
  contents: read
concurrency:
  # PR validation is read-only and must not wait behind production publishers.
  # Keep the production lock identical to protect already running writers.
  group: ${{ github.event_name == 'pull_request' && format('automation-failure-status-pr-{0}', github.event.pull_request.number) || 'automation-failure-status' }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: node scripts/test-monitoring-context.mjs
      - run: node scripts/test-monitor-storage.mjs
      - run: python -m unittest discover -s scripts -p 'test_automation*.py'
      - run: python -m unittest discover -s scripts -p 'test_producer_report_contract.py'
      - run: python -m unittest discover -s scripts -p 'test_source_revision.py'
  publish:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: node scripts/test-monitoring-context.mjs
      - run: node scripts/test-monitor-storage.mjs
      - run: python -m unittest discover -s scripts -p 'test_automation*.py'
      - run: python -m unittest discover -s scripts -p 'test_producer_report_contract.py'
      - run: python -m unittest discover -s scripts -p 'test_source_revision.py'
      - name: Record completed automation
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_automation_status.py --event "$GITHUB_EVENT_PATH"
      - name: Initialise current statuses
        if: github.event_name != 'workflow_run' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_automation_status.py --backfill
      - name: Check silent collectors and data deadlines
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_automation_status.py --monitor-only
      # A changed official clause or contract title becomes a pull request that adds
      # the new wording; merging it is the human validation. Never blocks monitoring.
      - name: Propose validation of changed official wording
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/propose_source_revision.py

