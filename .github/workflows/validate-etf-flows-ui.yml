name: Validate ETF flows editor
on:
  pull_request:
    paths:
      - 'src/pages/etf-flows/**'
      - 'src/lib/etf-flows.js'
      - 'scripts/*etf-flows*'
      - '.github/workflows/validate-etf-flows-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:etf-flows
      - run: npm run generate:app
      - run: npx vite build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-ubuntu26-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: bash scripts/ensure-ci-runtime.sh chromium
      - run: npm run test:etf-flows:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: etf-flows-editor
          path: test-artifacts/etf-flows
          retention-days: 7
