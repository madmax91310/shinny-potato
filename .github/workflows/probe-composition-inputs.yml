name: Diagnose qualified composition inputs
on:
  push:
    branches: [fix/qualified-compositions-20261124]
    paths: [.github/workflows/probe-composition-inputs.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c scripts/python-constraints.txt -r scripts/python-requirements.in
      - run: python -m unittest discover -s scripts -p 'test_lifestrategy*py'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/test-lifestrategy.mjs && node scripts/test-lifestrategy-exact-sleeves.mjs && node scripts/test-dca-holdings-contracts.mjs
      - name: Compare the actual Vanguard observations and retained books
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from copy import deepcopy
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path
          import json
          from collect_lifestrategy import CONFIG, fetch_query, PORTFOLIO_QUERY, collect_exact_portfolio
          from lifestrategy_portfolio import weight, EQUITY_FUNDS, BOND_FUNDS, displayed_allocation, paired_allocation, parse_portfolio
          now = datetime.now(timezone.utc)
          state = json.loads(Path('src/data/lifestrategy.json').read_text())
          def one(config):
              _, code, isin = config
              record = state[isin]
              try:
                  body = fetch_query(PORTFOLIO_QUERY, {'portIds': [str(code)]}, 'LifeStrategyPortfolio')
                  raw = body['data']['borHoldings'][0]['holdings']['items']
                  totals = {tag: Decimal(0) for tag in ('Actions','Obligations','Liquidités')}
                  for row in raw:
                      child = row['isin']
                      key = ('Actions' if child in EQUITY_FUNDS else 'Obligations' if child in BOND_FUNDS else 'Liquidités' if child is None else None)
                      if key is None:
                          raise ValueError(f'Unknown child {child}')
                      totals[key] += weight(row['marketValuePercentage'])
                  old = deepcopy(record)
                  collect_exact_portfolio(body, config, record, old, now)
                  held = old['underlyingHoldings']
                  old_a, _ = paired_allocation(record, held)
                  rebuilt = parse_portfolio(held['sourceResponse'], config, {**record,'assetAllocation':old_a},now)
                  diff = [{k:[a.get(k),b.get(k)] for k in a.keys() | b.keys() if a.get(k) != b.get(k)}
                          for a,b in zip(held['rows'],rebuilt['rows']) if a != b]
                  return {'isin':isin,'raw':body, 'asOf':sorted({r['effectiveDate'] for r in raw}),
                    'allocation':record['assetAllocation'],'actualTotals':{k:str(v) for k,v in totals.items()},
                    'displayRebuilt':{k:str(v) for k,v in displayed_allocation(totals).items()},
                    'retainedRowsDifference':diff, 'qualification':record['underlyingHoldingsQualification']}
              except Exception as e:
                  return {'isin':isin,'error':str(e)}
          with ThreadPoolExecutor(max_workers=4) as pool:
              receipts = list(pool.map(one, CONFIG))
          print(json.dumps([{k:v for k,v in r.items() if k!='raw'} for r in receipts], ensure_ascii=False, indent=2))
          assert all('qualification' in row for row in receipts), 'Expected four actual same-date source checks'
          for name in ('dca-complete-holdings','dca-holdings-status'):
              files = json.loads(Path(f'src/data/{name}.json').read_text())
              for key in ('IE000NDWFGA5', 'IE00BK5BQW10', *(r[2] for r in CONFIG)):
                  row = files.get(key,{})
                  print(name, key, json.dumps({k:v for k,v in row.items() if k in ('asOf','checkedAt','lastSuccessAt','scope','basis','complete','status','sourceUrl','weightBasis','publishedNetWeightPct','unvaluedPositions')}, ensure_ascii=False))
          Path('composition-inputs.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: composition-source-evidence
          path: composition-inputs.json
  alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c scripts/python-constraints.txt -r scripts/python-requirements.in
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Check official document routes and retained handoff
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt, json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib import request
          from collect_sp_composition import collect
          from sp_public_feed import read_response
          from collect_russell_composition import collect_quarterly_holdings
          from issuer_documents import download, pdf_text
          now = dt.datetime.now(dt.timezone.utc)
          configs = json.loads(Path('scripts/index-automation.json').read_text())['indices']
          def response(fn):
              try:
                  value = fn()
                  return {k:(len(v) if isinstance(v,list) else v) for k,v in value.items()
                          if k in ('source','asOf','constituents','membershipCount','rows','countries','sectors','holdings')}
              except Exception as e:
                  return {'error':str(e)}
          for c in configs:
              if c['id'] not in ('sp-global-dividend-aristocrats','sp-euro-dividend-aristocrats'):
                  continue
              primary = {**c,'allowPublicHandoff':False}
              pdf = {k:v for k,v in c.items() if k != 'compositionDataUrl'}
              print(c['id'], 'primary:', response(lambda:collect(primary, now)))
              print(c['id'], 'handoff:', response(lambda:read_response(c, now)))
              print(c['id'], 'official PDF:', response(lambda:collect(pdf, now)))
          config = next(c for c in configs if c['id']=='russell-1000')
          print('Russell quarterly native:', response(lambda:collect_quarterly_holdings(config,now)))
          routes = (
            'https://www.wisdomtree.eu/en-ie/etfs/thematic/wdef---wisdomtree-europe-defence-ucits-etf---eur-acc',
            'https://www.wisdomtree.com/nl/products/equities/wisdomtree-europe-defence-ucits-etf---eur-acc',
            'https://www.lseg.com/en/ftse-russell/index-resources/constituent-weights',
          )
          def check(url):
              try:
                  with request.urlopen(request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'}), timeout=15) as r:
                      body=r.read(2000000)
                      return [url, r.status, r.url,len(body),{'WDEF':b'IE0002Y8CX98' in body,'Russell':b'Russell 1000' in body}]
              except Exception as e:
                  return [url, str(e)]
          with ThreadPoolExecutor(max_workers=3) as pool:
              for item in pool.map(check,routes): print('Official publication route:', item)
          PY
