name: Diagnose qualified composition inputs
on:
  push:
    branches: [fix/qualified-compositions-20261124]
    paths: [.github/workflows/probe-composition-inputs.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c scripts/python-constraints.txt -r scripts/python-requirements.in
      - name: Compare the actual Vanguard observations and retained books
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from copy import deepcopy
          from datetime import datetime, timezone
          from decimal import Decimal
          from pathlib import Path
          import json
          from collect_lifestrategy import CONFIG, fetch_query, PORTFOLIO_QUERY
          from lifestrategy_portfolio import weight, EQUITY_FUNDS, BOND_FUNDS, displayed_allocation, paired_allocation, parse_portfolio
          now = datetime.now(timezone.utc)
          state = json.loads(Path('src/data/lifestrategy.json').read_text())
          def one(config):
              _, code, isin = config
              record = state[isin]
              try:
                  body = fetch_query(PORTFOLIO_QUERY, {'portIds': [str(code)]}, 'LifeStrategyPortfolio')
                  raw = body['data']['borHoldings'][0]['holdings']['items']
                  totals = {tag: Decimal(0) for tag in ('Actions','Obligations','Liquidités')}
                  for row in raw:
                      child = row['isin']
                      key = ('Actions' if child in EQUITY_FUNDS else 'Obligations' if child in BOND_FUNDS else 'Liquidités' if child is None else None)
                      if key is None:
                          raise ValueError(f'Unknown child {child}')
                      totals[key] += weight(row['marketValuePercentage'])
                  held = record['underlyingHoldings']
                  old_a, _ = paired_allocation(record, held)
                  rebuilt = parse_portfolio(held['sourceResponse'], config, {**record,'assetAllocation':old_a},now)
                  diff = [{k:[a.get(k),b.get(k)] for k in a.keys() | b.keys() if a.get(k) != b.get(k)}
                          for a,b in zip(held['rows'],rebuilt['rows']) if a != b]
                  return {'isin':isin,'raw':body, 'asOf':sorted({r['effectiveDate'] for r in raw}),
                    'allocation':record['assetAllocation'],'actualTotals':{k:str(v) for k,v in totals.items()},
                    'displayRebuilt':{k:str(v) for k,v in displayed_allocation(totals).items()},
                    'retainedRowsDifference':diff}
              except Exception as e:
                  return {'isin':isin,'error':str(e)}
          with ThreadPoolExecutor(max_workers=4) as pool:
              receipts = list(pool.map(one, CONFIG))
          print(json.dumps([{k:v for k,v in r.items() if k!='raw'} for r in receipts], ensure_ascii=False, indent=2))
          for name in ('dca-complete-holdings','dca-holdings-status'):
              files = json.loads(Path(f'src/data/{name}.json').read_text())
              for key in ('IE000NDWFGA5', 'IE00BK5BQW10', *(r[2] for r in CONFIG)):
                  row = files.get(key,{})
                  print(name, key, json.dumps({k:v for k,v in row.items() if k in ('asOf','checkedAt','lastSuccessAt','scope','basis','complete','status','sourceUrl','weightBasis','publishedNetWeightPct','unvaluedPositions')}, ensure_ascii=False))
          Path('composition-inputs.json').write_text(json.dumps(receipts,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: composition-source-evidence
          path: composition-inputs.json
