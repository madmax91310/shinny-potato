name: Investigate new Corum quarterly layouts
on:
  push:
    branches: [fix/corum-quarterly-source-layout]
    paths: ['scripts/probe_corum_layout.py', '.github/workflows/probe-corum-layout.yml']
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0 Pillow==12.3.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: python scripts/probe_corum_layout.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: corum-layout-evidence
          path: test-artifacts/corum-layout
          retention-days: 14
