name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing refreshed investor data
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Only newer revisions of the same PR may cancel their validation. Production
  # builds (including workflow_call from 13F refresh) have independent lifetimes.
  group: pages-validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  current-snapshot:
    runs-on: ubuntu-26.04
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: head
        env:
          PR_EVENT: ${{ github.event_name == 'pull_request' }}
          MASTER_REF: ${{ github.ref == 'refs/heads/master' }}
        run: |
          if [[ "$PR_EVENT" == true || "$MASTER_REF" != true ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            bash scripts/check-pages-head.sh
          fi
  build:
    needs: current-snapshot
    if: needs.current-snapshot.outputs.current == 'true'
    # Explicitly validate the next ubuntu-latest image before its rollout.
    runs-on: ubuntu-26.04
    outputs:
      commit_sha: ${{ steps.snapshot.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record the exact built snapshot
        id: snapshot
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_ranking_sources.py'
      - run: node scripts/test-performance-rankings.mjs
      - run: node scripts/build-tool-links.mjs && node scripts/test-tools-roadmap.mjs
      - run: node scripts/test-selected-data.mjs
      - run: node scripts/test-tool-projections.mjs
      - run: node scripts/test-light-registries.mjs
      - run: node scripts/test-browser-shards.mjs
      - run: node scripts/test-broker-automation.mjs
      - run: node scripts/test-lifestrategy.mjs
      - run: node scripts/test-resource-selections.mjs
      - run: node scripts/build-dca-exposures.mjs && npm run test:dca && node scripts/audit-portfolio-routing.mjs
      - run: node scripts/test-exposure-classification.mjs
      - run: python -m unittest discover -s scripts -p "test_exposure_sleeves.py"
      - run: python -m unittest discover -s scripts -p "test_dca*py"
      - run: node scripts/test-global-audit.mjs
      - run: node scripts/test-portfolio-roadmap.mjs
      - run: node scripts/test-all-weather.mjs
      - run: node scripts/test-exposure-observations.mjs
      - run: node scripts/build-monthly-duel-returns.mjs && node scripts/test-distinct-asset-routing.mjs
      - run: node scripts/test-presentation-etf.mjs
      - run: node scripts/test-scpi.mjs
      - run: node scripts/test-insurance.mjs
      - run: node scripts/test-company-analysis.mjs
      - run: node scripts/test-company-valuation.mjs
      - run: node scripts/test-company-release.mjs
      - run: node scripts/test-company-independent.mjs
      - run: node scripts/test-company-professional.mjs
      - run: node scripts/test-company-context.mjs
      - run: node scripts/test-company-forecast-ledger.mjs
      - run: npm run test:radar
      - run: node scripts/test-wealth-simulator.mjs
      - run: python -m unittest discover -s scripts -p "test_performance_currency.py"
      - run: node scripts/test-performance-currency.mjs
      - run: node scripts/test-annual-rollover.mjs
      - run: node scripts/test-automated-indices.mjs
      - run: node scripts/test-automated-index-sheets.mjs
      - run: node scripts/test-automation-gap-inventory.mjs
      - run: node scripts/test-etf-completeness.mjs
      - run: node scripts/test-priority-issuer-consumers.mjs
      - run: npm run audit:portfolio-provenance
      - run: node scripts/build-equity-duel-returns.mjs
      - run: npm run audit:portfolio-duels
      - run: node scripts/test-equity-duels.mjs
      - run: node scripts/test-manual-equity-duels.mjs
      - run: npm run audit:broker-evidence
      - run: npm run audit:data-review
      - run: node scripts/test-data-review-reminder.mjs
      - run: npm run audit:performance-consistency
      - run: npm run audit:etf-annual-performance
      - run: npm run audit:etf-completeness
      - run: npm run audit:etf-consistency
      - run: node scripts/test-four-issuer-consumers.mjs
      - run: npm run audit:instrument-listings
      - run: npm run audit:instrument-catalog
      - run: node scripts/audit-support-enrichment.mjs
      - run: npm run audit:calculator-series
      - run: node scripts/test-gold-consumers.mjs
      - run: node scripts/test-monthly-consumers.mjs
      - run: node scripts/test-equity-monthly.mjs
      - run: node scripts/test-investment-crisis.mjs
      - run: node scripts/test-etf-tool-connections.mjs
      - run: node scripts/test-investment-conclusions.mjs
      - run: node scripts/test-anniversary-indices.mjs
      - run: node scripts/test-existing-asset-formats.mjs
      - run: node scripts/test-publication-consumers.mjs
      - run: node scripts/test-household-benchmarks.mjs
      - run: npm run audit:publishable-content
      - run: npm run audit:source-inventory
      - run: node scripts/test-comparison-etf-details.mjs
      - run: npm run verify:tweet-midi
      - run: npm run audit:investor-profiles
      - run: npm run audit:household-statistics
      - run: node scripts/test-diversification-lot-one.mjs
      - run: node scripts/test-gaming-medical-reuse.mjs
      - run: node scripts/test-world-factors-step-one.mjs
      - run: node scripts/test-property-infrastructure-step-two.mjs
      - run: node scripts/test-data-reuse.mjs
      - run: node scripts/test-fee-impact-editorial.mjs
      - run: npm run audit:data-catalog
      - run: npm run audit:data-provenance
      - run: node scripts/test-index-comparison-copy.mjs
      - run: npm run audit:index-facts
      - run: npm run audit:index-completeness
      - run: npm run verify:factsheet-tweets
      - run: node scripts/test-portfolio-editorial.mjs
      - run: node scripts/test-publication-preferences.mjs
      - run: node scripts/test-asset-selection.mjs
      - run: node scripts/test-portfolio-recipes.mjs
      - run: node scripts/test-generator-controls.mjs
      - run: node scripts/test-etf-routing-expansion.mjs
      - run: node scripts/audit-asset-tool-routing.mjs
      - run: node scripts/test-publication-reliability.mjs
      - run: node scripts/test-historical-publications.mjs
      - run: npm run stress-test:portfolios
      - run: node scripts/test-observation-freshness.mjs
      - run: node scripts/test-automation-overview.mjs
      - run: node scripts/test-monitoring-context.mjs
      - run: node scripts/test-format-loading.mjs
      - run: node scripts/test-history-pool-initialization.mjs
      - run: npm run build
      - run: node scripts/build-app-inventory.mjs --check
      - run: node scripts/test-format-loading.mjs --built
      - run: node scripts/test-practical-sheets.mjs
      - run: node scripts/test-performance-links.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: validated-site
          path: dist
          include-hidden-files: true
          retention-days: 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: validated-generated-data
          path: |
            src/data/performance-links.json
            src/data/simulation-links.json
            src/data/tool-links.json
            src/data/monthly-duel-returns.json
          if-no-files-found: error
          retention-days: 2
      - uses: actions/configure-pages@v6.0.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist

  python-checks:
    needs: current-snapshot
    if: needs.current-snapshot.outputs.current == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0 openpyxl==3.1.5
      - run: python -m unittest discover -s scripts -p 'test_broker_tariff*.py'
      - run: python scripts/audit_broker_coverage.py
      - run: python -m unittest discover -s scripts -p 'test_data*.py'
      - run: python -m unittest discover -s scripts -p 'test_active_refresh.py'
      - run: python -m unittest discover -s scripts -p 'test_etf_resilience.py'
      - run: python -m unittest discover -s scripts -p 'test_source_documents.py'
      - run: pip install Pillow==12.3.0
      - run: python -m unittest discover -s scripts -p 'test_russell_composition.py'
      - run: python -m unittest discover -s scripts -p 'test_sp_composition.py'
      - run: python -m unittest discover -s scripts -p 'test_monthly_automation.py'
      - run: python -m unittest discover -s scripts -p 'test_nasdaq_monthly.py'
      - run: node scripts/test-nasdaq-total-return.mjs
      - run: python -m unittest discover -s scripts -p 'test_roadmap_assets.py'
      - run: python -m unittest discover -s scripts -p 'test_qualified_roadmap.py'
      - run: python -m unittest discover -s scripts -p 'test_bnp_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_etf_field_completion.py'
      - run: python -m unittest discover -s scripts -p 'test_priority_etf_completion.py'
      - run: python -m unittest discover -s scripts -p 'test_document_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_new_issuer_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_priority_issuer_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_qyld_qualification.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_lifestrategy.py'
      - run: python -m unittest discover -s scripts -p 'test_physical_etc.py'
      - run: python -m unittest discover -s scripts -p 'test_product_calendars.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_calendar_capture.py'
      - run: python -m unittest discover -s scripts -p 'test_commodity_allocations.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_reliability.py'
      - run: python scripts/test_radar_review_583.py
      - run: python -m unittest discover -s scripts -p 'test_four_issuer_recovery.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_allocations.py'
      - run: python -m unittest discover -s scripts -p 'test_remaining_index_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_index_extensions.py'
      - run: python -m unittest discover -s scripts -p 'test_world_sector_indices.py'
      - run: python -m unittest discover -s scripts -p 'test_index_composition_gate.py'
      - run: python -m unittest discover -s scripts -p 'test_remaining_aum.py'
      - run: pip install -r scripts/company-requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_scpi.py'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: python -m unittest discover -s scripts -p 'test_corum.py'
      - run: python -m unittest discover -s scripts -p 'test_corum_vector.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_actors.py'
      - run: python -m unittest discover -s scripts -p 'test_extended_scpi.py'
      - run: python -m unittest discover -s scripts -p 'test_insurance.py'
      - run: python -m unittest discover -s scripts -p 'test_publication_periods.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_company_analysis.py'
      - run: python -m unittest discover -s scripts -p 'test_non_bond_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_support_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_publication*.py'
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      - run: python -m unittest discover -s scripts -p "test_data_automation.py"
      - run: pip install -r scripts/requirements-gold.txt
      - run: python -m unittest discover -s scripts -p "test_gold_monthly.py"
      - run: python -m unittest discover -s scripts -p "test_pages_head.py"
      - run: python -m unittest discover -s scripts -p 'test_automation*.py'
      - run: python -m unittest discover -s scripts -p 'test_audit_workflows.py'
      - run: python -m unittest discover -s scripts -p 'test_validated_data_commit.py'

  browser-checks:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Reuse the exact data generated and validated by the build job.
      - uses: actions/download-artifact@v4
        with:
          name: validated-generated-data
          path: src/data
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-distinct-asset-routing.mjs
        if: matrix.shard == 1
      - run: node scripts/playwright-routing-additions.mjs
        if: matrix.shard == 1
      - run: node scripts/playwright-all-weather.mjs
        if: matrix.shard == 1
      - run: node scripts/test-simple-exposure.mjs
        if: matrix.shard == 1
      - run: node scripts/run-browser-checks.mjs ${{ matrix.shard }} 4
      - run: node scripts/playwright-etf-completeness.mjs
        if: matrix.shard == 0
      - run: node scripts/test-asset-picker-preferences.mjs && node scripts/playwright-asset-picker-modes.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-tool-links.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-equity-monthly.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-nasdaq-total-return.mjs
        if: matrix.shard == 0
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tool-visual-checks-${{ matrix.shard }}
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7

  exposure-browser-check:
    needs: current-snapshot
    if: needs.current-snapshot.outputs.current == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-dca-exposures.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-exposure-scope.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exposure-scope-browser
          path: test-artifacts/exposure-scope
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [build, python-checks, browser-checks, exposure-browser-check]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # Explicitly validate the next ubuntu-latest image before its rollout.
    runs-on: ubuntu-26.04
    # Serialize actual publications, without interrupting an active publication
    # or replacing a waiting 13F deployment with an unrelated/older run.
    concurrency:
      group: pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Skip superseded production snapshots
        id: current
        run: bash scripts/check-pages-head.sh
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5.0.1
