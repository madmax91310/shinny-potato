      - run: python -m unittest discover -s scripts -p 'test_dws_liquidity_funds.py'
      - run: python -m unittest discover -s scripts -p 'test_hsbc_jpm_holdings.py'
      - run: python -m unittest discover -s scripts -p 'test_pending_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_native_source_evidence.py'
      - run: python -m unittest discover -s scripts -p 'test_audit_workflows.py'
      - run: python -m unittest discover -s scripts -p 'test_consolidated_data_followup.py'
      - run: python -m unittest discover -s scripts -p 'test_removed_ai_scope.py'
      - run: python -m unittest discover -s scripts -p 'test_projection_recording.py'
      - run: python -m unittest discover -s scripts -p 'test_monthly_control_renewal.py'
      - run: python -m unittest discover -s scripts -p 'test_amundi_nav_history.py'
      - run: python -m unittest discover -s scripts -p 'test_amundi_distributing_nav.py'
      - run: python -m unittest discover -s scripts -p 'test_amundi_anniversary_prices.py'
      - run: python -m unittest discover -s scripts -p 'test_nav_daily_cross.py'
      - run: python -m unittest discover -s scripts -p 'test_blackrock_income_history.py'
      - run: node scripts/test-income-nav-consumers.mjs
      - run: python -m unittest discover -s scripts -p 'test_hsbc_adjustment_investigation.py'
      - run: python -m unittest discover -s scripts -p 'test_data_use_matrix.py'
      - run: python -m unittest discover -s scripts -p 'test_exchange_listing_refresh.py'
      - run: python -m unittest discover -s scripts -p 'test_validated_data_commit.py'
      - run: python -m unittest discover -s scripts -p 'test_data_publication.py'
      - run: python -m unittest discover -s scripts -p 'test_publication_safety.py'

  browser-checks:
    timeout-minutes: 40
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Reuse the exact data generated and validated by the build job.
      - uses: actions/download-artifact@v4
        with:
          name: validated-generated-data
          path: src/data
      - uses: actions/download-artifact@v4
        with:
          name: validated-dca-projections
          path: src/pages/dca-profiles
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-review-product.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-data-review-recovery.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-removed-ai.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-data-automation-inventory.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-acwi-allocation-recovery.mjs
        if: matrix.shard == 1
      - run: node scripts/playwright-remainder-nav.mjs
        env:
          TEST_NAV_IDS: etfFR0007054358Nav,etfIE00BK5BCD43Nav,etfIE00BK5BCH80Nav,etfLU1875395870Nav,etfGB00B15KXQ89Nav,etc_brent_crude_oilNav,etc_wti_crude_oilNav,etc_coffeeNav
        if: matrix.shard == 1
      - run: node scripts/playwright-official-nav.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-currency-consistency.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-distinct-asset-routing.mjs
        if: matrix.shard == 1
      - run: node scripts/playwright-routing-additions.mjs
        if: matrix.shard == 1
      - run: node scripts/playwright-model-portfolios.mjs
        if: matrix.shard == 1
      - run: node scripts/test-simple-exposure.mjs
        if: matrix.shard == 1
      - run: node scripts/run-browser-checks.mjs ${{ matrix.shard }} 4
      - run: node scripts/playwright-etf-completeness.mjs
        if: matrix.shard == 0
      - run: node scripts/test-asset-picker-preferences.mjs && node scripts/playwright-asset-picker-modes.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-tool-links.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-equity-monthly.mjs
        if: matrix.shard == 0
      - run: node scripts/playwright-nasdaq-total-return.mjs
        if: matrix.shard == 0
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-durations-${{ matrix.shard }}
          path: test-artifacts/browser-durations-*.json
          if-no-files-found: ignore
          retention-days: 35
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: radar-publication-browser-${{ matrix.shard }}
          path: |
            test-artifacts/radar
            test-artifacts/radar-audit
          if-no-files-found: ignore
          retention-days: 14
      # Visual exports are diagnostics: a green shard needs none, a red shard keeps
      # them a week (one shard can produce 2 GB of PNG exports).
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: tool-visual-checks-${{ matrix.shard }}
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7

  exposure-browser-check:
    needs: current-snapshot
    if: needs.current-snapshot.outputs.current == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.current-snapshot.outputs.commit_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-dca-exposures.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-exposure-scope.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: exposure-scope-browser
          path: test-artifacts/exposure-scope
          if-no-files-found: ignore
          retention-days: 7

  # Blocking in every lane: each tool must render the refreshed data without a
  # crash or an invalid value. It asserts no figures, so data updates cannot break it.
  smoke:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-generated-data
          path: src/data
      - uses: actions/download-artifact@v4
        with:
          name: validated-dca-projections
          path: src/pages/dca-profiles
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-data-routes.mjs

  # Data-only snapshots are published even if an advisory browser check failed;
  # this job keeps the failure visible in the run and in the monitoring issue.
  advisory-checks:
    needs: [scope, browser-checks, exposure-browser-check, deploy]
    if: always() && needs.scope.outputs.data_only == 'true' && (needs.browser-checks.result == 'failure' || needs.exposure-browser-check.result == 'failure')
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "Données publiées (voie données : publication ${{ needs.deploy.result }}). Un contrôle navigateur éditorial a échoué et doit être réparé ; il ne bloque plus les données." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    needs: [scope, build, tweet-midi-checks, python-checks, browser-checks, exposure-browser-check, smoke]
    if: >-
      always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      && needs.build.result == 'success' && needs.tweet-midi-checks.result == 'success' && needs.python-checks.result == 'success' && needs.smoke.result == 'success'
      && ((needs.browser-checks.result == 'success' && needs.exposure-browser-check.result == 'success')
          || needs.scope.outputs.data_only == 'true')
    # Explicitly validate the next ubuntu-latest image before its rollout.
    runs-on: ubuntu-26.04
    # Serialize actual publications, without interrupting an active publication
    # or replacing a waiting 13F deployment with an unrelated/older run.
    concurrency:
      group: pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: validated-gate-definition
          path: ${{ runner.temp }}/gate-definition
      - name: Verify the definition and code actually validated
        run: node scripts/pages-gate-definition.mjs "$RUNNER_TEMP/gate-definition/pages-gate-definition.json" "${{ needs.build.outputs.commit_sha }}"
      - id: data
        env:
          VALIDATED_CODE_SHA: ${{ needs.build.outputs.commit_sha }}
          REQUIRED_DATA_RECEIPT: ${{ runner.temp }}/code-data-required.json
        run: node scripts/prepare-code-data-refresh.mjs
      - if: steps.data.outputs.refresh == 'true'
        run: npm ci
      - if: steps.data.outputs.refresh == 'true'
        run: npm run audit:data-catalog && npm run build
      - name: Require every primary producer file after rebuilding newer data
        if: steps.data.outputs.refresh == 'true'
        env:
          REQUIRED_DATA_RECEIPT: ${{ runner.temp }}/code-data-required.json
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          import {execFileSync} from 'node:child_process'
          const required=JSON.parse(readFileSync(process.env.REQUIRED_DATA_RECEIPT))
          assert(Object.keys(required).length)
          for(const [path,sha] of Object.entries(required))assert.equal(execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim(),sha,'A validated producer file changed during rebuild: '+path)
          JS
      - if: steps.data.outputs.refresh == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.data.outputs.refresh == 'true'
        run: node scripts/smoke-data-routes.mjs
      - name: Seal the rebuilt code and data identities
        if: steps.data.outputs.refresh == 'true'
        env:
          CODE_SHA: ${{ steps.data.outputs.code_sha }}
          DATA_SHA: ${{ steps.data.outputs.data_sha }}
        run: |
          python3 scripts/data_publication.py manifest --output dist/data/publication-manifest.json
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs'
          writeFileSync('dist/build-info.json',JSON.stringify({sha:process.env.CODE_SHA,dataSha:process.env.DATA_SHA,lane:'validated-code-data',builtAt:new Date().toISOString()})+'\n')
          JS
      - uses: actions/configure-pages@v6.0.0
        if: steps.data.outputs.refresh == 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.data.outputs.refresh == 'true'
        with:
          name: github-pages-current-data
          path: dist
      - if: steps.data.outputs.refresh == 'true'
        run: git reset --hard "${{ steps.data.outputs.data_sha }}"
      - name: Skip superseded production snapshots
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_CODE_SHA: ${{ steps.data.outputs.code_sha }}
          PAGES_FALLBACK: ${{ steps.data.outputs.refresh }}
        run: bash scripts/check-pages-head.sh
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ steps.data.outputs.refresh == 'true' && 'github-pages-current-data' || 'github-pages' }}
      - uses: actions/setup-node@v7.0.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.current == 'true' && steps.data.outputs.refresh != 'true'
        with:
          name: validated-site
          path: dist
      - name: Verify the actual public data artifact
        if: steps.current.outputs.current == 'true'
        run: node scripts/verify-pages-publication.mjs "${{ steps.deployment.outputs.page_url }}" "${{ steps.data.outputs.code_sha }}" "${{ steps.data.outputs.data_sha }}"
      - uses: actions/upload-artifact@v7.0.1
        if: always() && steps.current.outputs.current == 'true'
        with:
          name: verified-publication
          path: test-artifacts/publication-verified.json
          if-no-files-found: error
          retention-days: 35

  # Fallback lane: the full gate failed on a snapshot whose code changed since the
  # published commit. Refreshed data must not wait for a human to repair the code:
  # rebuild the published (already validated) code with the new automation data,
  # and publish it if the build and the data smoke test pass. The failed checks
  # stay red in this run and in the monitoring issue.
  fallback-build:
    needs: [scope, build, tweet-midi-checks, python-checks, browser-checks, exposure-browser-check, smoke]
    if: >-
      always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      && needs.scope.result == 'success' && needs.scope.outputs.data_only != 'true' && needs.scope.outputs.published != ''
      && !(needs.build.result == 'success' && needs.tweet-midi-checks.result == 'success' && needs.python-checks.result == 'success' && needs.smoke.result == 'success'
           && needs.browser-checks.result == 'success' && needs.exposure-browser-check.result == 'success')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      data_sha: ${{ steps.compose.outputs.data_sha }}
      code_sha: ${{ steps.compose.outputs.code_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.scope.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - id: compose
        run: node scripts/compose-fallback-snapshot.mjs --published "${{ needs.scope.outputs.published }}"
      - run: npm ci
      - run: npm run build
      - name: Seal final fallback data after all generators
        run: python3 scripts/data_publication.py manifest --output dist/data/publication-manifest.json
      - name: Record the published code and the data snapshot
        run: printf '{"sha":"%s","dataSha":"%s","lane":"fallback","builtAt":"%s"}\n' "${{ steps.compose.outputs.code_sha }}" "${{ steps.compose.outputs.data_sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/build-info.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-data-routes.mjs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-fallback
          path: dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fallback-publication-manifest
          path: dist/data/publication-manifest.json
          retention-days: 2

  deploy-fallback:
    needs: fallback-build
    if: always() && needs.fallback-build.result == 'success'
    runs-on: ubuntu-26.04
    concurrency:
      group: pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.fallback-build.outputs.data_sha }}
      - name: Skip superseded production snapshots
        id: current
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_CODE_SHA: ${{ needs.fallback-build.outputs.code_sha }}
          PAGES_FALLBACK: 'true'
        run: bash scripts/check-pages-head.sh
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-fallback
      - if: steps.current.outputs.current == 'true'
        run: echo "Données publiées avec le dernier code validé (voie de secours). Le code de master reste à réparer." >> "$GITHUB_STEP_SUMMARY"


      - uses: actions/setup-node@v7.0.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.current == 'true'
        with:
          name: fallback-publication-manifest
          path: dist/data
      - name: Verify the actual fallback data artifact
        if: steps.current.outputs.current == 'true'
        run: node scripts/verify-pages-publication.mjs "${{ steps.deployment.outputs.page_url }}" "${{ needs.fallback-build.outputs.code_sha }}" "${{ needs.fallback-build.outputs.data_sha }}"
      - uses: actions/upload-artifact@v7.0.1
        if: always() && steps.current.outputs.current == 'true'
        with:
          name: verified-fallback-publication
          path: test-artifacts/publication-verified.json
          if-no-files-found: error
          retention-days: 35
