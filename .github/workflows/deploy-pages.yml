name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing refreshed investor data
        required: true
        type: string
      validation_group:
        description: Legacy code epoch accepted for compatibility; etf-publication-954 reserves the historical recovery queue
        required: false
        type: string
        default: ''
      producer_receipt_declared:
        description: Internal caller already uploaded the exact producer expectation receipt
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  deployments: read
  id-token: write

concurrency:
  # Producers and master pushes share one full validation queue. The selector
  # coalesces queued requests; the publisher adopts the latest safe data prefix.
  # One group per data SHA otherwise starts 8 browser jobs for every collector.
  # v4 isolates this gate generation from queued old definitions that cannot
  # adopt current code after unrelated workflow additions. Publishing still uses
  # the unchanged pages-production lock and published code/data ancestry checks.
  group: ${{ inputs.validation_group == 'etf-publication-954' && 'pages-validation-etf-publication-954' || format('pages-validation-v4-{0}', github.event_name == 'pull_request' && github.ref || 'master') }}
  # Superseded PR revisions cannot publish; keep every production validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  current-snapshot:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
      commit_sha: ${{ steps.head.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - id: head
        env:
          PAGES_PRODUCTION: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          PAGES_DEFINITION_SHA: ${{ github.workflow_sha }}
          PAGES_GATE_RECEIPT: ${{ runner.temp }}/pages-gate-definition.json
        run: node scripts/resolve-pages-snapshot.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: steps.head.outputs.current == 'true'
        with:
          name: validated-gate-definition
          path: ${{ runner.temp }}/pages-gate-definition.json
          if-no-files-found: error
          retention-days: 35
  # Data-only lane: when every file changed since the published commit is an
  # automation data path, the code already passed the full gate. Editorial and
  # visual browser checks then become advisory, so refreshed data is never held
  # back by an unrelated check; the build, Python and smoke checks still block.
  # Pull requests, code changes and any uncertainty keep the full gate.
  scope:
    needs: current-snapshot
    if: needs.current-snapshot.outputs.current == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      data_only: ${{ steps.scope.outputs.data_only }}
      published: ${{ steps.scope.outputs.published }}
      commit_sha: ${{ needs.current-snapshot.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.current-snapshot.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - name: Record the data snapshot requested for publication
        if: github.event_name != 'pull_request'
        run: python3 scripts/data_publication.py receipt --all --commit "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/data-publication-receipt.json"
      # A nested producer publication keeps its original, narrower expectation.
      # The all-snapshot receipt is still generated locally for the code gate.
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name != 'pull_request' && !inputs.producer_receipt_declared
        with:
          name: data-publication-receipt
          path: ${{ runner.temp }}/data-publication-receipt.json
          retention-days: 35
      - id: scope
        if: github.event_name != 'pull_request'
        run: node scripts/classify-deploy-scope.mjs --published-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/build-info.json"

