name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing refreshed investor data
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Only newer revisions of the same PR may cancel their validation. Production
  # builds (including workflow_call from 13F refresh) have independent lifetimes.
  group: pages-validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.snapshot.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record the exact built snapshot
        id: snapshot
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:portfolio-provenance
      - run: npm run audit:portfolio-duels
      - run: npm run audit:broker-evidence
      - run: npm run audit:data-review
      - run: node scripts/test-data-review-reminder.mjs
      - run: npm run audit:performance-consistency
      - run: npm run audit:etf-annual-performance
      - run: npm run audit:etf-completeness
      - run: npm run audit:etf-consistency
      - run: npm run audit:instrument-listings
      - run: npm run audit:instrument-catalog
      - run: node scripts/audit-support-enrichment.mjs
      - run: npm run audit:calculator-series
      - run: node scripts/test-gold-consumers.mjs
      - run: node scripts/test-investment-conclusions.mjs
      - run: node scripts/test-household-benchmarks.mjs
      - run: npm run audit:publishable-content
      - run: npm run audit:source-inventory
      - run: npm run verify:tweet-midi
      - run: npm run audit:investor-profiles
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      - run: python -m unittest discover -s scripts -p "test_data_automation.py"
      - run: pip install -r scripts/requirements-gold.txt
      - run: python -m unittest discover -s scripts -p "test_gold_monthly.py"
      - run: python -m unittest discover -s scripts -p "test_pages_head.py"
      - run: npm run audit:household-statistics
      - run: node scripts/test-data-reuse.mjs
      - run: npm run audit:data-catalog
      - run: npm run audit:data-provenance
      - run: npm run audit:index-facts
      - run: npm run verify:factsheet-tweets
      - run: node scripts/test-portfolio-editorial.mjs
      - run: node scripts/test-asset-selection.mjs
      - run: node scripts/test-portfolio-recipes.mjs
      - run: npm run stress-test:portfolios
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-tools.mjs
      - run: node scripts/test-portfolio-metallic.mjs
      - run: node scripts/test-export-copy.mjs
      - run: node scripts/test-publication-studio.mjs
      - run: node scripts/test-anniversary-art.mjs
      - run: node scripts/test-etf-art.mjs
      - run: node scripts/test-stylized-formats.mjs
      - run: node scripts/test-investment-emerald.mjs
      - run: node scripts/test-duel-titanium.mjs
      - run: node scripts/test-investor-screenprint.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investor-visual-checks
          path: test-artifacts/investor-screenprint
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duel-visual-checks
          path: test-artifacts/duel-titanium
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investment-visual-checks
          path: test-artifacts/investment-emerald
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tool-visual-checks
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - run: node scripts/test-route-loading.mjs
      - run: node scripts/test-data-review-calendar.mjs
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize actual publications, without interrupting an active publication
    # or replacing a waiting 13F deployment with an unrelated/older run.
    concurrency:
      group: pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Skip superseded production snapshots
        id: current
        run: bash scripts/check-pages-head.sh
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v4
