name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing refreshed investor data
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Only newer revisions of the same PR may cancel their validation. Production
  # builds (including workflow_call from 13F refresh) have independent lifetimes.
  group: pages-validation-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Explicitly validate the next ubuntu-latest image before its rollout.
    runs-on: ubuntu-26.04
    outputs:
      commit_sha: ${{ steps.snapshot.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record the exact built snapshot
        id: snapshot
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - run: python -m unittest discover -s scripts -p 'test_broker_tariff*.py'
      - run: python scripts/audit_broker_coverage.py
      - run: node scripts/test-broker-automation.mjs
      - run: python -m unittest discover -s scripts -p 'test_data*.py'
      - run: python -m unittest discover -s scripts -p 'test_active_refresh.py'
      - run: python -m unittest discover -s scripts -p 'test_source_documents.py'
      - run: pip install Pillow==12.3.0
      - run: python -m unittest discover -s scripts -p 'test_russell_composition.py'
      - run: python -m unittest discover -s scripts -p 'test_sp_composition.py'
      - run: python -m unittest discover -s scripts -p 'test_monthly_automation.py'
      - run: python -m unittest discover -s scripts -p 'test_bnp_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_etf_field_completion.py'
      - run: python -m unittest discover -s scripts -p 'test_priority_etf_completion.py'
      - run: python -m unittest discover -s scripts -p 'test_document_etf.py'
      - run: python -m unittest discover -s scripts -p 'test_new_issuer_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_product_calendars.py'
      - run: python -m unittest discover -s scripts -p 'test_commodity_allocations.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_reliability.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_allocations.py'
      - run: python -m unittest discover -s scripts -p 'test_remaining_index_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_index_extensions.py'
      - run: python -m unittest discover -s scripts -p 'test_remaining_aum.py'
      - run: pip install -r scripts/company-requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_scpi.py'
      - run: node scripts/test-scpi.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: python -m unittest discover -s scripts -p 'test_corum.py'
      - run: python -m unittest discover -s scripts -p 'test_corum_vector.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_actors.py'
      - run: python -m unittest discover -s scripts -p 'test_extended_scpi.py'
      - run: python -m unittest discover -s scripts -p 'test_insurance.py'
      - run: python -m unittest discover -s scripts -p 'test_publication_periods.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_expansion.py'
      - run: node scripts/test-insurance.mjs
      - run: python -m unittest discover -s scripts -p 'test_company_analysis.py'
      - run: node scripts/test-company-analysis.mjs
      - run: npm run test:radar
      - run: node scripts/test-wealth-simulator.mjs
      - run: node scripts/test-annual-rollover.mjs
      - run: node scripts/test-automated-indices.mjs
      - run: node scripts/test-automation-gap-inventory.mjs
      - run: npm run audit:portfolio-provenance
      - run: npm run audit:portfolio-duels
      - run: npm run audit:broker-evidence
      - run: npm run audit:data-review
      - run: node scripts/test-data-review-reminder.mjs
      - run: npm run audit:performance-consistency
      - run: npm run audit:etf-annual-performance
      - run: npm run audit:etf-completeness
      - run: npm run audit:etf-consistency
      - run: npm run audit:instrument-listings
      - run: npm run audit:instrument-catalog
      - run: node scripts/audit-support-enrichment.mjs
      - run: npm run audit:calculator-series
      - run: node scripts/test-gold-consumers.mjs
      - run: node scripts/test-monthly-consumers.mjs
      - run: node scripts/test-investment-conclusions.mjs
      - run: python -m unittest discover -s scripts -p 'test_publication*.py'
      - run: node scripts/test-publication-consumers.mjs
      - run: node scripts/test-household-benchmarks.mjs
      - run: npm run audit:publishable-content
      - run: npm run audit:source-inventory
      - run: node scripts/test-comparison-etf-details.mjs
      - run: npm run verify:tweet-midi
      - run: npm run audit:investor-profiles
      - run: python -m unittest discover -s scripts -p "test_investor_refresh.py"
      - run: python -m unittest discover -s scripts -p "test_data_automation.py"
      - run: pip install -r scripts/requirements-gold.txt
      - run: python -m unittest discover -s scripts -p "test_gold_monthly.py"
      - run: python -m unittest discover -s scripts -p "test_pages_head.py"
      - run: npm run audit:household-statistics
      - run: node scripts/test-diversification-lot-one.mjs
      - run: node scripts/test-gaming-medical-reuse.mjs
      - run: node scripts/test-world-factors-step-one.mjs
      - run: node scripts/test-property-infrastructure-step-two.mjs
      - run: node scripts/test-data-reuse.mjs
      - run: node scripts/test-fee-impact-editorial.mjs
      - run: npm run audit:data-catalog
      - run: npm run audit:data-provenance
      - run: node scripts/test-index-comparison-copy.mjs
      - run: npm run audit:index-facts
      - run: npm run audit:index-completeness
      - run: npm run verify:factsheet-tweets
      - run: node scripts/test-portfolio-editorial.mjs
      - run: node scripts/test-asset-selection.mjs
      - run: node scripts/test-portfolio-recipes.mjs
      - run: npm run stress-test:portfolios
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-artifacts/company-analysis
      - run: node scripts/test-scpi-ui.mjs
      - run: node scripts/test-insurance-ui.mjs
      - run: node scripts/test-presentations.mjs
      - run: node scripts/test-presentations-ui.mjs
      - run: node scripts/test-presentation-images.mjs
      - run: node scripts/test-company-analysis-ui.mjs
        env:
          COMPANY_QA_DIR: test-artifacts/company-analysis
      - run: node scripts/playwright-tools.mjs
      - run: npm run test:radar:browser
      - run: node scripts/playwright-wealth.mjs
      - run: node scripts/test-regulatory-ui.mjs
      - run: node scripts/test-commodity-allocation-ui.mjs
      - run: node scripts/test-portfolio-metallic.mjs
      - run: node scripts/test-index-ribbon.mjs
      - run: node scripts/test-index-ceramic.mjs
      - run: node scripts/test-household-sculpture.mjs
      - run: node scripts/test-purchasing-power-editorial.mjs
      - run: node scripts/test-purchasing-power-receipt.mjs
      - run: node scripts/test-export-copy.mjs
      - run: node scripts/test-publication-studio.mjs
      - run: node scripts/playwright-publication.mjs
      - run: node scripts/test-anniversary-art.mjs
      - run: node scripts/test-etf-art.mjs
      - run: node scripts/test-stylized-formats.mjs
      - run: node scripts/test-investment-emerald.mjs
      - run: node scripts/test-duel-titanium.mjs
      - run: node scripts/test-investor-screenprint.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investor-visual-checks
          path: test-artifacts/investor-screenprint
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: duel-visual-checks
          path: test-artifacts/duel-titanium
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investment-visual-checks
          path: test-artifacts/investment-emerald
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tool-visual-checks
          path: test-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - run: node scripts/test-weekly-publications.mjs
      - run: node scripts/test-route-loading.mjs
      - run: node scripts/test-data-review-calendar.mjs
      - uses: actions/configure-pages@v6.0.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    # Explicitly validate the next ubuntu-latest image before its rollout.
    runs-on: ubuntu-26.04
    # Serialize actual publications, without interrupting an active publication
    # or replacing a waiting 13F deployment with an unrelated/older run.
    concurrency:
      group: pages-production
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Skip superseded production snapshots
        id: current
        run: bash scripts/check-pages-head.sh
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5.0.1
