name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:portfolio-provenance
      - run: npm run audit:portfolio-duels
      - run: npm run audit:performance-consistency
      - run: npm run audit:etf-consistency
      - run: npm run audit:publishable-content
      - run: npm run audit:source-inventory
      - run: npm run verify:tweet-midi
      - run: npm run verify:factsheet-tweets
      - run: npm run stress-test:portfolios
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-tools.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
