name: Verify published data connections
on:
  push:
    branches: [audit/live-data-connections]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7490cc9fa6bae1bbaf04bf498e0bcc810547ddbf
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Verify public build, exact holdings and data backlog
        env:
          EXPECTED_SHA: 7490cc9fa6bae1bbaf04bf498e0bcc810547ddbf
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync,writeFileSync} from 'node:fs'
          const base='https://madmax91310.github.io/shinny-potato/'
          const expected=process.env.EXPECTED_SHA
          assert(expected)
          const get=async(path,json=true)=>{
           const response=await fetch(base+path+'?audit='+Date.now(),{cache:'no-store'})
           assert(response.ok,`${path}: HTTP ${response.status}`)
           return json?response.json():response.text()
          }
          let before
          for(let i=0;i<240;i++){
           before=await get('build-info.json')
           if(before.sha===expected&&!before.lane)break
           if(i===239)throw Error(`Expected ${expected}; public build is ${JSON.stringify(before)}`)
           await new Promise(r=>setTimeout(r,10000))
          }
          const report=await get('data/data-automation-inventory.json')
          const summary=await get('data/data-automation-summary.json')
          assert.deepEqual(report.summary,summary.summary)
          const source=JSON.parse(readFileSync('scripts/source-snapshots/live-data-connections-2026-10-20.json'))
          const records=JSON.parse(readFileSync('src/data/dca-complete-holdings.json'))
          const qualified=source.qualifiedIsins.map(isin=>{
           const row=report.connections.find(r=>r.id===isin&&r.field==='completeHoldings')
           assert(row?.present&&row.actionState==='current',`${isin}: ${JSON.stringify(row)}`)
           assert(records[isin]?.complete&&/^[a-f0-9]{64}$/.test(records[isin].sha256))
           assert(row.checkedAt?.startsWith('2026-10-20'),`${isin}: stale check`)
           return {isin,checkedAt:row.checkedAt,sha256:records[isin].sha256,positions:records[isin].rows.length}
          })
          const archive=report.fields.filter(f=>f.id==='IE00BM8R0J59'&&f.field.startsWith('Archive performance ·'))
          assert.equal(archive.length,3)
          assert(archive.every(f=>f.nature.kind==='archive'&&f.checkedAt===null))
          assert(!report.fields.some(f=>f.id==='IE00BM8R0J59'&&f.field.startsWith('Performance ')))
          assert(report.backlog.some(r=>r.id==='IE00BM8R0J59'&&r.field==='catalog:Rendements glissants à qualifier'))
          const csv=await get('data/data-connections-backlog.csv',false)
          assert(csv.includes('Rendements glissants à qualifier')&&csv.includes('derniere_tentative'))
          assert.equal(report.summary.actionableConnections,report.backlog.length)
          const after=await get('build-info.json')
          assert.deepEqual(before,after,'Publication changed during audit')
          const result={build:after,qualified,summary:report.summary,qyldArchived:archive.length,csvPublished:true}
          writeFileSync('public-verification.json',JSON.stringify(result,null,2)+'\n')
          console.log(JSON.stringify(result,null,2))
          
          JS
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: public-verification
          path: public-verification.json
