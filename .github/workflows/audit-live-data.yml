name: Audit live data connections
on:
  push:
    branches: [audit/live-data-connections]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - run: node scripts/build-automation-targets.mjs
      - name: Observe new complete portfolios
        continue-on-error: true
        run: python scripts/probe_live_data_connections.py --apply --only LU0380865021 LU0328475792 LU0274209237 IE00BJ0KDQ92 IE00BK1PV551 DE0002635307 IE00BKWQ0Q14 IE00BFY0GT14 IE00BJ38QD84 IE00B44Z5B48 IE00B469F816 IE00B5M1WJ87 IE00B6YX5D40 IE00B9CQXS71 IE00BYTRR863 IE00BSPLC298 IE00BSPLC413 --output live-data-proof/collection.json
      - run: cp src/data/dca-complete-holdings.json src/data/dca-holdings-status.json scripts/generated-holdings-sources.json live-data-proof/
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-proof
          path: live-data-proof
