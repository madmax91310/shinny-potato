name: Update active Bitcoin Yahoo data
on:
  schedule:
    - cron: '40 6 2,4,8 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-bitcoin-monthly.yml'
      - 'scripts/derive_index_returns.py'
      - 'scripts/refresh_index_sources.py'
      - 'scripts/index-automation.json'
      - 'scripts/*etf*'
      - 'scripts/update_bitcoin_monthly.py'
      - 'scripts/test_active_refresh.py'
      - 'src/data/automated-etf*'
      - 'src/data/bitcoin-yahoo-monthly.json'
permissions:
  contents: read
jobs:
  refresh:
    concurrency:
      # Serialize writers of automated-indices.json; keep PR validations independent.
      group: active-market-data-${{ github.ref != 'refs/heads/master' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      failed: ${{ steps.partial.outputs.failed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A queued production run must start from the latest published data.
          ref: ${{ github.ref == 'refs/heads/master' && 'master' || github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: pip install beautifulsoup4==4.15.0
      - name: Producer result contract v1
        run: python -m unittest discover -s scripts -p 'test_producer_report_contract.py'
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_active_refresh.py'
      - run: node scripts/export-bitcoin-baseline.mjs > "$RUNNER_TEMP/baseline.json"
      - name: "Collect observations: python scripts update_bitcoin_monthly.py --output RUNNER_TEMP observation.json --apply"
        run: python scripts/update_bitcoin_monthly.py --output "$RUNNER_TEMP/observation.json" --apply
      - name: "Collect observations: python scripts refresh_index_sources.py --only-derived --output RUNNER_TEMP derived-index-observation.json --apply"
        run: python scripts/refresh_index_sources.py --only-derived --output "$RUNNER_TEMP/derived-index-observation.json" --apply
      - name: "Validate observations: python -m unittest discover -s scripts -p  test_remaining_index_sources.py"
        run: python -m unittest discover -s scripts -p 'test_remaining_index_sources.py'
      - name: "Validate observations: python -m unittest discover -s scripts -p  test_index_extensions.py"
        run: python -m unittest discover -s scripts -p 'test_index_extensions.py'
      - name: "Validate observations: npm run audit:index-facts"
        run: npm run audit:index-facts
      - name: "Validate observations: node scripts test-automated-indices.mjs"
        run: node scripts/test-automated-indices.mjs
      - name: "Validate observations: npm run audit:etf-annual-performance"
        run: npm run audit:etf-annual-performance
      - name: "Validate observations: npm run audit:etf-consistency"
        run: npm run audit:etf-consistency
      - name: "Validate observations: npm run audit:calculator-series"
        run: npm run audit:calculator-series
      - name: "Validate observations: node scripts test-comparison-etf-details.mjs"
        run: node scripts/test-comparison-etf-details.mjs
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: active-bitcoin-observation
          path: |
            ${{ runner.temp }}/observation.json
            ${{ runner.temp }}/derived-index-observation.json
            ${{ runner.temp }}/**/*.contract-plan.json
          if-no-files-found: ignore
          retention-days: 35
      - name: Detect partial failures
        id: partial
        if: always()
        run: python scripts/report_partial_failures.py "$RUNNER_TEMP/derived-index-observation.json"
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh validated active Bitcoin Yahoo data' src/data/automated-indices.json src/data/bitcoin-yahoo-monthly.json scripts/source-snapshots/bitcoin-automated.json
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-bitcoin-monthly.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Collecte partielle des indices dérivés du Bitcoin : les dernières valeurs validées sont conservées. Voir active-bitcoin-observation.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
