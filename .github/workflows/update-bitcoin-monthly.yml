name: Update active Bitcoin Yahoo data
on:
  schedule:
    - cron: '40 6 2,4,8 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-bitcoin-monthly.yml'
      - 'scripts/*etf*'
      - 'scripts/update_bitcoin_monthly.py'
      - 'scripts/test_active_refresh.py'
      - 'src/data/automated-etf*'
      - 'src/data/bitcoin-yahoo-monthly.json'
permissions:
  contents: read
concurrency:
  group: active-bitcoin-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_active_refresh.py'
      - run: node scripts/export-bitcoin-baseline.mjs > "$RUNNER_TEMP/baseline.json"
      - run: python scripts/update_bitcoin_monthly.py --output "$RUNNER_TEMP/observation.json" --apply
      - run: npm run audit:etf-annual-performance
      - run: npm run audit:etf-consistency
      - run: npm run audit:calculator-series
      - run: node scripts/test-comparison-etf-details.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-bitcoin-observation
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: ignore
          retention-days: 35
      - name: Commit validated active data
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/bitcoin-yahoo-monthly.json scripts/source-snapshots/bitcoin-automated.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated active Bitcoin Yahoo data'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
