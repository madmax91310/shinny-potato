name: Scanner ETF validation
on:
  pull_request:
    paths:
      - 'src/pages/etf-scanner/**'
      - 'scripts/*etf-scanner.mjs'
      - '.github/workflows/scanner-validation.yml'
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/test-etf-scanner.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-etf-scanner.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: scanner-visual-checks
          path: test-artifacts/scanner
          retention-days: 7
