name: Verify the restored 2019 ETF market history
on:
  pull_request:
    paths: ['.github/workflows/probe-exh8-2019.yml', 'scripts/exh8_market_history.py']
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'fix/exh8-monthly-source-qualification-20261124' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: python -m unittest discover -s scripts -p test_exh8_market_history.py
      - name: Collect only the exact configured ETF using the ordinary producer
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          import json, os
          from pathlib import Path
          from data_automation import UTC, write_json_atomic
          from refresh_monthly_history import refresh
          scope = 'etfEuropeRetail'
          active_path = Path('src/data/non-bond-monthly-records.json')
          evidence_path = Path('scripts/source-snapshots/non-bond-monthly-active.json')
          read = lambda path: json.loads(Path(path).read_text())
          config = read('scripts/non-bond-monthly-sources.json')
          chosen = [r for r in config['series'] if r['id'] == scope]
          assert len(chosen) == 1
          current = read(active_path)
          merged, observations = refresh({'series':chosen}, current, read('src/data/non-bond-company-histories.json'), dt.datetime.now(UTC))
          observation, = observations['series']
          if observation['status'] != 'validated':
              raise ValueError(observation['reason'])
          evidence = read(evidence_path)
          record = observation['record']
          assert record['reviewedMarketWindowEvidence']['dailyTransitions'] == 251
          assert record['responseSha256'] == observation['evidence']['responseSha256']
          evidence[scope] = {k:v for k,v in observation['evidence'].items() if k not in ['rawResponse','points','anniversaryPoints']}
          write_json_atomic(active_path, merged)
          write_json_atomic(evidence_path, evidence)
          print(json.dumps(record['reviewedMarketWindowEvidence'], indent=2))
          write_json_atomic(Path(os.environ['RUNNER_TEMP'])/'exh8-ordinary-observation.json', observation)
          PY
      - name: Validate the active observation and its consumers
        run: |
          node scripts/audit-automated-monthly.mjs
          node scripts/test-exh8-market-consumers.mjs
          node scripts/test-review-reconciliation.mjs
      - name: Record the validated observation on this isolated PR only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/non-bond-monthly-records.json scripts/source-snapshots/non-bond-monthly-active.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record the exact 2019 EXH8 market qualification from the ordinary producer'
          git push origin HEAD:refs/heads/fix/exh8-monthly-source-qualification-20261124
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verified-exh8-window
          path: ${{ runner.temp }}/exh8-ordinary-observation.json
          retention-days: 35
