name: Probe exact public WisdomTree portfolios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 51edf5bc1e0fbf38d8253893ea36c11d74fe8729
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0 xlrd==2.0.2
      - name: Qualify ordinary public document access without writing data
        shell: bash
        run: |
          python -u - <<'PROBE'
          import sys,datetime,json
          from unittest.mock import patch
          sys.path.insert(0,'scripts')
          from issuer_documents import download
          from collect_wisdomtree_holdings import known_shares,collect_rankings
          selected={'IE0002Y8CX98','IE000W8WMSL2','IE00BDVPNG13','IE00BJGWQN72'}
          def page(url,**kwargs):
              return download(url,max_bytes=12_000_000,timeout=25,max_attempts=1).decode('utf-8')
          for share in known_shares():
              if share['isin'] not in selected:continue
              try:
                  with patch('collect_wisdomtree_holdings.public_page',side_effect=page):
                      value=collect_rankings(share,datetime.datetime.now(datetime.timezone.utc))
                  print(json.dumps({'isin':share['isin'],'qualified':True,'asOf':value['asOf'],'rows':len(value['rows']),'sha256':value['sha256']}))
              except Exception as error:
                  print(json.dumps({'isin':share['isin'],'qualified':False,'error':str(error)[:700]}))
          print('Read-only probe: no registry, financial date, workflow schedule or published file changed.')
          PROBE
