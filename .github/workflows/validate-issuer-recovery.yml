name: Read existing ETF validation evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: active-etf-observation
          path: evidence
          github-token: ${{ github.token }}
          repository: madmax91310/shinny-potato
          run-id: 39914482476
      - name: Expose bounded failure evidence as check annotations
        run: |
          python - <<'PYCODE'
          import pathlib,json
          results=[]
          def walk(obj,path):
              if isinstance(obj,dict):
                  for key,value in obj.items():
                      loc=path+'.'+key
                      if any(word in key.lower() for word in ['error','failure','failed']):
                          if value: results.append((loc,str(value)[:2000]))
                      elif isinstance(value,(dict,list)): walk(value,loc)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      if isinstance(v,(dict,list)):walk(v,path+'['+str(i)+']')
          for p in pathlib.Path('evidence').rglob('*.json'):
              if p.stat().st_size>20000000:continue
              try:walk(json.loads(p.read_text()),str(p))
              except (UnicodeError,json.JSONDecodeError):pass
          print('::notice title=Evidence read::'+str(len(results))+' non-empty failure fields')
          for path,value in results[:40]:
              value=(path+' '+value).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=Retained source failure::'+value)
          PYCODE
