name: Probe public issuer access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-access:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Read public exact-fund API without publishing financial data
        shell: bash
        run: |
          python - <<'PROBE'
          import json, urllib.request
          url='https://www.wisdomtree.com/api/fund-holdings/3104137'
          request=urllib.request.Request(url,headers={'User-Agent':'EpargnantLibre-Data/1.0','Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              rows=json.load(response)
          assert len(rows)>10
          assert all(r['wtClassID']==3104137 and r['fundTicker']=='WCLD LN' for r in rows)
          print('Public access confirmed; rows:',len(rows),'dates:',sorted({r['dt'] for r in rows}))
          print('Access qualification only; no registry or financial date was changed.')
          PROBE
