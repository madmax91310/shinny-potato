name: Refresh 35 portfolio exposure ETFs
on:
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/collect_exposure_expansion.py'
      - 'scripts/collect_public_issuer.py'
      - 'scripts/wisdomtree_ranked_fields.py'
      - 'scripts/wisdomtree_country_allocation.py'
      - 'scripts/collect_wisdomtree_holdings.py'
      - 'scripts/wisdomtree_api_holdings.py'
      - 'scripts/wisdomtree-holdings-classes.json'
      - 'scripts/issuer-access-routes.json'
      - 'scripts/collect_ishares_german.py'
      - 'scripts/collect_dws_etf.py'
      - 'scripts/collect_vaneck_etf.py'
      - 'scripts/collect_invesco_allocations.py'
      - 'scripts/collect_presentation_etf.py'
      - 'scripts/exposure-etf-expansion.json'
      - '.github/workflows/update-exposure-expansion.yml'
  pull_request:
    paths:
      - 'scripts/collect_exposure_expansion.py'
      - 'scripts/collect_public_issuer.py'
      - 'scripts/wisdomtree_ranked_fields.py'
      - 'scripts/wisdomtree_country_allocation.py'
      - 'scripts/collect_wisdomtree_holdings.py'
      - 'scripts/wisdomtree_api_holdings.py'
      - 'scripts/wisdomtree-holdings-classes.json'
      - 'scripts/issuer-access-routes.json'
      - 'scripts/test_wisdomtree_ranked_fields.py'
      - 'scripts/collect_ishares_german.py'
      - 'scripts/collect_dws_etf.py'
      - 'scripts/collect_vaneck_etf.py'
      - 'scripts/collect_invesco_allocations.py'
      - 'scripts/collect_presentation_etf.py'
      - 'scripts/exposure-etf-expansion.json'
      - 'scripts/test_exposure_expansion.py'
      - 'src/data/exposure-etf-expansion*'
      - '.github/workflows/update-exposure-expansion.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m pip install beautifulsoup4==4.15.0
      - run: python -m unittest discover -s scripts -p 'test_exposure_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_ranked_fields.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_country_allocation.py'
      - name: Collect exact-share observations
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_exposure_expansion.py --apply --report "$RUNNER_TEMP/exposure-expansion.json"
      - name: Validate expanded exposures
        run: npm run build && node scripts/test-exposure-expansion.mjs
      - name: Verify DCA holdings in browser
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          node scripts/playwright-dca-holdings-contracts.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exposure-expansion-observations
          path: |
            ${{ runner.temp }}/exposure-expansion.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Exact-share exposure checks passed'
      - name: Commit validated observations
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh exact-share ETF exposures' src/data/exposure-etf-expansion-records.json src/pages/dca-profiles/catalog.json src/pages/dca-profiles/exposures*.json src/pages/dca-profiles/holdings*.json
  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-exposure-expansion.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'ETF exposure collection incomplete; previous validated observations preserved.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
