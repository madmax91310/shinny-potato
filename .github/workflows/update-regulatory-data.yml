name: Update official regulatory data
on:
  schedule:
    - cron: '45 8 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-regulatory-data.yml'
      - 'scripts/collect_regulatory_data.py'
      - 'scripts/regulatory_extensions.py'
      - 'scripts/pel_generations.py'
      - 'scripts/collect_broker_tariffs.py'
      - 'scripts/broker_tariff_extensions.py'
      - 'scripts/broker_profiles.py'
      - 'scripts/broker_profile_qualification.py'
      - 'scripts/broker_profile_discovery.py'
      - 'scripts/broker_profile_sources.json'
      - 'scripts/broker_document_sources.py'
  pull_request:
    paths:
      - '.github/workflows/update-regulatory-data.yml'
      - 'scripts/*regulatory*'
      - 'scripts/*broker_tariffs*'
      - 'scripts/*broker_tariff*'
      - 'scripts/broker_profile*'
      - 'scripts/broker_document_sources.py'
      - 'scripts/fixtures/regulatory/**'
      - 'scripts/fixtures/broker-tariffs/**'
      - 'scripts/fixtures/broker-profiles/**'
      - 'src/data/*regulatory*'
      - 'src/data/broker-tariffs.js'
      - 'src/data/automated-broker-tariffs.json'
      - 'scripts/audit-broker-tweet-data.mjs'
      - 'scripts/test-broker-tweet-data.mjs'
      - 'src/pages/broker-comparator/**'
permissions:
  contents: read
jobs:
  refresh:
    concurrency:
      group: regulatory-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
      queue: max
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      failed: ${{ steps.fiscal.outcome == 'failure' || steps.brokers.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: brew install poppler
      - run: pip install beautifulsoup4==4.15.0
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_broker_tariff*.py'
      - run: python -m unittest discover -s scripts -p 'test_regulatory*.py'
      - name: "Validate observations: python scripts audit_broker_coverage.py"
        run: python scripts/audit_broker_coverage.py
      - name: "Validate observations: node scripts test-broker-automation.mjs"
        run: node scripts/test-broker-automation.mjs
      - name: "Validate observations: node scripts test-regulatory-consumers.mjs"
        run: node scripts/test-regulatory-consumers.mjs
      - name: "Collect observations: fiscal"
        id: fiscal
        continue-on-error: true
        run: python scripts/collect_regulatory_data.py --apply --output "$RUNNER_TEMP/fiscal-observation.json"
      - name: "Collect observations: brokers"
        id: brokers
        continue-on-error: true
        run: python scripts/collect_broker_tariffs.py --apply --output "$RUNNER_TEMP/broker-observation.json"
      - name: Report live source availability
        if: always()
        env:
          COLLECTION_FAILED: ${{ steps.fiscal.outcome == 'failure' || steps.brokers.outcome == 'failure' }}
        run: |
          if [ "$COLLECTION_FAILED" = 'true' ]; then
            echo 'Collecte partielle : les dernières observations qualifiées sont conservées. Voir les sources en échec dans regulatory-observations.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit the data used by the 28 broker tweets
        run: |
          node scripts/test-broker-tweet-data.mjs
          node scripts/audit-broker-tweet-data.mjs --observation "$RUNNER_TEMP/broker-observation.json" --output "$RUNNER_TEMP/broker-tweet-observation.json"
      - name: "Validate observations: python scripts audit_broker_coverage.py"
        run: python scripts/audit_broker_coverage.py
      - name: "Validate observations: node scripts test-broker-automation.mjs"
        run: node scripts/test-broker-automation.mjs
      - name: "Validate observations: node scripts test-regulatory-consumers.mjs"
        run: node scripts/test-regulatory-consumers.mjs
      - name: "Validate observations: npm run audit:data-catalog"
        run: npm run audit:data-catalog
      - name: "Validate observations: npm run audit:broker-evidence"
        run: npm run audit:broker-evidence
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: regulatory-observations
          path: ${{ runner.temp }}/*-observation.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh validated fiscal parameters and broker tariffs' src/data/automated-regulatory.json src/data/automated-broker-tariffs.json
      - name: Preserve data publication receipt
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-publication-receipt
          path: ${{ runner.temp }}/data-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 35
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
  report-failures:
    needs: [refresh, deploy]
    if: ${{ always() && github.event_name != 'pull_request' && needs.refresh.outputs.failed == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Une collecte réglementaire a échoué. Les dernières valeurs validées restent disponibles. Consulter regulatory-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
