name: Update Vanguard LifeStrategy data
on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/collect_lifestrategy.py'
      - 'scripts/lifestrategy-sources.json'
      - '.github/workflows/update-lifestrategy.yml'
  pull_request:
    paths:
      - 'scripts/collect_lifestrategy.py'
      - 'scripts/lifestrategy-sources.json'
      - 'scripts/test_lifestrategy.py'
      - 'scripts/test-lifestrategy.mjs'
      - 'src/data/lifestrategy*'
      - '.github/workflows/update-lifestrategy.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: pip install beautifulsoup4==4.15.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_lifestrategy.py'
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_lifestrategy.py --apply --output "$RUNNER_TEMP/lifestrategy.json"
      - name: "Validate observations: node scripts test-lifestrategy.mjs"
        run: node scripts/test-lifestrategy.mjs
      - run: node scripts/automation-gap-inventory.mjs --write
      - name: "Validate observations: npm run audit:instrument-catalog"
        run: npm run audit:instrument-catalog
      - name: "Validate observations: npm run build"
        run: npm run build
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: "Validate observations: node scripts playwright-lifestrategy.mjs"
        if: github.event_name == 'pull_request'
        run: node scripts/playwright-lifestrategy.mjs
      - name: "Validate observations: node scripts test-duel-titanium.mjs"
        if: github.event_name == 'pull_request'
        run: node scripts/test-duel-titanium.mjs
      - name: "Validate observations: node scripts test-portfolio-metallic.mjs"
        if: github.event_name == 'pull_request'
        run: node scripts/test-portfolio-metallic.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          name: lifestrategy-visual-checks
          path: |
            test-artifacts/lifestrategy
            test-artifacts/duel-titanium
            test-artifacts/portfolio-metallic
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lifestrategy-issuer-observation
          path: ${{ runner.temp }}/lifestrategy.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh Vanguard LifeStrategy issuer data' src/data/lifestrategy.json docs/automation-gaps.json docs/automation-gaps.md docs/app-inventory.md
      - name: Preserve data publication receipt
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-publication-receipt
          path: ${{ runner.temp }}/data-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 35
  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Collecte partielle : dernières valeurs fiables conservées ; données validées publiées si les contrôles réussissent.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
