name: Update Vanguard LifeStrategy data
on:
  schedule:
    - cron: '35 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/collect_lifestrategy.py'
      - '.github/workflows/update-lifestrategy.yml'
  pull_request:
    paths:
      - 'scripts/collect_lifestrategy.py'
      - 'scripts/test_lifestrategy.py'
      - 'scripts/test-lifestrategy.mjs'
      - 'src/data/lifestrategy*'
      - '.github/workflows/update-lifestrategy.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: pip install beautifulsoup4==4.15.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_lifestrategy.py'
      - id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_lifestrategy.py --apply --output "$RUNNER_TEMP/lifestrategy.json"
      - run: node scripts/test-lifestrategy.mjs
      - run: npm run audit:instrument-catalog
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lifestrategy-issuer-observation
          path: ${{ runner.temp }}/lifestrategy.json
          retention-days: 35
      - id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/lifestrategy.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Vanguard LifeStrategy issuer data'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.collect.outcome == 'failure'
        run: exit 1
  deploy:
    needs: refresh
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
