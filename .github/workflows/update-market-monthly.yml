name: Update active monthly market histories
on:
  schedule:
    - cron: '15 6 2,4,8,16 * *'
    # Recover failures and missing closed months; current histories are skipped.
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      series:
        description: 'Séries exactes à recollecter, séparées par des virgules ; vide = périmètre habituel'
        type: string
        default: ''
      ranking_sources:
        description: 'Sources classement/change exactes à reprendre ; fx = changes seulement, vide = sélection habituelle'
        type: string
        default: ''
      listings_only:
        description: 'Vérifier uniquement les 21 identités communes, sans recollecter les historiques'
        type: boolean
        default: false
      retry_failed:
        description: 'Reprendre les sources échouées ou dont le dernier mois clos manque ; ignorer les séries à jour'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'scripts/ensure-ci-runtime.sh'
      - 'src/pages/portfolio-duels/visualIdentity.js'
      - '.github/workflows/update-market-monthly.yml'
      - '.github/workflows/validate-record-market-monthly.yml'
      - '.github/workflows/monthly-market-publication-paths.json'
