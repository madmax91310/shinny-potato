permissions:
  contents: read
jobs:
  official-nav-source-controls:
    # Read-only supplier qualification must not wait behind an older PR's long
    # financial/render validation. It neither writes registries nor publishes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4
      - name: Install official document reader for new source controls
        run: bash scripts/ensure-ci-runtime.sh poppler
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare ordinary public browser export
        run: if ! test -x /usr/bin/google-chrome && ! test -x /usr/bin/chromium; then bash scripts/ensure-ci-runtime.sh chromium; fi
      - name: Qualify only configured NAV identities missing ordinary source controls
        id: collect
        continue-on-error: true
        run: python scripts/collect_official_share_history.py --missing-source-controls --output "$RUNNER_TEMP/new-nav-controls.json" --capture-dir "$RUNNER_TEMP/new-nav-control-sources"
      - name: Qualify the official complete H10 XML release (read-only)
        id: collectfx
        continue-on-error: true
        run: python scripts/qualify_h10_xml.py --output "$RUNNER_TEMP/h10-xml-controls.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: h10-xml-source-controls
          path: |
            ${{ runner.temp }}/h10-xml-controls.json
            ${{ runner.temp }}/h10-xml-controls.zip
          if-no-files-found: error
          retention-days: 35
      - name: Qualify the official Nasdaq closing-price source (read-only)
        id: nasdaqclose
        continue-on-error: true
        run: python scripts/nasdaq_month_close.py --source-control-fixture scripts/fixtures/starbucks-month-close-20261101 --output "$RUNNER_TEMP/nasdaq-close-source-control.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: nasdaq-close-source-controls
          path: ${{ runner.temp }}/nasdaq-close-source-control.json
          if-no-files-found: error
          retention-days: 35
      - name: Recollect BNKE and WOOD with current primary unit evidence (read-only)
        id: units
        continue-on-error: true
        run: |
          node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/unit-baseline.json"
          python scripts/refresh_monthly_history.py --only etfLU1829219390 etf_timber_ishares --baseline "$RUNNER_TEMP/unit-baseline.json" --output "$RUNNER_TEMP/unit-source-control.json" --evidence-output "$RUNNER_TEMP/unit-source-evidence.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: investment-unit-source-controls
          path: |
            ${{ runner.temp }}/unit-source-control.json
            ${{ runner.temp }}/unit-source-evidence.json
          if-no-files-found: error
      - name: Verify exact IMIE split comparison against current real sources
        run: |
          node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/imie-baseline.json"
          python scripts/refresh_monthly_history.py --only etfImie --baseline "$RUNNER_TEMP/imie-baseline.json" --output "$RUNNER_TEMP/imie-source-control.json" --evidence-output "$RUNNER_TEMP/imie-source-evidence.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: imie-split-source-controls
          path: |
            ${{ runner.temp }}/imie-source-control.json
            ${{ runner.temp }}/imie-source-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: new-nav-source-controls
          path: |
            ${{ runner.temp }}/new-nav-controls.json
            ${{ runner.temp }}/new-nav-control-sources/
          if-no-files-found: error
          retention-days: 35
      - name: Preserve a failed qualification after its evidence upload
        if: always()
        run: test "${{ steps.units.outcome }}" = 'success' && test "${{ steps.collect.outcome }}" = 'success' && test "${{ steps.collectfx.outcome }}" = 'success' && test "${{ steps.nasdaqclose.outcome }}" = 'success'
  refresh:
    concurrency:
      # Keep the shared writer lock until the candidate is validated and recorded.
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    uses: ./.github/workflows/validate-record-market-monthly.yml
    with:
      series: ${{ inputs.series || '' }}
      ranking_sources: ${{ inputs.ranking_sources || '' }}
      listings_only: ${{ inputs.listings_only == true }}
      retry_failed: ${{ inputs.retry_failed == true }}
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-market-monthly.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Une source mensuelle a échoué : historique précédent conservé. Les autres mises à jour validées ont été publiées si les audits et le déploiement ont réussi.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
