      - 'scripts/nasdaq_month_close.py'
      - 'scripts/test_nasdaq_month_close.py'
      - 'scripts/fixtures/starbucks-month-close-20261101/**'
      - 'scripts/qualified_split_comparison.py'
      - 'scripts/qualified_history_units.py'
