name: Update active monthly market histories
on:
  schedule:
    - cron: '15 6 2,4,8,16 * *'
    # Recover transient failures daily without downloading healthy histories.
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      series:
        description: 'Séries exactes à recollecter, séparées par des virgules ; vide = périmètre habituel'
        type: string
        default: ''
      ranking_sources:
        description: 'Sources classement/change exactes à reprendre ; fx = changes seulement, vide = sélection habituelle'
        type: string
        default: ''
      listings_only:
        description: 'Vérifier uniquement les 21 identités communes, sans recollecter les historiques'
        type: boolean
        default: false
      retry_failed:
        description: 'Reprendre uniquement les sources échouées ou manquantes ; conserver les données déjà qualifiées'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'src/pages/portfolio-duels/visualIdentity.js'
      - '.github/workflows/update-market-monthly.yml'
      - 'scripts/observation_rebase_guard.py'
      - 'scripts/test_observation_rebase.py'
      - 'scripts/derive_index_returns.py'
      - 'scripts/refresh_index_sources.py'
      - 'scripts/index-automation.json'
      - 'scripts/refresh_monthly_history.py'
      - 'scripts/qualified_split_comparison.py'
      - 'scripts/lib/split-comparison-proof.mjs'
      - 'scripts/test-split-comparison-proof.mjs'
      - 'scripts/fixtures/imie-split-2026/**'
      - 'scripts/qualified_distributions.py'
      - 'scripts/test_qualified_distributions.py'
      - 'scripts/issuer_nav_history.py'
      - 'scripts/bnp_nav_history.py'
      - 'scripts/test_bnp_nav_history.py'
      - 'scripts/collect_official_share_history.py'
      - 'scripts/qualify_monthly_candidates.py'
      - 'scripts/build-equity-history-links.mjs'
      - 'scripts/export-equity-candidates.mjs'
      - 'scripts/test_monthly_qualification.py'
      - 'scripts/export-monthly-candidates.mjs'
      - 'src/data/auto-history-identities.json'
      - 'src/data/qualified-listing-records.json'
      - 'scripts/qualified-listing-sources.json'
      - 'scripts/refresh_qualified_listings.py'
      - 'scripts/exchange_listing_refresh.py'
      - 'scripts/monthly-automation.json'
      - 'scripts/data_automation.py'
      - 'scripts/collect_ranking_sources.py'
      - 'scripts/market_transport.py'
      - 'scripts/test_market_transport.py'
      - 'scripts/test_cross_fx_fallback.py'
      - 'scripts/h10_fx.py'
      - 'scripts/test_h10_fx.py'
  pull_request:
    paths:
      - '.github/workflows/update-market-monthly.yml'
      - 'scripts/observation_rebase_guard.py'
      - 'scripts/test_observation_rebase.py'
      - 'scripts/derive_index_returns.py'
      - 'scripts/refresh_index_sources.py'
      - 'scripts/index-automation.json'
      - 'scripts/*monthly*'
      - 'scripts/qualified_split_comparison.py'
      - 'scripts/lib/split-comparison-proof.mjs'
      - 'scripts/test-split-comparison-proof.mjs'
      - 'scripts/fixtures/imie-split-2026/**'
      - 'scripts/data_automation.py'
      - 'scripts/test_data_automation.py'
      - 'src/data/*monthly*'
      - 'src/data/market-history*'
      - 'src/data/history-statistics.js'
permissions:
  contents: read
jobs:
  official-nav-source-controls:
    # Read-only supplier qualification must not wait behind an older PR's long
    # financial/render validation. It neither writes registries nor publishes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Install official document reader for new source controls
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare ordinary public browser export
        run: if ! test -x /usr/bin/google-chrome && ! test -x /usr/bin/chromium; then npx playwright install --with-deps chromium; fi
      - name: Qualify only configured NAV identities missing ordinary source controls
        id: collect
        continue-on-error: true
        run: python scripts/collect_official_share_history.py --missing-source-controls --output "$RUNNER_TEMP/new-nav-controls.json" --capture-dir "$RUNNER_TEMP/new-nav-control-sources"
      - name: Verify exact IMIE split comparison against current real sources
        run: |
          node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/imie-baseline.json"
          python scripts/refresh_monthly_history.py --only etfImie --baseline "$RUNNER_TEMP/imie-baseline.json" --output "$RUNNER_TEMP/imie-source-control.json" --evidence-output "$RUNNER_TEMP/imie-source-evidence.json"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: imie-split-source-controls
          path: |
            ${{ runner.temp }}/imie-source-control.json
            ${{ runner.temp }}/imie-source-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: new-nav-source-controls
          path: |
            ${{ runner.temp }}/new-nav-controls.json
            ${{ runner.temp }}/new-nav-control-sources/
          if-no-files-found: error
          retention-days: 35
      - name: Preserve a failed qualification after its evidence upload
        if: always()
        run: test "${{ steps.collect.outcome }}" = 'success'
  refresh:
    concurrency:
      # Serialize writers of automated-indices.json; keep PR validations independent.
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # Keep the initial validation and all three bounded commit attempts intact.
    # Each exhaustive financial validation takes about 40 minutes; another writer
    # may advance master during validation (observed in run 40494982858).
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      collection_failed: ${{ steps.collect.outcome == 'failure' || steps.rankings.outcome == 'failure' || steps.listings.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # A queued production run must start from the latest published data.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - name: Install issuer PDF parser
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s scripts -p 'test_observation_rebase.py'
      - run: python -m unittest discover -s scripts -p 'test_issuer_nav_history.py'
      - run: python -m unittest discover -s scripts -p 'test_abtc_nav_history.py'
      - run: python -m unittest discover -s scripts -p 'test_amundi_nav_history.py'
      - run: python -m unittest discover -s scripts -p 'test_amundi_distributing_nav.py'
      - run: python -m unittest discover -s scripts -p 'test_amundi_anniversary_prices.py'
      - run: python -m unittest discover -s scripts -p 'test_blackrock_income_history.py'
      - run: python -m unittest discover -s scripts -p 'test_dws_income_history.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_nav_export.py'
      - run: python -m unittest discover -s scripts -p 'test_wisdomtree_performance_history.py'
      - run: python -m unittest discover -s scripts -p 'test_landg_nav_history.py'
      - run: python -m unittest discover -s scripts -p 'test_bnp_nav_history.py'
      - run: node scripts/test-bnp-nav-consumers.mjs
      - run: node scripts/test-dws-income-consumers.mjs
      - run: node scripts/test-qualified-return-windows.mjs
      - run: node scripts/test-wisdomtree-nav-consumers.mjs
      - run: node scripts/test-income-nav-consumers.mjs
      - run: python -m unittest discover -s scripts -p 'test_monthly_control_renewal.py'
      - run: python -m unittest discover -s scripts -p 'test_monthly_automation.py'
      - run: python -m unittest discover -s scripts -p 'test_monthly_split_comparison.py'
      - run: python -m unittest discover -s scripts -p 'test_monthly_qualification.py'
      - run: python -m unittest discover -s scripts -p 'test_nasdaq_monthly.py'
      - run: python -m unittest discover -s scripts -p 'test_ranking_sources.py'
      - run: python -m unittest discover -s scripts -p 'test_cross_fx_fallback.py'
      - run: python -m unittest discover -s scripts -p 'test_h10_fx.py'
      - run: python -m unittest discover -s scripts -p 'test_market_transport.py'
      - run: node scripts/test-nasdaq-total-return.mjs
      - run: python -m unittest discover -s scripts -p 'test_data_automation.py'
      - run: python -m unittest discover -s scripts -p 'test_qualified_listings.py'
      - run: python -m unittest discover -s scripts -p 'test_exchange_listing_refresh.py'
      - name: Refresh exact issuer listing tables
        id: listings
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          LISTINGS_ONLY: ${{ inputs.listings_only == true }}
        run: |
          args=()
          if [ "$LISTINGS_ONLY" = 'true' ]; then args+=(--common-identities-only); fi
          python scripts/refresh_qualified_listings.py --apply --output "$RUNNER_TEMP/listing-observation.json" "${args[@]}"
      - name: Validate shared identity consumers
        run: node scripts/test-shared-listing-identities.mjs && node scripts/test-ai-tool-reuse.mjs

      - run: node scripts/build-equity-history-links.mjs
        if: inputs.listings_only != true
      - name: Qualify missing equity histories
        if: github.event_name != 'pull_request' && inputs.listings_only != true && inputs.series == ''
        run: |
          node scripts/export-equity-candidates.mjs > "$RUNNER_TEMP/equity-candidates.json"
          python scripts/qualify_monthly_candidates.py --candidates "$RUNNER_TEMP/equity-candidates.json" --limit 12 --apply
          node scripts/build-equity-history-links.mjs
      - name: Qualify missing exact-share monthly histories
        if: github.event_name != 'pull_request' && inputs.listings_only != true && inputs.series == ''
        run: |
          node scripts/export-monthly-candidates.mjs > "$RUNNER_TEMP/monthly-candidates.json"
          python scripts/qualify_monthly_candidates.py --candidates "$RUNNER_TEMP/monthly-candidates.json" --limit 12 --apply
      - run: node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/baseline.json"
        if: inputs.listings_only != true
      - name: "Collect observations: collect"
        if: github.event_name != 'pull_request' && inputs.listings_only != true
        id: collect
        continue-on-error: true
        env:
          RETRY_FAILED: ${{ inputs.retry_failed == true || (github.event_name == 'schedule' && github.event.schedule == '45 6 * * *') }}
          REQUESTED_SERIES: ${{ inputs.series }}
        run: |
          args=()
          if [ -n "$REQUESTED_SERIES" ]; then
            if [ "$RETRY_FAILED" = 'true' ]; then echo 'Sélection explicite incompatible avec retry_failed'; exit 1; fi
            requested="${REQUESTED_SERIES//,/ }"
            read -r -a selected <<< "$requested"
            args+=(--only "${selected[@]}")
          elif [ "$RETRY_FAILED" = 'true' ]; then args+=(--retry-failed); fi
          python scripts/refresh_monthly_history.py --baseline "$RUNNER_TEMP/baseline.json" --output "$RUNNER_TEMP/monthly-observation.json" --apply "${args[@]}"
      - name: Refresh exact ranking histories and ECB conversion
        id: rankings
        if: github.event_name != 'pull_request' && inputs.listings_only != true
        continue-on-error: true
        env:
          RETRY_FAILED: ${{ inputs.series != '' || inputs.retry_failed == true || (github.event_name == 'schedule' && github.event.schedule == '45 6 * * *') }}
          REQUESTED_RANKING_SOURCES: ${{ inputs.ranking_sources }}
          CROSS_FX_EVIDENCE_DIR: ${{ runner.temp }}/cross-fx-evidence
        run: |
          args=()
          if [ -n "$REQUESTED_RANKING_SOURCES" ]; then
            requested="${REQUESTED_RANKING_SOURCES//,/ }"
            read -r -a selected <<< "$requested"
            if [ "${#selected[@]}" = '0' ]; then echo 'Empty explicit ranking scope'; exit 1; fi
            args+=(--only "${selected[@]}")
          elif [ "$RETRY_FAILED" = 'true' ]; then args+=(--retry-failed); fi
          python scripts/collect_ranking_sources.py --apply --output "$RUNNER_TEMP/ranking-collection-status.json" "${args[@]}"
      - run: node scripts/build-equity-history-links.mjs
        if: inputs.listings_only != true
      - run: node scripts/build-ranking-annual.mjs && node scripts/test-performance-rankings.mjs
        if: inputs.listings_only != true
      - run: node scripts/build-monthly-duel-returns.mjs && node scripts/build-equity-duel-returns.mjs
        if: inputs.listings_only != true
      - name: "Collect observations: python scripts refresh_index_sources.py --only-derived --output RUNNER_TEMP derived-index-observation.json --apply"
        if: inputs.listings_only != true
        run: python scripts/refresh_index_sources.py --only-derived --output "$RUNNER_TEMP/derived-index-observation.json" --apply
      - name: "Validate observations: python -m unittest discover -s scripts -p  test_remaining_index_sources.py"
        if: inputs.listings_only != true
        run: python -m unittest discover -s scripts -p 'test_remaining_index_sources.py'
      - name: "Validate observations: python -m unittest discover -s scripts -p  test_index_extensions.py"
        if: inputs.listings_only != true
        run: python -m unittest discover -s scripts -p 'test_index_extensions.py'
      - name: "Validate observations: npm run audit:index-facts"
        if: inputs.listings_only != true
        run: npm run audit:index-facts
      - name: "Validate observations: node scripts test-automated-indices.mjs"
        if: inputs.listings_only != true
        run: node scripts/test-automated-indices.mjs
      - name: "Validate observations: npm run audit:calculator-series"
        if: inputs.listings_only != true
        run: npm run audit:calculator-series
      - name: "Validate observations: node scripts test-monthly-consumers.mjs"
        if: inputs.listings_only != true
        run: node scripts/test-monthly-consumers.mjs
      - name: "Validate observations: node scripts test-etf-tool-connections.mjs"
        if: inputs.listings_only != true
        run: node scripts/build-performance-links.mjs && node scripts/test-etf-tool-connections.mjs && node scripts/audit-asset-tool-routing.mjs --write && node scripts/test-asset-routing-blockers.mjs && node scripts/test-distinct-asset-routing.mjs
      - name: "Validate observations: npm run audit:data-catalog"
        run: npm run audit:data-catalog
      - name: "Validate observations: npm run audit:data-provenance"
        run: npm run audit:data-provenance
      - name: "Validate observations: npm run verify:tweet-midi"
        if: inputs.listings_only != true
        run: npm run verify:tweet-midi
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: monthly-market-observation
          path: |
            ${{ runner.temp }}/monthly-observation.json
            ${{ runner.temp }}/derived-index-observation.json
            ${{ runner.temp }}/derived-index-observation.contract-plan.json
            ${{ runner.temp }}/listing-observation.json
            ${{ runner.temp }}/ranking-collection-status.json
            src/data/monthly-fx.json
            ${{ runner.temp }}/cross-fx-evidence/
          if-no-files-found: ignore
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Verify histories reach all publication tools
        if: inputs.listings_only != true
        run: node scripts/build-dca-exposures.mjs && node scripts/audit-portfolio-routing.mjs
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          VALIDATED_DATA_CHECK: ${{ inputs.listings_only == true && 'node scripts/test-shared-listing-identities.mjs && node scripts/test-ai-tool-reuse.mjs' || 'bash scripts/validate-market-publication.sh' }}
          VALIDATED_DATA_PREPARE: ${{ inputs.listings_only != true && 'bash scripts/prepare-market-projections.sh' || '' }}
          VALIDATED_DATA_DERIVED_PATHS: '["src/data/equity-history-links.json","docs/equity-identity-gaps.json","src/data/monthly-duel-returns.json","src/data/equity-duel-returns.json","src/data/ranking-annual.json","src/data/ranking-index-annual.json","src/data/ranking-ftse.json","src/data/performance-links.json","src/data/simulation-links.json"]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ '${{ inputs.listings_only }}' == 'true' ]]; then
            bash scripts/commit-validated-data.sh 'Refresh verified common listing identities' src/data/shared-listing-identities.json
          else
          bash scripts/commit-validated-data.sh 'Refresh validated monthly market histories' src/data/equity-history-links.json docs/equity-identity-gaps.json src/data/performance-links.json src/data/simulation-links.json src/data/tool-links.json docs/asset-tool-routing.json docs/asset-tool-routing.md docs/distinct-asset-routing.json src/data/equity-duel-returns.json src/data/monthly-duel-returns.json src/data/automated-indices.json src/data/automated-monthly.json src/data/automated-etf-monthly.json scripts/source-snapshots/monthly-automated.json scripts/source-snapshots/monthly-collection-status.json src/data/anniversary-levels.json scripts/monthly-automation.json scripts/source-snapshots/monthly-qualification-status.json src/data/auto-history-identities.json src/data/qualified-listing-records.json src/data/shared-listing-identities.json src/data/ranking-histories.json src/data/monthly-fx.json src/data/ranking-annual.json src/data/ranking-index-annual.json src/data/ranking-ftse.json scripts/source-snapshots/ranking-histories.json scripts/source-snapshots/ranking-collection-status.json docs/asset-field-coverage.md public/data/asset-field-coverage.json
          fi
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-market-monthly.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.collection_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Une source mensuelle a échoué : historique précédent conservé. Les autres mises à jour validées ont été publiées si les audits et le déploiement ont réussi.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
