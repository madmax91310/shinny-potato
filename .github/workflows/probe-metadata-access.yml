name: Probe public metadata page access
on:
  push:
    branches: [probe/metadata-public-page-access]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - run: node scripts/probe-fortuneo-targets.mjs
        env:
          PROBE_TARGETS: ${{ runner.temp }}/fortuneo-targets.json
      - run: python scripts/probe_fortuneo_metadata.py
        env:
          PROBE_TARGETS: ${{ runner.temp }}/fortuneo-targets.json
          PROBE_OUTPUT: ${{ runner.temp }}/public-metadata-access
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: public-metadata-page-access
          path: ${{ runner.temp }}/public-metadata-access
          retention-days: 14
