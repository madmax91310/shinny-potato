name: Update insurance presentations
on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/update-insurance.yml', 'scripts/*insurance*', 'scripts/collect_scpi.py', 'scripts/test_scpi.py', 'scripts/fixtures/linxea-vie-essential.txt', 'scripts/fixtures/insurance/**', 'scripts/publication_periods.py', 'scripts/test_publication_periods.py', 'scripts/test_presentation_expansion.py', 'scripts/fixtures/presentation-expansion/**', 'src/data/*insurance*', 'src/pages/insurance-presentation/**']
  push:
    branches: [master]
    paths: ['scripts/publication_periods.py', 'scripts/test_publication_periods.py', '.github/workflows/update-insurance.yml', 'scripts/collect_insurance.py', 'scripts/collect_other_insurance.py', 'scripts/insurance_literal.py', 'scripts/collect_scpi.py', 'scripts/fixtures/linxea-vie-essential.txt']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: insurance-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install beautifulsoup4==4.15.0
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_scpi.py'
      - run: python -m unittest discover -s scripts -p 'test_insurance.py'
      - run: python -m unittest discover -s scripts -p 'test_source_revision.py'
      - run: python -m unittest discover -s scripts -p 'test_presentation_expansion.py'
      - run: python -m unittest discover -s scripts -p 'test_publication_periods.py'
      - name: "Collect observations: collect"
        id: collect
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: python scripts/collect_insurance.py --apply --output "$RUNNER_TEMP/insurance-observation.json"
      - name: "Validate observations: node scripts test-insurance.mjs"
        run: node scripts/test-insurance.mjs
      - name: "Validate observations: npm run audit:data-catalog"
        run: npm run audit:data-catalog
      - name: "Validate observations: npm run build"
        run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: insurance-observations
          path: |
            ${{ runner.temp }}/insurance-observation.json
            ${{ runner.temp }}/**/*.contract-plan.json
          retention-days: 35
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          VALIDATED_DATA_CHECK: bash scripts/validate-producer-publication.sh insurance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh validated official insurance presentations' src/data/automated-insurance.json
  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
      producer: update-insurance.yml

  report-failures:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo 'Collecte assurance-vie partielle : les dernières fiches validées sont conservées. Voir insurance-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
