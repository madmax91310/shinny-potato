name: Validate automated tool expansion
on:
  pull_request:
    paths:
      - 'scripts/*round3*'
      - 'src/data/round3-fund-sheets.js'
      - '.github/workflows/validate-tool-expansion-round3.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: round3-qualification-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r scripts/company-requirements.txt
      - run: npm ci
      - run: python scripts/validate_round3_funds.py
      - run: python scripts/collect_qualified_exposures.py --apply --only world-materials history-healthcare-innovation --output "$RUNNER_TEMP/round3-funds.json"
      - run: python scripts/refresh_index_sources.py --apply --require-complete --ids msci-world-materials msci-world-utilities --output "$RUNNER_TEMP/round3-indices.json"
      - run: node scripts/export-monthly-baseline.mjs > "$RUNNER_TEMP/round3-baseline.json"
      - run: python scripts/refresh_monthly_history.py --apply --baseline "$RUNNER_TEMP/round3-baseline.json" --only etfWorldMaterials etfWorldUtilities etfHealthcareInnovation etfCloudWisdomtree --output "$RUNNER_TEMP/round3-monthly.json"
      - run: python scripts/refresh_anniversary_levels.py --apply --only etfWorldMaterials etfWorldUtilities etfHealthcareInnovation etfCloudWisdomtree --output "$RUNNER_TEMP/round3-latest-levels.json"
      - run: node scripts/test-qualified-exposures.mjs
      - run: node scripts/test-automated-indices.mjs
      - run: node scripts/test-monthly-consumers.mjs
      - run: node scripts/test-etf-tool-connections.mjs
      - run: node scripts/test-portfolio-recipes.mjs
      - run: npm run audit:portfolio-duels
      - run: npm run audit:instrument-catalog
      - run: npm run audit:data-catalog
      - run: npm run audit:data-provenance
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-tools.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: round3-source-validation
          path: |
            ${{ runner.temp }}/round3-*.json
            test-artifacts/
          retention-days: 14
