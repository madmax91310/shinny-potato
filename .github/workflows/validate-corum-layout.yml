name: Validate Corum quarterly source recovery
on:
  push:
    branches: [fix/corum-quarterly-source-layout]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/corum-quarterly-source-layout
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0 Pillow==12.3.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - run: npm ci
      - run: python -m unittest discover -s scripts -p test_corum.py
      - run: python -m unittest discover -s scripts -p test_corum_vector.py
      - run: python -m unittest discover -s scripts -p test_extended_scpi.py
      - name: Collect three current quarterly publications
        run: |
          PYTHONPATH=scripts python - <<'PYCODE'
          from concurrent.futures import ThreadPoolExecutor
          import datetime as dt,json,pathlib
          from collect_scpi import refresh,OUTPUT
          from collect_corum import collect,PRODUCTS
          today=dt.date.today()
          with ThreadPoolExecutor(max_workers=3) as pool:
              futures={key:pool.submit(collect,key,today) for key in PRODUCTS}
              previous=json.loads(OUTPUT.read_text())
              data,observations=refresh(previous,{key:lambda day,f=f:f.result() for key,f in futures.items()},today)
          pathlib.Path('corum-observations.json').write_text(json.dumps(observations,ensure_ascii=False,indent=2))
          assert all(o['status']=='success' for o in observations),observations
          OUTPUT.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PYCODE
      - run: node scripts/test-scpi.mjs
      - run: npm run audit:data-catalog
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-scpi-ui.mjs
      - name: Retain validated quarterly observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/automated-scpi.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated Corum September quarterly observations'
            git push origin HEAD:fix/corum-quarterly-source-layout
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: corum-quarterly-validation
          path: |
            corum-observations.json
            src/data/automated-scpi.json
          retention-days: 14
