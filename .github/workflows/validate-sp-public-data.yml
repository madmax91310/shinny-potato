name: Validate S&P public composition data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4 pillow
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - if: runner.os == 'macOS'
        run: brew list poppler tesseract >/dev/null 2>&1 || brew install poppler tesseract
      - name: Test exact advertised static PDF routes with the existing financial parser
        run: python scripts/probe-sp-static-pdf.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sp-static-pdf-${{ matrix.os }}
          path: ${{ runner.temp }}/sp-static-pdf.json
