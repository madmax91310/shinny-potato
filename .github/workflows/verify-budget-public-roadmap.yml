name: Inspect verified Budget PNGs
on:
  push:
    branches: [verify/budget-public-roadmap-20261116]
    paths: [.github/workflows/verify-budget-public-roadmap.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-public-budget-roadmap-20261116
  cancel-in-progress: true
jobs:
  inspect-png:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          run-id: 43868408272
          name: public-budget-roadmap-verification-390
          github-token: ${{ github.token }}
          path: evidence
      - name: Read the original verified PNG bytes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const verification=JSON.parse(readFileSync('evidence/public-budget-verification.json','utf8'))
          const files=['budget-roadmap-public/390-editorial-roadmap-befire-first-home-2026-11-16-detailed-4.png','budget-roadmap-public/390-editorial-roadmap-lux-one-income-2026-11-16-summary-1.png']
          for(const [index,file]of files.entries()){
            const bytes=readFileSync('evidence/'+file)
            const recorded=verification.reopened.find(row=>row.file===file)
            assert(recorded)
            assert.equal(createHash('sha256').update(bytes).digest('hex'),recorded.sha256)
            assert.deepEqual(recorded.dimensions,[1080,1350])
            console.log('VERIFIED_RAW_PNG_'+index+'_BEGIN')
            const data=bytes.toString('base64')
            for(let at=0;at<data.length;at+=12000)console.log(data.slice(at,at+12000))
            console.log('VERIFIED_RAW_PNG_'+index+'_END')
          }
          console.log('Original verified public PNGs:',JSON.stringify({before:verification.before,after:verification.after,files}))
          JS
      - name: Independently read the visible PNG labels
        run: |
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract evidence/budget-roadmap-public/390-editorial-roadmap-befire-first-home-2026-11-16-detailed-4.png stdout -l eng --psm 11
          tesseract evidence/budget-roadmap-public/390-editorial-roadmap-lux-one-income-2026-11-16-summary-1.png stdout -l eng --psm 11
