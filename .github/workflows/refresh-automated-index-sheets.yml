name: Refresh fully automated index sheets
on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/refresh-automated-index-sheets.yml'
      - 'scripts/index-automation.json'
      - 'scripts/refresh_index_sources.py'
      - 'scripts/collect_index_documents.py'
      - 'scripts/test_world_sector_indices.py'
      - 'scripts/test_index_composition_gate.py'
      - 'scripts/collect_sp_composition.py'
      - 'scripts/test_complete_index_sheets.py'
      - 'src/data/automated-index-sheets.js'
      - 'src/data/index-factsheets.js'
      - 'src/data/index-facts.js'
      - 'src/pages/factsheet-tweets/**'
permissions:
  contents: read
jobs:
  collect:
    # Every displayed field must pass a real unattended collection.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: active-market-data-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'production' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    outputs:
      failed: ${{ steps.partial.outputs.failed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m unittest discover -s scripts -p 'test_complete_index_sheets.py'
      - run: python -m unittest discover -s scripts -p 'test_world_sector_indices.py'
      - run: python -m unittest discover -s scripts -p 'test_index_composition_gate.py'
      - name: Collect selected indices directly and require every displayed field
        run: >-
          python scripts/refresh_index_sources.py --require-complete --apply
          --output "${{ runner.temp }}/selected-index-observations.json"
          --ids sp500-equal-weight world-ex-usa msci-world-minimum-volatility-usd
          msci-world-sector-neutral-quality msci-world-enhanced-value
          msci-world-materials msci-world-utilities
          msci-world-health-care msci-world-financials msci-world-energy
      - name: "Validate observations: node scripts test-automated-index-sheets.mjs"
        run: node scripts/test-automated-index-sheets.mjs
      - name: "Validate observations: node scripts test-automated-indices.mjs"
        run: node scripts/test-automated-indices.mjs
      - name: "Validate observations: npm run audit:index-facts"
        run: npm run audit:index-facts
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: complete-index-sheet-observations
          path: ${{ runner.temp }}/selected-index-observations.json
          retention-days: 35
      - name: Detect partial failures
        id: partial
        if: always()
        run: python scripts/report_partial_failures.py "$RUNNER_TEMP/selected-index-observations.json"
      - name: Validate collected observations
        run: echo 'Mandatory observation checks passed'
      - name: Commit validated observations
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/commit-validated-data.sh 'Refresh complete automated index sheets' src/data/automated-indices.json
      - name: Preserve data publication receipt
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-publication-receipt
          path: ${{ runner.temp }}/data-publication-receipt.json
          if-no-files-found: ignore
          retention-days: 35
  deploy:
    needs: collect
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.collect.outputs.commit_sha }}
  report-failures:
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.failed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Collecte partielle des fiches d’indices : les dernières valeurs validées sont conservées. Voir complete-index-sheet-observations.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
