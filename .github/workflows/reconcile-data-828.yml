name: Reconcile qualified data for PR 828
on:
  push:
    branches: [codex/reconcile-data-828]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Reconcile whole observations by exact fund and original date
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          head = "b2c8f9c2220c27773fd8167552597543a902c694"
          master = "f9e36e5bbe31d2a21b216b76b7a595a78eede910"
          base = subprocess.check_output(["git","merge-base",head,master],text=True).strip()
          paths = ["src/data/dca-complete-holdings.json","src/data/dca-holdings-status.json"]
          subprocess.run(["git","merge","--no-commit","--no-ff",master],check=False)
          conflicts = subprocess.check_output(["git","diff","--name-only","--diff-filter=U"],text=True).splitlines()
          assert set(conflicts) <= set(paths), conflicts
          def read(ref,path):
              return json.loads(subprocess.check_output(["git","show",f"{ref}:{path}"],text=True))
          merged = {}
          for path in paths:
              b,l,r = [read(ref,path) for ref in [base,head,master]]
              result = {}
              for key in sorted(b.keys() | l.keys() | r.keys()):
                  bv,lv,rv = b.get(key),l.get(key),r.get(key)
                  if lv == bv: chosen = rv
                  elif rv == bv or lv == rv: chosen = lv
                  else:
                      assert isinstance(lv,dict) and isinstance(rv,dict), (path,key)
                      if path.endswith("complete-holdings.json"):
                          rank = lambda value:(value.get("asOf",""),value.get("checkedAt",""))
                      else:
                          rank = lambda value:(value.get("checkedAt",""),value.get("lastSuccessAt",""))
                      chosen = max([lv,rv],key=rank)
                  if chosen is not None: result[key] = chosen
              assert set(l) | set(r) <= set(result), path
              merged[path] = result
              Path(path).write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
              print(path, len(l),len(r),"->",len(result))
          holdings,status = [merged[p] for p in paths]
          for isin, observation in holdings.items():
              state = status.get(isin,{})
              if state.get("status") == "validated":
                  assert state.get("asOf") == observation.get("asOf"), (isin,state.get("asOf"),observation.get("asOf"))
          subprocess.run(["git","add",*paths],check=True)
          subprocess.run(["git","commit","-m","Reconcile qualified holdings with latest automated observations"],check=True)
          
          PY
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: pip install beautifulsoup4==4.15.0
      - run: python -m unittest discover -s scripts -p 'test_physical_holdings.py' && python -m unittest discover -s scripts -p 'test_lifestrategy_holdings.py'
      - run: node scripts/build-dca-exposures.mjs && npm run test:dca
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/playwright-live-data-connections.mjs --physical
      - name: Publish reconciled commit after validation
        run: git push origin HEAD:codex/reconcile-data-828
