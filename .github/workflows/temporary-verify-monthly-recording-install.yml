name: Verify monthly recording dependencies (temporary branch)
on:
  push:
    branches: [fix/monthly-record-browser-install-20261124]
    paths: [.github/workflows/temporary-verify-monthly-recording-install.yml]
permissions:
  contents: read
jobs:
  recording-dependencies:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_audit_workflows.py'
      - name: Run exactly the production recording dependency commands
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text = Path('.github/workflows/validate-record-market-monthly.yml').read_text()
          step = text.split('      - name: Install recording dependencies\n', 1)[1].split('      - name:', 1)[0]
          Path('.monthly-recording-install-test.sh').write_text(dedent(step.split('        run: |\n', 1)[1]))
          PY
          bash -e .monthly-recording-install-test.sh
          node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch(); await browser.close()"
