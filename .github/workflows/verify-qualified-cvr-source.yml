name: Verify qualified cash rights against current issuer books
on:
  push:
    branches: [probe/qualified-cvr-source-20261112]
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: python -m pip install --require-hashes -r scripts/python-installer-requirements.txt
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4==4.15.0 xlrd==2.0.2
      - name: Validate immutable legal references and real response regressions
        run: python -m unittest discover -s scripts -p test_dca_qualified_cash_rights.py
      - name: Ordinary producer entry point, two exact instruments only
        run: |
          mkdir -p "$RUNNER_TEMP/cvr-proof"
          python scripts/collect_dca_complete_holdings.py --apply --only IE00BYZK4776 IE00BYZK4669 --output "$RUNNER_TEMP/cvr-proof/source-report.json"
      - name: Project and verify current real books and overlap
        env:
          PROOF_OUTPUT: ${{ runner.temp }}/cvr-proof
        run: |
          node scripts/build-dca-exposures.mjs
          node scripts/private-cvr-proof.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: current-qualified-cvr-source
          path: ${{ runner.temp }}/cvr-proof
