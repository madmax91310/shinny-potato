name: Record confirmed AI portfolio request
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  record:
    if: github.event.issue.user.id == github.event.repository.owner.id && github.event.sender.id == github.event.repository.owner.id && startsWith(github.event.issue.title, 'Portefeuilles IA · ')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: active-market-data-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      issues: write
    outputs:
      commit_sha: ${{ steps.record.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r scripts/ai-portfolios-requirements.txt
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - id: record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/process-ai-owner-issue.mjs
  deploy:
    needs: record
    if: needs.record.outputs.commit_sha != ''
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    uses: ./.github/workflows/publish-validated-data.yml
    with:
      ref: ${{ needs.record.outputs.commit_sha }}
      producer: ai-owner-requests.yml
