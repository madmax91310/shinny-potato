name: Prune untouched superseded Pages validations
'on':
  push:
    branches: [ops/budget-pages-prune-20261101]
permissions:
  contents: read
  actions: write
jobs:
  prune:
    if: github.repository == 'madmax91310/shinny-potato'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve all work and cancel only two untouched superseded gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_RUN'
          import json, os, subprocess
          repo = "madmax91310/shinny-potato"
          release = "94f916ba5526d57ff79dba815d2fdd92ee083b72"
          assert os.environ["GITHUB_REPOSITORY"] == repo

          def api(path, method=None):
              args = ["gh", "api"]
              if method:
                  args += ["--method", method]
              raw = subprocess.check_output(args + [path], text=True)
              return json.loads(raw) if raw.strip() else {}

          prefix = f"/repos/{repo}"
          assert api(f"{prefix}/compare/{release}...master")["status"] in {"ahead", "identical"}
          targets = {
              41340334397: "7f7a40b96cb139fc734966a4e878d2130a977fb2",
              41342326195: "3d1791ccf597f13b32f95374ff678cb4c90d6adb",
          }
          for run_id, expected in targets.items():
              run = api(f"{prefix}/actions/runs/{run_id}")
              assert run["workflow_id"] == 334128726
              assert run["event"] == "push" and run["head_branch"] == "master"
              assert run["head_sha"] == expected
              assert api(f"{prefix}/compare/{expected}...{release}")["status"] in {"ahead", "identical"}
              jobs = api(f"{prefix}/actions/runs/{run_id}/jobs?per_page=100")
              if run["status"] not in {"pending", "queued"} or jobs.get("total_count", 0) != 0:
                  print(f"Preserved run {run_id}: status={run['status']}, jobs={jobs.get('total_count')}")
                  continue
              api(f"{prefix}/actions/runs/{run_id}/cancel", "POST")
              print(f"Cancelled untouched superseded master validation {run_id}, ancestor {expected} of release {release}")
          PY_RUN
