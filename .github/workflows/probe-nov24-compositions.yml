# Final isolated validation
name: Diagnose Vanguard and calendar data
on:
  push:
    branches: [fix/pages-composition-year-end-20261124]
    paths: [.github/workflows/probe-nov24-compositions.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4==4.15.0
      - name: Inspect official LifeStrategy table and effective date
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt,hashlib,json,re
          from concurrent.futures import ThreadPoolExecutor
          from collect_lifestrategy import CONFIG, collect_one
          from issuer_documents import download,pdf_text
          from bs4 import BeautifulSoup
          now=dt.datetime.now(dt.timezone.utc)
          def one(config):
              equity,code,isin=config
              url=f'https://www.fr.vanguard/professionnel/produits/etf/lifestrategy/{code}/lifestrategy-{equity}-equity-ucits-etf-eur-accumulating'
              html=download(url).decode()
              soup=BeautifulSoup(html,'html.parser')
              links=sorted({a['href'] for a in soup.find_all('a',href=True) if f'_{code}_FR_INT_FR.pdf' in a['href']})
              for link in links:
                  b=download(link);t=pdf_text(b)
                  blocks=[t[m.start():m.start()+2050] for m in re.finditer('Allocation aux fonds Vanguard sous-jacents',t)]
                  try:
                      from collect_lifestrategy import parse_sources, fetch_api
                      record=parse_sources(html,b,fetch_api(code),config,now)
                      parsed=[record['holdings']['asOf'],len(record['holdings']['rows'])]
                  except Exception as e:
                      import traceback
                      parsed=traceback.format_exc()
                  container=soup.find('europe-core-asset-allocations')
                  print(json.dumps({'isin':isin,'parsed':parsed,'tables':len(container.find_all('table')),
                    'rows':[[cell.get_text(' ',strip=True) for cell in row.find_all('td')] for row in container.find_all('tr')],
                    'pdfSha':hashlib.sha256(b).hexdigest(),'printedAllocation':blocks,
                    'webAllocation':soup.find('europe-core-asset-allocations').get_text(' ',strip=True)},ensure_ascii=False))
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(one, CONFIG))
          PY
      - name: Exercise ordinary Vanguard entry point without writing production
        run: |
          python -m unittest discover -s scripts -p 'test_lifestrategy*py'
          python scripts/collect_lifestrategy.py --validate-verified-prior-period --output "$RUNNER_TEMP/lifestrategy.json"
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c scripts/python-constraints.txt beautifulsoup4==4.15.0
      - run: python -m unittest discover -s scripts -p 'test_ranking_sources.py'
      - run: node scripts/test-validated-data-publisher.mjs
      - run: node scripts/test-annual-rollover.mjs && node scripts/test-exact-share-annual-consumers.mjs
  action-upstream:
    runs-on: ubuntu-latest
    outputs:
      needs_code: ${{ steps.reject.outcome == 'failure' }}
    steps:
      - id: reject
        run: exit 1
  action-recovery:
    needs: action-upstream
    if: ${{ !cancelled() && needs.action-upstream.outputs.needs_code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' 'Recovery runs even after upstream failure'
